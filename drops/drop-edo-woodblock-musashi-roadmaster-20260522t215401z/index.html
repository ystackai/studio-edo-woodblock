<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<title>Way of the Brush and Blade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#1a1510;color:#f4ead8;font-family:'Noto Serif JP','YuMincho','Hiragino Mincho ProN','Georgia','Times New Roman',serif;font-display:swap}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100%;max-width:800px;max-height:1000px;background:#1f1a14;overflow:hidden;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto;transition:opacity .8s}
.screen.active{display:flex}
.screen.fade-out{opacity:0;pointer-events:none}
.screen.fade-in{opacity:1}
.bg-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.25;filter:sepia(.6) saturate(.4) contrast(1.1);z-index:0}
.bg-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,21,16,.7),rgba(26,21,16,.85))}
.bg-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(139,69,19,.08),transparent 70%);z-index:1}
.content{position:relative;z-index:2;text-align:center;max-width:600px;width:100%;padding:10px}
.ink-line{height:2px;background:linear-gradient(90deg,transparent,#8B4513,rgba(139,69,19,.3),transparent);margin:12px auto;width:80%}
.ink-line-thin{height:1px;background:linear-gradient(90deg,transparent,rgba(244,234,216,.3),transparent);margin:8px auto;width:60%}
h1{font-size:clamp(28px,7vw,52px);font-weight:700;letter-spacing:.06em;color:#f4ead8;text-shadow:0 2px 20px rgba(0,0,0,.5);line-height:1.2}
h2{font-size:clamp(20px,5vw,36px);font-weight:600;letter-spacing:.04em;color:#f4ead8}
.screen.active h2{animation:titleReveal .5s ease-out forwards}
@keyframes titleReveal{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
h3{font-size:clamp(16px,3.5vw,24px);font-weight:500;color:#d4c4a8;margin-bottom:6px}
.subtitle{font-size:clamp(13px,2.5vw,18px);color:#b9a88d;letter-spacing:.08em;margin-bottom:4px}
.screen.active .subtitle{animation:subtitleReveal .8s ease-out forwards;animation-delay:.3s;opacity:0}
@keyframes subtitleReveal{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
.btn-start-glow{box-shadow:0 0 30px rgba(139,69,19,.15)}
.body-text{font-size:clamp(14px,2.2vw,17px);line-height:1.7;color:#cdbb9d;margin:10px 0}
.btn{appearance:none;border:1px solid rgba(139,69,19,.5);background:rgba(26,21,16,.8);color:#f4ead8;padding:12px 28px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:clamp(14px,2.2vw,17px);letter-spacing:.04em;transition:all .3s;margin:6px;min-width:160px}
.btn:hover,.btn:focus-visible{background:#8B4513;border-color:#8B4513;color:#fff;outline:none;transform:translateY(-1px);box-shadow:0 0 20px rgba(139,69,19,.3);transition:all .2s ease}
.btn-choice:hover,.btn-choice:focus-visible{box-shadow:0 0 30px rgba(139,69,19,.25),inset 0 0 20px rgba(139,69,19,.1)}
.btn:active{transform:translateY(0)}
.btn-secondary{border-color:rgba(244,234,216,.3);background:rgba(26,21,16,.5);color:#d4c4a8}
.btn-secondary:hover,.btn-secondary:focus-visible{background:rgba(139,69,19,.4);border-color:rgba(139,69,19,.6)}
.btn-small{padding:8px 16px;font-size:clamp(12px,1.8vw,14px);min-width:auto}
.btn-choice{width:100%;max-width:280px;padding:16px 20px;margin:8px auto;display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
.btn-choice .icon{font-size:24px}
.mastery-bar{width:100%;max-width:400px;height:6px;background:rgba(244,234,216,.15);border-radius:3px;overflow:hidden;margin:8px auto}
.mastery-fill{height:100%;background:linear-gradient(90deg,#8B4513,#d4a05a);border-radius:3px;transition:width .6s ease}
.mastery-label{font-size:11px;color:#b9a88d;letter-spacing:.06em;text-transform:uppercase}
.vignette-text{margin:16px 0;padding:16px;background:rgba(0,0,0,.2);border-left:3px solid #8B4513;border-radius:0 4px 4px 0;text-align:left;font-style:italic;line-height:1.8;color:#d4c4a8;animation:vignetteFade .6s ease-out forwards}
.minigame-area{width:100%;max-width:500px;margin:12px auto;position:relative;min-height:200px}
.duel-zone{width:100%;height:80px;background:rgba(0,0,0,.3);border:1px solid rgba(139,69,19,.4);border-radius:4px;position:relative;overflow:hidden;margin:10px 0;touch-action:manipulation;transition:border-color .15s,box-shadow .15s}
.duel-zone.ready{border-color:rgba(212,160,90,.6);box-shadow:0 0 16px rgba(212,160,90,.15),inset 0 0 20px rgba(212,160,90,.05)}
.duel-zone::before{content:'';position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,transparent 0%,rgba(139,69,19,.05) 30%,rgba(139,69,19,.1) 50%,rgba(139,69,19,.05) 70%,transparent 100%);pointer-events:none;z-index:0;opacity:.5}
.duel-indicator{position:absolute;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#d4a05a,#8B4513);border-radius:2px;transition:left .05s linear;pointer-events:none;z-index:2;box-shadow:0 0 8px rgba(212,160,90,.3);will-change:left}
.duel-indicator.feint{background:linear-gradient(180deg,#e8a040,#a06030);box-shadow:0 0 12px rgba(232,160,64,.5);width:5px;animation:feintPulse .3s ease-in-out 3}
.duel-target{position:absolute;top:0;bottom:0;width:40px;background:rgba(139,69,19,.3);border-left:2px solid #8B4513;border-right:2px solid #8B4513;pointer-events:none;z-index:1;box-shadow:inset 0 0 8px rgba(139,69,19,.15)}
.duel-hit{position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:radial-gradient(circle,#d4a05a,transparent);transform:translate(-50%,-50%);pointer-events:none;z-index:3;opacity:0}
.duel-hit.show{width:120px;height:120px;opacity:.6;transition:all .2s}
.duel-hit.perfect{background:radial-gradient(circle,#f4ead8,transparent)}
@keyframes splashOut{0%{width:0;height:0;opacity:.8}100%{width:200px;height:200px;opacity:0}}
@keyframes inkDrop{0%{transform:scaleY(0);opacity:0}50%{transform:scaleY(1.1);opacity:.8}100%{transform:scaleY(1);opacity:1}}
@keyframes feintPulse{0%{opacity:.6;transform:scaleX(1)}50%{opacity:1;transform:scaleX(1.4)}100%{opacity:.6;transform:scaleX(1)}}
@keyframes inkDropIdle{0%{height:0;opacity:0}30%{height:6px;opacity:.6}70%{height:6px;opacity:.6}100%{height:0;opacity:0;transform:translateX(-50%) translateY(20px)}}
@keyframes inkSplash{0%{width:0;height:0;opacity:.8;transform:translate(-50%,-50%) scale(0)}50%{opacity:.6}100%{width:200px;height:200px;opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes strokePlace{0%{opacity:0;transform:scale(.6)}50%{opacity:.8;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes loadPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes vignetteFade{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes timerUrgent{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.brush-timer.urgent{color:#e8a040}
.brush-timer.critical{color:#c04040;animation:timerUrgent .6s ease-in-out infinite}
.brush-timer.timeout{color:#c04040;animation:timerUrgent .3s ease-in-out 3;font-weight:700}
@keyframes timesUp{0%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
.brush-timer.timesup-text{animation:timesUp .5s ease-out forwards}
.ink-splash{position:absolute;top:50%;left:50%;border-radius:50%;background:radial-gradient(circle,rgba(139,69,19,.6),transparent);pointer-events:none;animation:inkSplash .5s ease-out forwards;z-index:4}
.duel-result{font-size:20px;font-weight:700;margin:8px 0;min-height:30px;animation:resultAppear .35s ease-out forwards}
@keyframes resultAppear{0%{opacity:0;transform:scale(.8)}60%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.duel-rounds{display:flex;gap:6px;justify-content:center;margin:6px 0}
.duel-round{width:12px;height:12px;border-radius:50%;border:1px solid rgba(244,234,216,.3);background:transparent;transition:all .3s}
.duel-round.hit{background:#8B4513;border-color:#8B4513;box-shadow:0 0 6px rgba(139,69,19,.4)}
.duel-round.miss{background:rgba(100,50,30,.3);border-color:rgba(100,50,30,.5)}
.stroke-tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
@media(max-width:480px){.stroke-tray{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:4px 0;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}.stroke-tray .stroke-btn{flex-shrink:0;scroll-snap-align:start}}
.stroke-btn{width:70px;height:70px;border:2px solid rgba(244,234,216,.2);border-radius:6px;background:rgba(0,0,0,.2);cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#b9a88d;gap:2px;position:relative;touch-action:manipulation}
.stroke-btn:hover,.stroke-btn:focus-visible{border-color:#8B4513;background:rgba(139,69,19,.15);outline:none}
.stroke-btn.used{opacity:.3;pointer-events:none;cursor:default}
.stroke-btn.selected{border-color:#d4a05a;background:rgba(212,160,90,.15);box-shadow:0 0 8px rgba(212,160,90,.2)}
.stroke-btn .stroke-preview{width:50px;height:30px;border-radius:2px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stroke-btn .stroke-preview svg{width:100%;height:100%}
.stroke-btn .stroke-key{position:absolute;top:2px;right:4px;font-size:9px;color:rgba(244,234,216,.3)}
.stroke-zone{width:100%;height:120px;border:2px dashed rgba(139,69,19,.3);border-radius:6px;display:flex;align-items:center;justify-content:center;margin:8px 0;position:relative;background:rgba(0,0,0,.15);transition:border-color .3s,background .3s;touch-action:manipulation;cursor:pointer}
.stroke-zone.drag-over{border-color:#d4a05a;background:rgba(212,160,90,.08)}
.stroke-zone.placed{border-color:rgba(139,69,19,.5);border-style:solid;background:rgba(0,0,0,.2)}
.stroke-zone .placed-stroke{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:strokePlace .4s ease-out forwards;width:80px;height:50px}
.stroke-zone .placed-stroke:nth-child(1){left:5%;top:10%}
.stroke-zone .placed-stroke:nth-child(2){left:35%;top:25%}
.stroke-zone .placed-stroke:nth-child(3){left:60%;top:5%}
.stroke-zone .placed-stroke svg{width:100%;height:100%;max-width:80px;max-height:50px}
.stroke-zone-label{font-size:12px;color:rgba(244,234,216,.15);pointer-events:none;transition:color .3s}
.brush-timer{font-size:14px;color:#b9a88d;margin:4px 0;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.brush-score{font-size:16px;color:#d4a05a;font-weight:600;min-height:22px}
.painting-scroll{width:100%;max-width:300px;height:200px;background:linear-gradient(180deg,#f5efe0,#e8dcc8);border-radius:4px;margin:10px auto;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.painting-scroll .brush-stroke{position:absolute;pointer-events:none;opacity:.6}
#ending-scroll{width:100%;max-width:320px;height:460px;margin:12px auto;position:relative;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.5);border-radius:2px;border:1px solid rgba(139,69,19,.3)}
#ending-scroll .scroll-paper{position:absolute;inset:8px;background:linear-gradient(180deg,#f5efe0,#ece0cc,#f0e4d0);border-radius:1px;overflow:hidden;box-shadow:inset 0 0 40px rgba(139,69,19,.06)}
#ending-scroll .scroll-rod-top{position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(180deg,#6b4c2a,#8B4513,#6b4c2a);border-radius:2px 2px 0 0;z-index:2}
#ending-scroll .scroll-rod-bottom{position:absolute;bottom:0;left:0;right:0;height:8px;background:linear-gradient(0deg,#6b4c2a,#8B4513,#6b4c2a);border-radius:0 0 2px 2px;z-index:2}
#ending-scroll .scroll-roller-end{position:absolute;top:-2px;left:-2px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#a07040,#6b4c2a);box-shadow:0 0 4px rgba(0,0,0,.3);z-index:3}
#ending-scroll .scroll-roller-end.right{left:auto;right:-2px}
#ending-scroll .scroll-roller-end.bottom{top:auto;bottom:-2px}
#ending-scroll .brush-stroke{position:absolute;pointer-events:none;opacity:.55;animation:scrollStrokeIn .6s ease-out forwards}
#ending-scroll .brush-stroke svg{width:100%;height:100%}
@keyframes scrollStrokeIn{0%{opacity:0;transform:scale(.7)}100%{opacity:.55;transform:scale(1)}}
@keyframes sealAppear{0%{opacity:0;transform:scale(0) rotate(-180deg)}60%{opacity:.5;transform:scale(1.2) rotate(10deg)}100%{opacity:.25;transform:scale(1) rotate(0deg)}}
#ending-scroll .scroll-paper .scroll-seal{position:absolute;bottom:10px;right:10px;width:22px;height:22px;border:2px solid #8B4513;border-radius:50%;opacity:.25;animation:sealAppear .8s ease-out forwards;animation-delay:.8s;animation-fill-mode:backwards}
.ending-text{font-size:clamp(13px,2vw,16px);line-height:1.8;color:#d4c4a8;max-width:500px;padding:8px}
.ending-title{font-size:clamp(20px,4vw,32px);color:#f4ead8;margin:6px 0}
.feint-warning{color:#e8a040;font-size:13px;margin:4px 0;min-height:20px;font-style:italic;transition:opacity .3s}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.keyboard-user .btn:focus-visible{outline:2px solid #d4a05a;outline-offset:2px}
.keyboard-user .stroke-btn:focus-visible{outline:2px solid #d4a05a;outline-offset:2px}
.waypoint-counter{font-size:12px;color:#8a7a6a;letter-spacing:.04em;margin-bottom:2px}
.progress-dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.progress-dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(244,234,216,.2);background:transparent;transition:all .3s}
.progress-dot.done{background:#8B4513;border-color:#8B4513}
.progress-dot.current{background:rgba(139,69,19,.4);border-color:#8B4513;box-shadow:0 0 6px rgba(139,69,19,.3);animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@media(min-width:768px){.stroke-btn{width:80px;height:80px}.stroke-btn .stroke-preview{width:60px;height:36px}.duel-zone{height:100px}}
@keyframes scrollUnroll{0%{transform:scaleY(0);opacity:0;transform-origin:top center}40%{opacity:.3}70%{transform:scaleY(1.04);opacity:.9}100%{transform:scaleY(1);opacity:1}}
#ending-scroll{opacity:0;transform:scaleY(0);transform-origin:top center}
#ending-scroll.scroll-entrance{animation:scrollUnroll 1s ease-out forwards;opacity:1;transform:scaleY(1)}
@keyframes duelTap{0%{box-shadow:0 0 0 0 rgba(212,160,90,.4)}100%{box-shadow:0 0 0 12px rgba(212,160,90,0)}}
.duel-zone.tap-feedback{animation:duelTap .3s ease-out forwards}
@keyframes duelMiss{0%{box-shadow:0 0 0 0 rgba(192,64,64,.4)}100%{box-shadow:0 0 0 12px rgba(192,64,64,0)}}
.duel-zone.miss-feedback{animation:duelMiss .4s ease-out forwards}
.mute-toggle{position:absolute;top:10px;right:10px;z-index:20;width:36px;height:36px;border-radius:50%;border:1px solid rgba(244,234,216,.2);background:rgba(26,21,16,.7);color:#f4ead8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-family:serif;font-weight:700;touch-action:manipulation}
.mute-toggle:hover,.mute-toggle:focus-visible{background:rgba(139,69,19,.5);border-color:#8B4513;outline:none}
.help-toggle{position:absolute;top:10px;right:52px;z-index:20;width:36px;height:36px;border-radius:50%;border:1px solid rgba(244,234,216,.2);background:rgba(26,21,16,.7);color:#f4ead8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-family:serif;font-weight:700;touch-action:manipulation}
.help-toggle:hover,.help-toggle:focus-visible{background:rgba(139,69,19,.5);border-color:#8B4513;outline:none}
.timer-bar{width:100%;max-width:300px;height:4px;background:rgba(244,234,216,.12);border-radius:2px;overflow:hidden;margin:4px auto}
.timer-fill{height:100%;background:linear-gradient(90deg,#8B4513,#d4a05a);border-radius:2px;transition:width .3s linear}
.help-overlay{position:absolute;inset:0;z-index:30;background:rgba(26,21,16,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:left;opacity:0;pointer-events:none;transition:opacity .4s ease;overflow-y:auto}
.help-overlay.active{opacity:1;pointer-events:auto}
.help-overlay h2{font-size:clamp(18px,4vw,28px);margin-bottom:16px}
.help-overlay .help-section{margin-bottom:12px;max-width:500px}
.help-overlay .help-section h3{font-size:clamp(14px,2.5vw,18px);color:#d4a05a;margin-bottom:4px}
.help-overlay .help-section p{font-size:clamp(12px,2vw,14px);color:#cdbb9d;line-height:1.6}
.help-overlay .help-close{margin-top:20px;touch-action:manipulation}
.loading-overlay{position:absolute;inset:0;z-index:40;background:#1f1a14;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.loading-overlay .loader{width:40px;height:4px;background:rgba(244,234,216,.12);border-radius:2px;overflow:hidden;margin:12px auto}
.loading-overlay .loader-fill{height:100%;background:linear-gradient(90deg,#8B4513,#d4a05a);border-radius:2px;width:0%;animation:loadProgress 1.2s ease-in-out forwards}
@keyframes loadProgress{0%{width:0%}100%{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}#ending-scroll{opacity:1!important;transform:none!important}#ending-scroll.scroll-entrance{animation:none!important;opacity:1!important}.loading-overlay .loader-fill{animation:none!important;width:100%!important}.progress-dot.current{animation:none!important}}
<body>
<div id="app" role="application" aria-label="Way of the Brush and Blade">
  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loader" role="progressbar" aria-label="Way of the Brush and Blade loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loader-fill"></div></div>
  </div>

  <!-- Title Screen -->
  <div id="screen-title" class="screen active" role="region" aria-label="Title screen">
    <div class="bg-img" aria-hidden="true" style="background-image:url(assets/pack1-style-frame.png)"></div>
    <div class="bg-overlay" aria-hidden="true"></div>
    <div class="content">
      <div class="ink-line" aria-hidden="true" style="width:40%"></div>
      <h1>Way of the<br>Brush and Blade</h1>
      <div class="ink-line" aria-hidden="true"></div>
      <div aria-hidden="true" style="position:relative;height:6px;margin:4px auto;width:80%;max-width:200px;opacity:.3">
        <div style="position:absolute;left:50%;top:0;width:2px;height:6px;background:#8B4513;border-radius:0 0 2px 2px;animation:inkDropIdle 4s ease-in-out infinite;transform:translateX(-50%)"></div>
      </div>
      <p class="subtitle">— a wandering swordsman's journey —</p>
      <div style="margin:20px 0;height:80px;background:rgba(0,0,0,.2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#b9a88d;border:1px solid rgba(139,69,19,.2)">
        <span>Along the old Tōkaidō road,<br>five stops await between dawn and Ganryūjima.</span>
      </div>
      <button type="button" class="btn btn-start-glow" id="btn-start" autofocus aria-label="Begin the journey, start a new game">Begin the Journey</button>
      <button type="button" class="btn btn-secondary btn-small" id="btn-resume" style="display:none;margin-top:8px" aria-label="Continue your previous journey from where you left off">Continue Previous Journey</button>
      <p class="body-text" style="font-size:11px;margin-top:12px;color:#8a7a6a" aria-live="polite" id="title-hint">Press ENTER/SPACE or click to begin</p>
      <p style="font-size:10px;color:#6a5a4a;margin-top:4px;min-height:16px" id="title-best-mastery"></p>
    </div>
  </div>

  <!-- Waypoint Screen -->
  <div id="screen-waypoint" class="screen" role="region" aria-label="Waypoint">
    <div class="bg-img" aria-hidden="true" id="wp-bg" style="background-image:url(assets/pack1-style-frame.png)"></div>
    <div class="bg-overlay" aria-hidden="true"></div>
    <div class="content">
      <p class="subtitle" id="wp-location">— Location —</p>
      <div class="ink-line" aria-hidden="true" style="width:30%"></div>
      <h2 id="wp-title">Waypoint</h2>

// Stroke coherence pairs (which strokes complement each other)
const COHERENCE = {
  bamboo: {plum:8, pine:6, bird:4},
  plum: {bamboo:8, bird:6, wave:2},
  pine: {bamboo:6, mountain:8, bird:4},
  wave: {bird:6, mountain:4, plum:2},
  mountain: {pine:8, wave:4, bird:6},
  bird: {plum:6, bamboo:4, mountain:6, wave:6, pine:4}
};

// --- Game state ---
let G = null;
let _lastMasteryGain = 0;

function defaultState() {
  return {
    waypoint: 0,
    mastery: 0,
    phase: 'title', // title, waypoint, sword, brush, final, ending
    swordResults: [],
    brushStrokes: [], // accumulated stroke ids for the scroll painting

    ending: null,

}

// --- DOM refs ---
const $ = id => document.getElementById(id);
// Screen reader announcement helper — clears and re-sets to force announcement even for repeated text
function announceSr(msg) {
  const el = $('sr-announce');
  if (!el) return;
  el.textContent = '';
  requestAnimationFrame(() => { el.textContent = msg; });
}
const screens = {
  title: $('screen-title'),
  waypoint: $('screen-waypoint'),
  sword: $('screen-sword'),
  brush: $('screen-brush'),
  final: $('screen-final'),
  ending: $('screen-ending')
};

// --- Background image helper with fallback ---
function setBgImage(el, url) {
  if (!el) return;
  el.style.backgroundImage = 'url(' + url + ')';
  el.style.backgroundColor = '#1f1a14';
  const img = new Image();
  img.onerror = () => { el.style.backgroundImage = 'none'; };
  img.src = url;
}

// --- Preload background images at startup to prevent flickering ---
function preloadImages() {
  const urls = [];
  LOCATIONS.forEach(loc => { if (loc.bg && urls.indexOf(loc.bg) === -1) urls.push(loc.bg); });
  // Also preload the style frames used by screens
  const extra = ['assets/pack1-style-frame.png','assets/pack2-style-frame.png','assets/pack3-style-frame.png'];
  extra.forEach(u => { if (urls.indexOf(u) === -1) urls.push(u); });
  urls.forEach(url => {
    const img = new Image();
    img.src = url;
  });
}

// --- Audio ---
let _ambientFadeId = null;
let _muted = false;

function setMuted(muted) {
  _muted = muted;
  try { localStorage.setItem(MUTE_KEY, _muted ? '1' : '0'); } catch(e) {}
  const btn = $('btn-mute');
  if (btn) {
    btn.textContent = _muted ? '🔇' : '🔊';
    btn.setAttribute('aria-label', _muted ? 'Unmute audio' : 'Mute audio');
    btn.setAttribute('aria-pressed', _muted ? 'true' : 'false');
    btn.setAttribute('title', _muted ? 'Unmute sound' : 'Toggle sound');
  }
  const a = $('audio-ambient');
  if (_muted && a) { a.pause(); a.src = ''; a.volume = 0; }
}

function toggleMute() {
  setMuted(!_muted);
}

function playAmbient(src) {
  if (_muted) return;
  const a = $('audio-ambient');
  // Skip if same src is already playing (avoids unnecessary fade-out/fade-in)
  if (src && a.src && !a.paused && a.src.indexOf(src) !== -1) return;
  if (_ambientFadeId) { clearInterval(_ambientFadeId); _ambientFadeId = null; }
  if (!src) { a.pause(); a.src = ''; a.volume = 0.3; return; }
  // Fade out current if playing
  if (!a.paused && a.src) {
    let vol = a.volume;
    _ambientFadeId = setInterval(() => {
      vol = Math.max(0, vol - 0.05);
      a.volume = vol;
      if (vol <= 0) {
        clearInterval(_ambientFadeId);
        _ambientFadeId = null;
        a.pause();
        a.src = src;
        a.volume = 0;
        a.play().catch(()=>{});
        // Fade in
        let inVol = 0;
        _ambientFadeId = setInterval(() => {
          inVol = Math.min(0.3, inVol + 0.03);
          a.volume = inVol;
          if (inVol >= 0.3) { clearInterval(_ambientFadeId); _ambientFadeId = null; }
        }, 100);
      }
    }, 80);
  } else {
    a.src = src;
    a.volume = 0;
    a.play().catch(()=>{});
    let inVol = 0;
    _ambientFadeId = setInterval(() => {
      inVol = Math.min(0.3, inVol + 0.03);
      a.volume = inVol;
      if (inVol >= 0.3) { clearInterval(_ambientFadeId); _ambientFadeId = null; }
    }, 100);
  }
}

function playSfx(src) {
  if (_muted) return;
  const a = $('audio-sfx');
  a.src = src;
  a.volume = 0.5;
  a.play().catch(()=>{});
}

// --- Save/Load ---
function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(G));
  } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (data && typeof data.waypoint === 'number' && !data.completed) return data;
    return null;
  } catch(e) { return null; }
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

let _inkTimer = null;
function showScreen(name) {
  if (_inkTimer) { clearTimeout(_inkTimer); _inkTimer = null; }
  const overlay = $('ink-overlay');
  // Respect prefers-reduced-motion — skip ink-wash fade
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fadeMs = prefersReduced ? 10 : 500;
  if (!prefersReduced && overlay) {
    overlay.style.opacity = '1';
  }
  _inkTimer = setTimeout(() => {
    Object.keys(screens).forEach(k => {
      screens[k].classList.remove('active','fade-in','fade-out');
      screens[k].style.display = 'none';
    });
    const el = screens[name];
    el.style.display = 'flex';
    el.classList.add('active','fade-in');
    G.phase = name;
    saveState();
    // Announce screen transition for screen readers
    announceSr('Screen: ' + name.replace(/-/g, ' '));
    // Fade overlay back out
    if (overlay) {
      if (!prefersReduced) {
        requestAnimationFrame(() => { overlay.style.opacity = '0'; });
      } else {
        overlay.style.opacity = '0';
      }
    }
    _inkTimer = null;
  }, fadeMs);
}

// --- Mastery display ---
function updateMasteryDisplay() {
  const pct = Math.min(100, Math.max(0, G.mastery));
  document.querySelectorAll('.mastery-fill').forEach(el => { el.style.width = pct + '%'; });
  document.querySelectorAll('.mastery-label').forEach(el => {
    if (el.id !== 'wp-mastery-label' && el.id !== 'final-mastery-label') return;
    el.textContent = 'Mastery: ' + G.mastery + ' / 100';
  });
}

// --- Waypoint ---
function getLocation(idx) {
  return LOCATIONS[idx % LOCATIONS.length];
}

function showWaypoint() {
  if (G.waypoint >= WAYPOINT_COUNT) {
    showFinalDuel();
    return;
  }
  const loc = getLocation(G.waypoint);
  // Persist vignette choice per waypoint so refresh mid-journey doesn't reroll
  if (!G.vignetteForWaypoint) G.vignetteForWaypoint = [];
  if (G.vignetteForWaypoint[G.waypoint] === undefined) {
    G.vignetteForWaypoint[G.waypoint] = Math.floor(Math.random() * loc.vignettes.length);
  }
  const vIdx = G.vignetteIdx = G.vignetteForWaypoint[G.waypoint];
  $('wp-location').textContent = '— Stop ' + (G.waypoint + 1) + ' of ' + WAYPOINT_COUNT + ' —';
  $('wp-title').textContent = loc.title;
  $('wp-vignette').textContent = loc.vignettes[vIdx];
  setBgImage($('wp-bg'), loc.bg);
  updateMasteryDisplay();
  // Show mastery gain from previous minigame
  const gainEl = $('mastery-gain');
  if (gainEl && _lastMasteryGain > 0) {
    gainEl.textContent = '✦ +' + _lastMasteryGain + ' Mastery';
    gainEl.style.opacity = '1';
    setTimeout(() => { gainEl.style.opacity = '0'; }, 3000);
  } else if (gainEl) {
    gainEl.textContent = '';
    gainEl.style.opacity = '0';
  }
  // Show history from previous waypoint
  const historyEl = $('wp-history');
  if (historyEl && G.waypoint > 0) {
    const prevWp = G.waypoint - 1;
    const swordResult = G.swordResults.find(r => r.waypoint === prevWp);
    const brushResult = G.brushScores.find(r => r.waypoint === prevWp);
    if (swordResult) {
      const hits = swordResult.score / 20 * 3; // reverse-calc: score = (hits/3)*20
      historyEl.textContent = 'Previous: Sword — ' + Math.round(hits) + '/3 hits';
    } else if (brushResult) {
      historyEl.textContent = 'Previous: Brush — Coherence ' + brushResult.score;
    }
  } else if (historyEl) {
    historyEl.textContent = '';
  }
  // Progress dots
  const progress = $('wp-progress');
  progress.innerHTML = '';
  for (let i = 0; i < WAYPOINT_COUNT; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    dot.setAttribute('aria-hidden', 'true');
    if (i < G.waypoint) dot.classList.add('done');
    if (i === G.waypoint) dot.classList.add('current');
    progress.appendChild(dot);
  }
  // Screen reader text for progress
  const srProgress = document.createElement('span');
  srProgress.className = 'visually-hidden';
  srProgress.setAttribute('aria-live', 'polite');
  srProgress.textContent = 'Stop ' + (G.waypoint + 1) + ' of ' + WAYPOINT_COUNT + '. ' + G.waypoint + ' completed.';
  progress.appendChild(srProgress);
  showScreen('waypoint');
  // Announce vignette for screen readers
  announceSr('Stop ' + (G.waypoint + 1) + ': ' + loc.title + '. ' + loc.vignettes[vIdx].substring(0, 100));
  $('btn-sword').focus();
}

// --- Sword Minigame ---
function startSwordMinigame() {
  const isFinal = G.phase === 'final';
  showScreen(isFinal ? 'final' : 'sword');
  const rounds = isFinal ? FINAL_ROUNDS : SWORD_ROUNDS;
  const zone = isFinal ? $('final-duel-zone') : $('duel-zone');
  const targetEl = isFinal ? $('final-duel-target') : $('duel-target');
  const indicatorEl = isFinal ? $('final-duel-indicator') : $('duel-indicator');
  const hitEl = isFinal ? $('final-duel-hit') : $('duel-hit');
  const roundsEl = isFinal ? $('final-rounds') : $('sword-rounds');
  const resultEl = isFinal ? $('final-result') : $('sword-result');
  const skipBtn = isFinal ? $('btn-final-skip') : $('btn-sword-skip');
  const feintWarn = isFinal ? $('final-feint-warning') : $('feint-warning');

  if (!isFinal) {
    $('sword-instruction').textContent = 'Press SPACE/ENTER or tap when the moving indicator aligns with the target zone.';
    $('sword-hint').textContent = IS_TOUCH ? 'Tap the duel zone at the right moment' : 'Press SPACE or ENTER at the right moment';
  } else {
    const ctx = G.mastery >= 80 ? 'Your mastery is great. The opponent\'s stance is clear — you can read his intent.' :
                G.mastery >= 50 ? 'You have trained well. The opponent is strong, but you see the patterns.' :
                'Your path has been uncertain. The opponent is a storm — you must rely on instinct.';
    $('final-context').textContent = ctx;
    $('final-hint').textContent = IS_TOUCH ? 'Tap the duel zone at the right moment. Watch for feints!' : 'Press SPACE or ENTER at the right moment. Watch for feints!';
    // Explicitly announce context for screen readers — the element has aria-live but may miss due to screen transition timing
    announceSr(ctx.substring(0, 100) + '. ' + (IS_TOUCH ? 'Tap' : 'Press Space or Enter') + ' to strike. Watch for feints!');
  }

  let currentRound = 0;
  let results = [];
  let active = false;
  let canHit = false;
  let animId = null;
  let feintActive = false;
  let feintTriggered = false;
  let strikeTime = 0;
  let indicatorPos = 0;

  skipBtn.style.display = 'none';
  resultEl.textContent = '';
  feintWarn.textContent = '';
  hitEl.classList.remove('show','perfect');
  roundsEl.innerHTML = '';
  for (let i = 0; i < rounds; i++) {
    const dot = document.createElement('div');
    dot.className = 'duel-round';
    dot.setAttribute('aria-hidden', 'true');
    roundsEl.appendChild(dot);
  }

  function setTarget() {
    const zoneW = zone.offsetWidth || 400;
    // Target is at a random position between 30% and 70%
    const targetPct = 30 + Math.random() * 40;
    targetEl.style.left = targetPct + '%';
    targetEl.style.width = Math.max(30, 30 + G.mastery * 0.2) + 'px';
    strikeTime = targetPct;
    // Feint: if final duel, occasionally have a false start
    feintActive = isFinal && Math.random() < 0.3 && G.mastery < 80;
    feintTriggered = false;
    indicatorEl.classList.toggle('feint', feintActive);
    if (feintActive) {
      feintWarn.textContent = 'He shifts his grip... watch for the feint!';
    } else {
      feintWarn.textContent = '';
    }
  }

  function startRound() {
    if (currentRound >= rounds) {
      finishMinigame();
      return;
    }
    // Reset speed each round so feint speed increase doesn't persist
    let speed = isFinal ? 0.8 : 1.2;
    if (isFinal && G.mastery >= 80) speed = 0.6;
    else if (isFinal && G.mastery < 50) speed = 1.4;
    canHit = false;
    active = true;
    indicatorPos = 0;
    zone.classList.remove('ready');
    delete zone.dataset.wasReady;
    indicatorEl.style.left = '0%';
    // Update round label
    const roundLabel = isFinal ? $('final-round-label') : $('sword-round-label');
    if (roundLabel) roundLabel.textContent = 'Round ' + (currentRound + 1) + ' / ' + rounds;
    setTarget();
    // Update round dots
    const dots = roundsEl.querySelectorAll('.duel-round');
    dots.forEach((d,i) => {
      if (i < currentRound) d.className = 'duel-round ' + (results[i] ? 'hit' : 'miss');
      else d.className = 'duel-round';
    });
    resultEl.textContent = '';
    feintWarn.textContent = feintActive ? 'He shifts his grip... watch for the feint!' : '';
    // Start animation
    const zoneW = zone.offsetWidth || 400;
    const startTime = performance.now();
    let feintFired = false;

    function animate(now) {
      if (!active) return;
      const elapsed = (now - startTime) / 1000;
      indicatorPos = (elapsed * speed * 100);
      if (indicatorPos > 105) {
        // Missed
        active = false;
        canHit = false;
        zone.classList.remove('ready');
        // Miss feedback animation
        zone.classList.remove('miss-feedback');
        void zone.offsetWidth;
        zone.classList.add('miss-feedback');
        setTimeout(() => zone.classList.remove('miss-feedback'), 500);
        results.push(false);
        const dots2 = roundsEl.querySelectorAll('.duel-round');
        dots2[currentRound].className = 'duel-round miss';
        resultEl.textContent = '✗ The moment passed — watch the indicator carefully';
        resultEl.style.color = '#a06050';
        announceSr('Missed — the moment passed');
        currentRound++;
        setTimeout(startRound, 800);
        return;
      }
      // Feint logic: if feint active, the indicator pauses or reverses briefly
      if (feintActive && !feintFired && indicatorPos > strikeTime - 8 && indicatorPos < strikeTime + 8) {
        feintFired = true;
        feintTriggered = true;
        feintWarn.textContent = 'A feint! The stroke was false — the real one follows!';
        // Visual: remove feint glow, show normal indicator for the real strike
        indicatorEl.classList.remove('feint');
        // Reset indicator to simulate the feint
        indicatorPos = strikeTime - 15;
        // Speed increases for the real strike
        speed *= 1.3;
      }
      indicatorEl.style.left = indicatorPos + '%';
      canHit = !feintActive || feintTriggered;
      const nowReady = canHit && indicatorPos >= strikeTime - 5;
      zone.classList.toggle('ready', nowReady);
      // Announce ready state changes for screen readers
      const srStatusId = zone.id === 'final-duel-zone' ? 'final-duel-sr-status' : 'duel-sr-status';
      const srStatus = document.getElementById(srStatusId);
      if (srStatus) {
        if (nowReady && !zone.dataset.wasReady) {
          srStatus.textContent = 'Strike now!';
          zone.dataset.wasReady = '1';
        } else if (!nowReady && zone.dataset.wasReady) {
          srStatus.textContent = 'Wait for the indicator';
          delete zone.dataset.wasReady;
        }
      }
      animId = requestAnimationFrame(animate);
    }
    animId = requestAnimationFrame(animate);
  }

  function handleStrike() {
    if (!active || !canHit) return;
    active = false;
    zone.classList.remove('ready');
    if (animId) cancelAnimationFrame(animId);
    const targetLeft = parseFloat(targetEl.style.left);
    const targetW = parseFloat(targetEl.style.width) || 40;
    const zoneW = zone.offsetWidth || 400;
    const diff = Math.abs(indicatorPos - targetLeft);
    // Convert pixel-based target width to percentage of zone width for correct comparison
    const thresholdPct = ((targetW / 2) + 5) / zoneW * 100;
    const hit = diff <= thresholdPct;
    // Perfect requires the indicator to be within the inner half of the target + 2px buffer
    const perfectPct = ((targetW / 4) + 2) / zoneW * 100;
    const perfect = diff <= perfectPct;
    results.push(hit);
    const dots = roundsEl.querySelectorAll('.duel-round');
    dots[currentRound].className = 'duel-round ' + (hit ? 'hit' : 'miss');
    // Haptic feedback on mobile
    try { if (navigator.vibrate) navigator.vibrate(hit ? 30 : 15); } catch(e) {}
    // Visual tap feedback
    zone.classList.remove('tap-feedback');
    void zone.offsetWidth; // force reflow
    zone.classList.add('tap-feedback');
    setTimeout(() => zone.classList.remove('tap-feedback'), 400);
    if (perfect) {
      hitEl.classList.add('show','perfect');
      // Add ink splash
      const splash = document.createElement('div');
      splash.className = 'ink-splash';
      splash.style.width = '160px';
      splash.style.height = '160px';
      hitEl.appendChild(splash);
      setTimeout(() => splash.remove(), 500);
      resultEl.textContent = '✦ Round ' + (currentRound + 1) + ': Perfect strike!';
      resultEl.style.color = '#d4a05a';
      // Screen reader announcement
      announceSr('Round ' + (currentRound + 1) + ': Perfect strike!');
      playSfx('assets/pack2-sfx.wav');
    } else if (hit) {
      hitEl.classList.add('show');
      const splash = document.createElement('div');
      splash.className = 'ink-splash';
      splash.style.width = '100px';
      splash.style.height = '100px';
      hitEl.appendChild(splash);
      setTimeout(() => splash.remove(), 500);
      resultEl.textContent = '✓ Round ' + (currentRound + 1) + ': Hit';
      resultEl.style.color = '#8a9a7a';
      // Screen reader announcement
      announceSr('Round ' + (currentRound + 1) + ': Hit');
      playSfx('assets/pack2-sfx.wav');
    } else {
      resultEl.textContent = '✗ Round ' + (currentRound + 1) + ': Miss';
      resultEl.style.color = '#a06050';
      // Screen reader announcement
      announceSr('Round ' + (currentRound + 1) + ': Miss');
    }
    setTimeout(() => { hitEl.classList.remove('show','perfect'); }, 300);
    currentRound++;
    setTimeout(startRound, 600);
  }

  function finishMinigame() {
    const hitCount = results.filter(Boolean).length;
    const score = Math.round((hitCount / rounds) * 20);
    const isFinalDuel = isFinal;
    if (!isFinalDuel) {
      const prevMastery = G.mastery;
      G.mastery = Math.min(100, G.mastery + score);
      _lastMasteryGain = G.mastery - prevMastery;
      G.swordResults.push({waypoint:G.waypoint, score});
    } else {
      G.finalResult = {hits:hitCount, total:rounds};
      // Determine ending
      const won = hitCount >= 3;
      if (won && G.mastery >= 80) {
        G.ending = 'wooden-oar';
      } else if (won && G.mastery >= 50) {
        G.ending = 'long-path';
      } else if (won) {
        G.ending = 'long-path';
      } else {
        G.ending = 'other-shore';
      }
      G.mastery = Math.min(100, G.mastery + Math.round((hitCount/rounds)*10));
    }
    updateMasteryDisplay();
    saveState();

    const skip = skipBtn;
    skip.style.display = 'inline-block';
    skip.textContent = isFinalDuel ? 'See your fate →' : 'Continue →';
    resultEl.textContent = (isFinalDuel ? 'Duel complete: ' : 'Round complete: ') + hitCount + '/' + rounds + ' hits';
    // Screen reader announcement
    const duelLabel = isFinalDuel ? 'Final duel' : 'Sword round';
    announceSr(duelLabel + ' complete: ' + hitCount + ' of ' + rounds + ' hits. Mastery: ' + G.mastery + '.');
    skip.onclick = () => {
      if (isFinalDuel) {
        showEnding();
      } else {
        G.waypoint++;
        saveState();
        showWaypoint();
      }
    };
    skip.focus();
  }

  // Start first round
  startRound();

  // Event handlers — use named refs so cleanup can remove them
  const strikeHandler = (e) => {
    if ($('help-overlay').classList.contains('active')) return;
    if (e.type === 'keydown' && e.key !== ' ' && e.key !== 'Spacebar' && e.key !== 'Space' && e.key !== 'Enter') return;
    e.preventDefault();
    handleStrike();
  };
  const touchHandler = (e) => {
    if ($('help-overlay').classList.contains('active')) return;
    e.preventDefault();
    handleStrike();
  };

  document.addEventListener('keydown', strikeHandler);
  zone.addEventListener('click', strikeHandler);
  zone.addEventListener('touchstart', touchHandler, {passive:false});

  // Store cleanup
  window.__swordCleanup = () => {
    document.removeEventListener('keydown', strikeHandler);
    zone.removeEventListener('click', strikeHandler);
    zone.removeEventListener('touchstart', touchHandler);
    if (animId) cancelAnimationFrame(animId);
    active = false;
  };
}

// --- Brush Minigame ---
function startBrushMinigame() {
  showScreen('brush');
  $('brush-score').textContent = 'Coherence: —';
  $('brush-timer').textContent = 'Time: 30s';
  $('brush-timer').className = 'brush-timer';
  $('btn-brush-skip').style.display = 'none';
  $('brush-hint').textContent = IS_TOUCH ? 'Tap strokes to select, then tap the composition area to place' : 'Press 1-6 to select strokes, then ENTER to place';
  $('stroke-zone').classList.remove('placed');
  $('stroke-zone-label').textContent = 'Place your strokes here';
  const oldStrokes = $('stroke-zone').querySelectorAll('.placed-stroke');
  oldStrokes.forEach(el => el.remove());

  let timeLeft = 30;
  let timerStartedAt = Date.now();
  let timerPaused = false;
  let timerPausedAt = 0;
  let selectedStrokes = [];
  let placedStrokes = [];
  let timerId = null;
  let isPlacing = false;

  const tray = $('stroke-tray');
  tray.innerHTML = '';
  STROKES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'stroke-btn';
    btn.type = 'button';
    btn.draggable = true;
    btn.dataset.strokeId = s.id;
    btn.dataset.index = i;
    const preview = document.createElement('div');
    preview.className = 'stroke-preview';
    preview.innerHTML = s.svg;
    btn.appendChild(preview);
    const label = document.createElement('span');
    label.textContent = s.label;
    btn.appendChild(label);
    const key = document.createElement('span');
    key.className = 'stroke-key';
    key.textContent = (i + 1);
    btn.appendChild(key);
    btn.setAttribute('aria-label', s.label + ': ' + s.desc + '. Press ' + (i + 1) + ' to select');
    btn.onclick = () => toggleStrokeSelection(btn, s);
    btn.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleStrokeSelection(btn, s); }};
    tray.appendChild(btn);
  });
  // Focus the first stroke button for keyboard users
  const firstBtn = tray.querySelector('.stroke-btn');
  if (firstBtn) setTimeout(() => firstBtn.focus(), 100);

  function toggleStrokeSelection(btn, s) {
    if (isPlacing || timerPaused) return;
    const idx = selectedStrokes.indexOf(s.id);
    if (idx >= 0) {
      selectedStrokes.splice(idx, 1);
      btn.classList.remove('selected');
    } else {
      if (selectedStrokes.length >= 3) {
        // Deselect oldest
        const oldest = selectedStrokes.shift();
        tray.querySelector(`[data-stroke-id="${oldest}"]`)?.classList.remove('selected');
      }
      selectedStrokes.push(s.id);
      btn.classList.add('selected');
    }
    updateCoherencePreview();
  }

  function updateCoherencePreview() {
    const hintEl = $('coherence-hint');
    if (selectedStrokes.length < 2) {
      $('brush-score').textContent = 'Select 2-3 strokes';
      if (hintEl) hintEl.textContent = '';
      return;
    }
    let coherence = 0;
    let bestPair = null;
    let bestScore = 0;
    for (let i = 0; i < selectedStrokes.length; i++) {
      for (let j = i + 1; j < selectedStrokes.length; j++) {
        const c = COHERENCE[selectedStrokes[i]];
        if (c && c[selectedStrokes[j]]) {
          coherence += c[selectedStrokes[j]];
          if (c[selectedStrokes[j]] > bestScore) {
            bestScore = c[selectedStrokes[j]];
            const s1 = STROKES.find(x => x.id === selectedStrokes[i]);
            const s2 = STROKES.find(x => x.id === selectedStrokes[j]);
            if (s1 && s2) bestPair = s1.label + ' + ' + s2.label;
          }
        }
      }
    }
    $('brush-score').textContent = 'Coherence: ' + coherence;
    if (hintEl && bestPair && coherence > 0) {
      const rating = coherence >= 14 ? 'Excellent' : coherence >= 10 ? 'Good' : 'Fair';
      hintEl.textContent = bestPair + ': ' + rating + ' combination';
      hintEl.style.color = coherence >= 14 ? '#d4a05a' : coherence >= 10 ? '#b9a88d' : '#8a7a6a';
    }
  }

  function placeStroke(strokeId) {
    if (isPlacing || placedStrokes.length >= 3 || timerPaused) return;
    isPlacing = true;
    placedStrokes.push(strokeId);
    const zone = $('stroke-zone');
    zone.classList.add('placed');
    const s = STROKES.find(x => x.id === strokeId);
    const div = document.createElement('div');
    div.className = 'placed-stroke';
    if (s) div.innerHTML = s.svg;
    zone.appendChild(div);
    $('stroke-zone-label').textContent = placedStrokes.length + '/3 placed';
    zone.setAttribute('aria-label', 'Composition area with ' + placedStrokes.length + ' of 3 strokes placed');
    // Mark stroke as used
    tray.querySelector(`[data-stroke-id="${strokeId}"]`)?.classList.add('used');
    // Remove from selection
    const idx = selectedStrokes.indexOf(strokeId);
    if (idx >= 0) selectedStrokes.splice(idx, 1);
    isPlacing = false;
    // Announce to screen readers
    const strokeName = s ? s.label : strokeId;
    announceSr('Placed ' + strokeName + '. ' + placedStrokes.length + ' of 3 strokes placed.');
    // Play brush stroke sound
    playSfx('assets/pack3-sfx.wav');

    if (placedStrokes.length >= 3) {
      finishBrushMinigame();
    }
  }

  const zone = $('stroke-zone');
  // Drag and drop for stroke placement — use named refs for cleanup
  const dragStartHandler = (e) => {
    const btn = e.target.closest('.stroke-btn');
    if (!btn || btn.classList.contains('used')) return;
    e.dataTransfer.setData('text/plain', btn.dataset.strokeId);
  };
  const dragOverHandler = (e) => { e.preventDefault(); zone.classList.add('drag-over'); };
  const dragLeaveHandler = () => { zone.classList.remove('drag-over'); };
  const dropHandler = (e) => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const id = e.dataTransfer.getData('text/plain');
    if (id && selectedStrokes.includes(id) && placedStrokes.length < 3) {
      placeStroke(id);
    }
  };
  tray.addEventListener('dragstart', dragStartHandler);
  zone.addEventListener('dragover', dragOverHandler);
  zone.addEventListener('dragleave', dragLeaveHandler);
  zone.addEventListener('drop', dropHandler);

  // Keyboard: number keys 1-6 to select, then ENTER on zone to place next selected
  const keyHandler = (e) => {
    if ($('help-overlay').classList.contains('active')) return;
    if (e.key >= '1' && e.key <= '6') {
      const idx = parseInt(e.key) - 1;
      const btn = tray.querySelector(`[data-index="${idx}"]`);
      if (btn) btn.click();
    }
    if ((e.key === 'Enter' || e.key === ' ') && selectedStrokes.length > 0 && placedStrokes.length < 3) {
      e.preventDefault();
      placeStroke(selectedStrokes[0]);
    }
  };
  document.addEventListener('keydown', keyHandler);

  // Click/tap on zone to place next selected
  const zoneTapHandler = () => {
    if (selectedStrokes.length > 0 && placedStrokes.length < 3) {
      placeStroke(selectedStrokes[0]);
    }
  };
  zone.onclick = zoneTapHandler;
  zone.addEventListener('touchstart', zoneTapHandler, {passive: true});

  function finishBrushMinigame() {
    if (timerId) clearInterval(timerId);
    document.removeEventListener('keydown', keyHandler);

    // Calculate score
    let coherence = 0;
    for (let i = 0; i < placedStrokes.length; i++) {
      for (let j = i + 1; j < placedStrokes.length; j++) {
        const c = COHERENCE[placedStrokes[i]];
        if (c && c[placedStrokes[j]]) coherence += c[placedStrokes[j]];
      }
    }
    // Timing bonus
    const timingBonus = timeLeft > 20 ? 5 : timeLeft > 10 ? 3 : timeLeft > 5 ? 1 : 0;
    const score = Math.min(20, coherence + timingBonus);
    const prevMastery = G.mastery;
    G.mastery = Math.min(100, G.mastery + score);
    _lastMasteryGain = G.mastery - prevMastery;
    G.brushStrokes.push(...placedStrokes);
    G.brushScores.push({waypoint:G.waypoint, score, strokes:[...placedStrokes]});
    updateMasteryDisplay();
    saveState();

    if (placedStrokes.length === 0) {
      $('brush-score').textContent = 'No strokes placed — 0 coherence. Try selecting strokes next time!';
    } else {
      $('brush-score').textContent = 'Coherence: ' + coherence + ' + Timing: ' + timingBonus + ' = ' + score;
    }
    // Screen reader announcement
    announceSr('Composition complete! Score: ' + score + '. Mastery: ' + G.mastery + '.');
    const skip = $('btn-brush-skip');
    skip.style.display = 'inline-block';
    skip.onclick = () => {
      G.waypoint++;
      saveState();
      showWaypoint();
    };
    skip.focus();
  }

  // Timer — uses Date.now() so tab-visibility pause is accurate
  const TIMER_MAX = 30;
  timerStartedAt = Date.now();
  let _lastAnnouncedSec = -1; // track last announced second to avoid chatty screen reader updates

  function tickTimer() {
    if (timerPaused) return;
    const elapsed = Math.floor((Date.now() - timerStartedAt) / 1000);
    timeLeft = Math.max(0, TIMER_MAX - elapsed);
    const timerEl = $('brush-timer');
    timerEl.textContent = 'Time: ' + timeLeft + 's';
    // Announce key thresholds for screen readers (10s, 5s, 0s)
    const announceThresholds = [10, 5, 0];
    if (announceThresholds.includes(timeLeft) && _lastAnnouncedSec !== timeLeft) {
      _lastAnnouncedSec = timeLeft;
      if (timeLeft === 0) {
        announceSr('Time is up!');
      } else {
        announceSr(timeLeft + ' seconds remaining');
      }
    }
    // Urgency classes
    timerEl.classList.toggle('critical', timeLeft <= 5);
    timerEl.classList.toggle('urgent', timeLeft > 5 && timeLeft <= 10);
    const fill = $('brush-timer-fill');
    if (fill) {
      fill.style.width = (timeLeft / TIMER_MAX * 100) + '%';
      fill.style.background = timeLeft <= 5 ? 'linear-gradient(90deg,#c04040,#e08040)' :
                             timeLeft <= 10 ? 'linear-gradient(90deg,#e8a040,#d4a05a)' :
                             'linear-gradient(90deg,#8B4513,#d4a05a)';
    }
    if (timeLeft <= 0 && !timerPaused) {
      if (timerId) clearInterval(timerId);
      timerPaused = true; // prevent re-entry
      const timerEl = $('brush-timer');
      timerEl.textContent = 'Time\'s up!';
      timerEl.className = 'brush-timer timesup-text';
      const fill = $('brush-timer-fill');
      if (fill) fill.style.width = '0%';
      setTimeout(finishBrushMinigame, 600);
    }
  }

  timerId = setInterval(tickTimer, 100); // check every 100ms for smooth display

  // Pause/resume on tab visibility change
  const visHandler = () => {
    if (document.hidden) {
      timerPaused = true;
      timerPausedAt = Date.now();
      $('brush-timer').textContent = '⏸ Paused';
      announceSr('Timer paused');
    } else if (timerPaused) {
      timerPaused = false;
      // Reset announcement tracker so thresholds missed during pause can be announced
      _lastAnnouncedSec = -1;
      // Adjust start time to account for time spent hidden
      const hiddenDuration = Date.now() - timerPausedAt;
      timerStartedAt += hiddenDuration;
      timerPausedAt = 0;
      // Refresh display immediately
      tickTimer();
      announceSr('Timer resumed, ' + timeLeft + ' seconds remaining');
    }
  };
  document.addEventListener('visibilitychange', visHandler);

  // Cleanup
  window.__brushCleanup = () => {
    if (timerId) clearInterval(timerId);
    document.removeEventListener('keydown', keyHandler);
    document.removeEventListener('visibilitychange', visHandler);
    tray.removeEventListener('dragstart', dragStartHandler);
    zone.removeEventListener('dragover', dragOverHandler);
    zone.removeEventListener('dragleave', dragLeaveHandler);
    zone.removeEventListener('drop', dropHandler);
    zone.onclick = null;
    zone.removeEventListener('touchstart', zoneTapHandler);
  };
}

// --- Final Duel ---
function showFinalDuel() {
  G.phase = 'final';
  showScreen('final');
  updateMasteryDisplay();
  startSwordMinigame();
}

// --- Endings ---
function showEnding() {
  showScreen('ending');
  const title = $('ending-title');
  const text = $('ending-text');
  const masteryLabel = $('ending-mastery-label');
  const scroll = $('ending-scroll');

  masteryLabel.textContent = 'Final Mastery: ' + G.mastery + ' / 100';

  // Save and show best mastery
  try {
    const prevBest = parseInt(localStorage.getItem('edo-musashi-best-mastery-v1')) || 0;
    if (G.mastery > prevBest) {
      localStorage.setItem('edo-musashi-best-mastery-v1', String(G.mastery));
    }
  } catch(e) {}
  const bestSaved = parseInt(localStorage.getItem('edo-musashi-best-mastery-v1')) || 0;

  // Compute and display journey statistics
  const statsEl = $('ending-stats');
  if (statsEl) {
    const totalSwordHits = G.swordResults.reduce((sum, r) => sum + r.score, 0) / 20 * 3;
    const totalBrushScore = G.brushScores.reduce((sum, r) => sum + r.score, 0);
    const brushCount = G.brushScores.length;
    const swordCount = G.swordResults.length;
    const parts = [];
    if (swordCount > 0) parts.push('Sword: ' + Math.round(totalSwordHits) + '/' + (swordCount * 3) + ' hits');
    if (brushCount > 0) parts.push('Brush: ' + brushCount + ' compositions (total ' + totalBrushScore + ' coherence)');
    if (G.finalResult) parts.push('Final duel: ' + G.finalResult.hits + '/' + G.finalResult.total + ' hits');
    if (bestSaved > 0 && bestSaved !== G.mastery) parts.push('Best: ' + bestSaved + '/100');
    if (parts.length > 0) statsEl.textContent = parts.join(' · ');
  }

  // Build the accumulated painting scroll — a traditional hanging scroll (kakemono)
  scroll.style.display = 'block';
  scroll.innerHTML = '';
  // Scroll structure: rods, paper, roller ends
  const rodTop = document.createElement('div');
  rodTop.className = 'scroll-rod-top';
  scroll.appendChild(rodTop);
  const rodBottom = document.createElement('div');
  rodBottom.className = 'scroll-rod-bottom';
  scroll.appendChild(rodBottom);
  // Roller end caps
  for (let pos of ['',' right',' bottom',' bottom right']) {
    const cap = document.createElement('div');
    cap.className = 'scroll-roller-end' + pos;
    scroll.appendChild(cap);
  }
  // Paper area
  const paper = document.createElement('div');
  paper.className = 'scroll-paper';
  // Build a descriptive label from placed strokes
  const strokeLabels = G.brushStrokes.map(function(sid) {
    var s = STROKES.find(function(x) { return x.id === sid; });
    return s ? s.label : sid;
  }).join(', ');
  paper.setAttribute('aria-label', 'Journey painting scroll' + (strokeLabels ? ' with ' + strokeLabels : ''));
  scroll.appendChild(paper);

  if (G.brushStrokes.length > 0) {
    // Layout strokes across the scroll like a traditional hanging scroll composition
    const positions = [
      {left:'12%', top:'6%', width:'35%', height:'24%', rotate:'-4deg'},
      {left:'48%', top:'16%', width:'32%', height:'22%', rotate:'3deg'},
      {left:'18%', top:'34%', width:'38%', height:'26%', rotate:'-2deg'},
      {left:'44%', top:'46%', width:'30%', height:'20%', rotate:'5deg'},
      {left:'22%', top:'58%', width:'34%', height:'24%', rotate:'-3deg'},
      {left:'38%', top:'72%', width:'32%', height:'22%', rotate:'2deg'},
    ];
    G.brushStrokes.forEach((sid, idx) => {
      const s = STROKES.find(x => x.id === sid);
      if (!s) return;
      const p = positions[idx % positions.length];
      const el = document.createElement('div');
      el.className = 'brush-stroke';
      el.innerHTML = s.svg;
      const delay = 0.3 + idx * 0.15;
      el.style.cssText = 'position:absolute;left:' + p.left + ';top:' + p.top + ';width:' + p.width + ';height:' + p.height + ';transform:rotate(' + p.rotate + ');opacity:' + Math.min(0.65, 0.35 + idx * 0.05) + ';animation-delay:' + delay + 's;animation-fill-mode:backwards';
      paper.appendChild(el);
    });
    // Add a subtle seal/stamp at the bottom of the paper
    const seal = document.createElement('div');
    seal.className = 'scroll-seal';
    paper.appendChild(seal);
  } else {
    paper.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b9a88d;font-size:12px;font-style:italic">The scroll remains blank — the brush was never taken up.</div>';
  }
  // Trigger scroll unroll animation after a brief delay for layout — skip if reduced motion
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) {
    scroll.style.opacity = '1';
  } else {
    requestAnimationFrame(() => { scroll.classList.add('scroll-entrance'); });
  }

  switch (G.ending) {
    case 'wooden-oar':
      title.textContent = 'The Wooden Oar';
      text.innerHTML = 'You arrive at Ganryūjima as the sun breaks through the clouds. Sasaki Kojirō awaits, his long nodachi gleaming. But you carry no sword today.<br><br>Instead, you have shaped an oar from driftwood during the journey, carving it with the brush strokes of your art. When he attacks, you meet him not with steel but with the paddle — turning his own momentum against him. The long blade spins into the sea.<br><br>He laughs, and offers tea.<br><br><em>"You have mastered both ways. There is nothing left to prove."</em>';
      break;
    case 'long-path':
      title.textContent = 'The Long Path';
      text.innerHTML = 'The duel is hard-fought. Kojirō\'s reach is greater, his speed formidable. You take a wound early — a shallow cut across the arm that blooms red against your sleeve.<br><br>But you have walked the road. You have learned patience. You find the opening, and when it comes, you take it. The nodachi falls.<br><br>Kojirō nods once, acknowledging the loss. As you bind your wound, you realise: victory is not the end of the path. It is only another step.<br><br><em>"The road continues,"</em> he says. <em>"There is always another waypoint."</em>';
      break;
    case 'other-shore':
      title.textContent = 'The Other Shore';
      text.innerHTML = 'Kojirō\'s blade moves like water — you cannot read its flow. The feints confuse you; the true strikes arrive before you are ready.<br><br>You fall to the sand, the cold tide lapping at your feet. The sky above is vast and indifferent. But as you lie there, you see it: the journey was never about winning. It was about the road itself — the temple at dawn, the rain on the river, the old woman\'s tea, the snow, the fishing boats.<br><br>Kojirō sheathes his sword and offers you his hand.<br><br><em>"Get up. The road is still waiting."</em><br><br>You take it. The journey begins again.';
      break;
    default:
      title.textContent = 'The Road Continues';
      text.innerHTML = 'Your journey along the old road has reached its end — but every ending is a new beginning. The brush and the blade are one.';
  }

  // Play ambient
  playAmbient('assets/pack1-music-loop.wav');

  G.completed = true;
  clearSave();
  saveState();
  // Announce ending to screen readers
  announceSr('Ending: ' + title.textContent + '. ' + text.textContent.substring(0, 120) + '...');
  $('btn-restart').focus();
}

// --- Restart ---
function restartGame() {
  clearSave();
  G = defaultState();
  _lastMasteryGain = 0;
  playAmbient('');
  showTitle();
}

function showTitle() {
  showScreen('title');
  // Check for saved game
  const saved = loadState();
  const resumeBtn = $('btn-resume');
  if (saved && saved.waypoint < WAYPOINT_COUNT) {
    resumeBtn.style.display = 'inline-block';
    resumeBtn.onclick = () => {
      G = saved;
      _lastMasteryGain = 0; // reset stale mastery gain from previous session
      showWaypoint();
    };
  } else {
    resumeBtn.style.display = 'none';
  }
  playAmbient('assets/pack1-music-loop.wav');
  $('btn-start').focus();
  // Show best mastery
  const bestEl = $('title-best-mastery');
  try { const best = parseInt(localStorage.getItem('edo-musashi-best-mastery-v1')) || 0; if (best > 0) bestEl.textContent = 'Best Mastery: ' + best + ' / 100'; } catch(e) {}
}

// --- Touch device detection ---
function isTouchDevice() {
  return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
}
const IS_TOUCH = isTouchDevice();

// --- Init ---
function init() {
  G = defaultState();
  preloadImages();
  // Restore saved mute preference
  try {
    const savedMute = localStorage.getItem(MUTE_KEY);
    if (savedMute === '1') setMuted(true);
  } catch(e) {}
  showTitle();

  // Hide loading overlay after a short delay for asset readiness — update aria-valuenow progressively
  let loadProgress = 0;
  const loadInterval = setInterval(() => {
    loadProgress = Math.min(100, loadProgress + 8 + Math.floor(Math.random() * 12));
    const lo = $('loading-overlay');
    if (lo) {
      const loader = lo.querySelector('[role="progressbar"]');
      if (loader) loader.setAttribute('aria-valuenow', String(loadProgress));
    }
    if (loadProgress >= 100) {
      clearInterval(loadInterval);
      setTimeout(() => {
        if (lo) {
          lo.classList.add('hidden');
          lo.setAttribute('aria-hidden', 'true');
        }
      }, 200);
    }
  }, 150);

  $('btn-start').onclick = () => {
    G = defaultState();
    clearSave();
    playAmbient('');
    showWaypoint();
  };

  $('btn-sword').onclick = () => {
    _lastMasteryGain = 0;
    startSwordMinigame();
  };

  $('btn-brush').onclick = () => {
    _lastMasteryGain = 0;
    startBrushMinigame();
  };

  $('btn-restart').onclick = () => {
    restartGame();
  };

  // Keyboard detection — show keyboard-specific hints when keyboard is used
  let _keyboardUser = false;
  document.addEventListener('keydown', () => {
    if (!_keyboardUser) {
      _keyboardUser = true;
      document.body.classList.add('keyboard-user');
    }
  }, {once: true});

  // Keyboard shortcuts on title — prefer resume if a saved game exists
  document.addEventListener('keydown', (e) => {
    if (G.phase === 'title' && !$('help-overlay').classList.contains('active') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      const resumeBtn = $('btn-resume');
      if (resumeBtn.style.display !== 'none' && e.key === 'Enter') {
        resumeBtn.click();
      } else {
        $('btn-start').click();
      }
    }
  });

  // Mute toggle button and keyboard shortcut (M key)
  $('btn-mute').onclick = toggleMute;
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'm' || e.key === 'M') && !$('help-overlay').classList.contains('active')) {
      e.preventDefault();
      toggleMute();
    }
  });

  // Help overlay toggle with focus trapping
  let _helpPrevFocus = null;
  function getHelpFocusable() {
    const overlay = $('help-overlay');
    return overlay.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  }
  // Stable references for event listener add/remove — prevents listener leak
  function _helpBackdropClick(e) {
    // Close only if clicking the overlay backdrop (not its children) and overlay is active
    const overlay = $('help-overlay');
    if (e.target === overlay && overlay.classList.contains('active')) {
      toggleHelp();
    }
  }
  function _helpTabTrap(e) {
    if (e.key !== 'Tab') return;
    const focusable = getHelpFocusable();
    if (focusable.length === 0) return; // safety: no focusable elements
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey) {
      if (document.activeElement === first) {
        e.preventDefault();
        last.focus();
      }
    } else {
      if (document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  }
  function toggleHelp() {
    const overlay = $('help-overlay');
    const wasActive = overlay.classList.contains('active');
    overlay.classList.toggle('active');
    const toggleBtn = $('btn-help-toggle');
    if (toggleBtn) toggleBtn.setAttribute('aria-expanded', overlay.classList.contains('active') ? 'true' : 'false');
    if (!wasActive) {
      // Opening: store current focus, trap inside overlay
      _helpPrevFocus = document.activeElement;
      $('btn-help-close').focus();
      // Listen for Tab trapping at document level so it works even if focus escapes
      document.addEventListener('keydown', _helpTabTrap);
      // Click outside content to close (click on overlay backdrop)
      overlay.addEventListener('click', _helpBackdropClick);
    } else {
      // Closing: restore focus safely
      document.removeEventListener('keydown', _helpTabTrap);
      overlay.removeEventListener('click', _helpBackdropClick);
      if (_helpPrevFocus && typeof _helpPrevFocus.focus === 'function') {
        try { _helpPrevFocus.focus(); } catch(e) {}
      }
      _helpPrevFocus = null;
    }
  }
  $('btn-help-close').onclick = toggleHelp;
  $('btn-help-toggle').onclick = toggleHelp;
  document.addEventListener('keydown', (e) => {
    // Block game shortcuts when help overlay is active
    const helpActive = $('help-overlay').classList.contains('active');
    if (helpActive && (e.key === '?' || e.key === 'Escape')) {
      e.preventDefault();
      toggleHelp();
      return;
    }
    if (helpActive && (e.key === 'm' || e.key === 'M')) {
      // Allow mute even in help — it's a global control
      e.preventDefault();
      toggleMute();
      return;
    }
    if (!helpActive && e.key === '?') {
      e.preventDefault();
      toggleHelp();
    }
  });

  // Restart confirmation
  const origRestart = restartGame;
  restartGame = function() {
    if (G.waypoint > 0 && !G.completed) {
      if (!confirm('Your journey is in progress. Start a new journey and lose your progress?')) return;
    }
    if (G.completed) {
      if (!confirm('Walk the road again? Your previous journey will be left behind.')) return;
    }
    origRestart();
  };

  // Cleanup on screen transition
  const origShowScreen = showScreen;
  showScreen = function(name) {
    if (window.__swordCleanup) { window.__swordCleanup(); window.__swordCleanup = null; }
    if (window.__brushCleanup) { window.__brushCleanup(); window.__brushCleanup = null; }
    origShowScreen(name);
  };
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
