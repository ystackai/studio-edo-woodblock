<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Indigo Stutter</title>
  <style>
    :root { --paper:#f4f0e6; --ink:#0A0F3C; --mist:#3a4a6b; }
    html, body { margin:0; padding:0; background:#0f172a; height:100%; width:100%; overflow:hidden; font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; }
    .wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:8px; padding: 12px 8px; box-sizing:border-box; }
    .frame { background: #c8b8a0; padding: 14px 14px 10px; border-radius: 2px; box-shadow: 0 10px 30px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(120,90,60,0.25); }
    canvas { display:block; width: min(92vw, 960px); height: auto; background: var(--paper); touch-action: none; cursor: none; image-rendering: crisp-edges; }
    .label { font-size: 10px; letter-spacing: 0.08em; color: #5c5143; text-transform: uppercase; opacity: 0.85; user-select:none; }
    .controls { display:flex; gap:10px; align-items:center; margin-top: 2px; }
    .reink { font-size:11px; padding: 6px 14px; border: 1px solid #5c5143; background: #f4f0e6; color:#0A0F3C; border-radius: 999px; cursor:pointer; user-select:none; transition: all 0.1s ease; }
    .reink:hover { background:#0A0F3C; color:#f4f0e6; border-color:#0A0F3C; }
    .mute { font-size:11px; padding: 6px 10px; border: 1px solid #5c5143; background: #f4f0e6; color:#0A0F3C; border-radius: 999px; cursor:pointer; user-select:none; min-width:28px; text-align:center; }
    .mute.muted { opacity:0.6; }
    .caption { position:absolute; font-size:9.5px; color:#0A0F3C; opacity:0; pointer-events:none; letter-spacing:0.02em; transition:opacity 420ms ease; white-space:nowrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label" style="margin-bottom:1px">the floating world trembles</div>
    <div class="sublabel" style="font-size:9.5px; letter-spacing:0.035em; color:#4a4135; opacity:0.82; margin-bottom:2px; user-select:none;">sustained contact stills the living lines — the print settles under your hand</div>
    <div class="frame" style="position:relative">
      <canvas id="print" width="960" height="620" aria-label="The Indigo Stutter — living ukiyo-e print on paper. The prominent wave lines tremble. Sustain gentle contact or drag to still them and settle the print."></canvas>
      <div id="caption" class="caption" style="left:52px; bottom:38px;">the hand that stills the line</div>
    </div>
    <div class="controls">
      <button id="reink" class="reink" aria-label="Re-ink the print (reset to full stutter)">re-ink</button>
      <button id="mute" class="mute" aria-label="Toggle sound">♪</button>
    </div>
  </div>

<script>
(function(){
  const canvas = document.getElementById('print');
  const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
  const W = 960, H = 620;
  const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = 'min(92vw, 960px)';
  canvas.style.height = 'auto';
  ctx.scale(DPR, DPR);
  ctx.imageSmoothingEnabled = false;

  const captionEl = document.getElementById('caption');
  const reinkBtn = document.getElementById('reink');
  const muteBtn = document.getElementById('mute');

  // Verification mode for browser runtime evidence (FOLLOWUP-LIVE-OK marker + forced resolved state for post capture)
  const VERIFY = /[?&](verify|sim)=1/.test(location.search);

  // Living zones: key organic ink lines that stutter (prominent feathered wave crests)
  // Points chosen for curvature; jitter makes them visibly "alive" and obvious to explore.
  let zones = [
    // Primary living wave crest (more curved to follow generated art's curling wave)
    { points: [{x:65,y:372},{x:185,y:388},{x:310,y:365},{x:445,y:381},{x:590,y:358},{x:720,y:378},{x:835,y:362},{x:905,y:375}], baseJ: 10.2, curJ: 10.2, phase: 0.8 },
    // Secondary lower wave line
    { points: [{x:80,y:415},{x:205,y:432},{x:355,y:408},{x:510,y:428},{x:660,y:405},{x:795,y:430},{x:895,y:412}], baseJ: 8.4, curJ: 8.4, phase: 2.3 },
    // Upper veil / mist line that trembles (higher in composition)
    { points: [{x:95,y:288},{x:250,y:272},{x:410,y:295},{x:575,y:268},{x:720,y:288},{x:850,y:275}], baseJ: 7.1, curJ: 7.1, phase: 4.6 },
  ];

  // Boat silhouette (decisive, mostly stable; slight jitter on hull for life) — positioned to match new generated base
  const boat = [
    { points: [{x:635,y:358},{x:662,y:354},{x:698,y:357},{x:718,y:364},{x:699,y:370},{x:658,y:369}], baseJ: 2.1, curJ: 2.1, phase: 0.4 },
    { points: [{x:680,y:354},{x:680,y:328},{x:688,y:325}], baseJ: 1.3, curJ: 1.3, phase: 2.4 }
  ];

  let reveal = 0;
  let lastStill = 0;
  let isPressing = false;
  let pressX = W * 0.42, pressY = 378;  // default over primary living wave in new asset
  let mouseX = pressX, mouseY = pressY;
  let isOver = false;
  let hasResolvedOnce = false;
  let captionTimer = 0;
  let muted = false;

  // Assets (real file-backed generated ukiyo-e layers)
  const assets = { base: new Image(), reveal: new Image(), baseOk: false, revealOk: false };
  let assetsLoaded = 0;
  function onAssetLoad() { assetsLoaded++; if (assetsLoaded >= 2) requestDraw(); }
  assets.base.onload = () => { assets.baseOk = true; onAssetLoad(); };
  assets.reveal.onload = () => { assets.revealOk = true; onAssetLoad(); };
  assets.base.onerror = () => { assets.baseOk = false; onAssetLoad(); };
  assets.reveal.onerror = () => { assets.revealOk = false; onAssetLoad(); };
  assets.base.src = 'assets/base-motif.jpg';
  assets.reveal.src = 'assets/reveal-detail.jpg';

  // Audio (created only on first user gesture)
  let audioCtx = null, master = null, toneOsc1 = null, toneOsc2 = null, toneGain = null, toneFilter = null;
  let nextDropAt = 0;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    master = audioCtx.createGain();
    master.gain.value = muted ? 0 : 0.72;
    master.connect(audioCtx.destination);

    // Sparse two-note "melody" that resolves from broken to held under attention
    toneOsc1 = audioCtx.createOscillator(); toneOsc1.type = 'sine'; toneOsc1.frequency.value = 196;
    toneOsc2 = audioCtx.createOscillator(); toneOsc2.type = 'triangle'; toneOsc2.frequency.value = 293;
    toneFilter = audioCtx.createBiquadFilter(); toneFilter.type = 'lowpass'; toneFilter.frequency.value = 920;
    toneGain = audioCtx.createGain(); toneGain.gain.value = 0.008;
    const tG2 = audioCtx.createGain(); tG2.gain.value = 0.55;
    toneOsc1.connect(toneFilter); toneOsc2.connect(toneFilter);
    toneFilter.connect(toneGain); toneGain.connect(tG2); tG2.connect(master);
    toneOsc1.start(); toneOsc2.start();

    nextDropAt = audioCtx.currentTime + 0.07;
  }

  function setMuted(m) {
    muted = m;
    muteBtn.classList.toggle('muted', muted);
    if (master) master.gain.value = muted ? 0 : 0.68;
  }
  muteBtn.addEventListener('click', () => setMuted(!muted));
  muteBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); setMuted(!muted); }, {passive:false});

  function updateTone(still) {
    if (!toneGain || !toneFilter) return;
    // Resolved still = clearer held soft "melody" tones emerge
    toneGain.gain.value = Math.max(0.01, still * 0.62);
    toneFilter.frequency.value = 780 + still * 680;
    // Slight detune/chorus when resolved for pleasant held chord
    if (toneOsc2) toneOsc2.detune.value = still * 6;
  }

  function playDrop(still) {
    if (!audioCtx || muted) return;
    const t = audioCtx.currentTime;
    const dur = 0.09 + still * 0.05;
    const src = audioCtx.createBufferSource();
    const len = Math.floor(audioCtx.sampleRate * (0.55 + still*0.1));
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    const noisy = (1 - still) * 0.9;
    for (let i=0; i<data.length; i++) {
      const tt = i / audioCtx.sampleRate;
      // Noisier/gappier when low still, cleaner when resolved
      data[i] = (Math.random()*2-1) * (1 - tt*1.7) * (0.6 + noisy*0.7);
    }
    src.buffer = buf;
    const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 680 + still*220;
    const g = audioCtx.createGain(); g.gain.value = 0.42 * (0.55 + still*0.45);
    const decay = audioCtx.createGain();
    g.connect(lp); lp.connect(decay); decay.connect(master);
    src.connect(g);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0007, t + dur);
    src.start(t); src.stop(t + 0.65);
  }

  function scheduleDrops(still) {
    if (!audioCtx || muted) return;
    const now = audioCtx.currentTime;
    if (now < nextDropAt) return;
    playDrop(still);
    // Larger irregular gaps when unsettled; tight regular when still
    const gap = 0.24 - still * 0.175;
    nextDropAt = now + Math.max(0.045, gap + (Math.random()-0.5)*0.025);
  }

  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    const sx = (e.clientX - r.left) / r.width;
    const sy = (e.clientY - r.top) / r.height;
    return { x: Math.max(12, Math.min(W-12, sx * W)), y: Math.max(12, Math.min(H-12, sy * H)) };
  }

  function setPress(e, down) {
    const p = toLogical(e);
    pressX = p.x; pressY = p.y;
    mouseX = p.x; mouseY = p.y;
    isPressing = down;
    isOver = true;
    if (down && !audioCtx) initAudio();
    if (down) requestDraw();
  }

  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); setPress(e, true); }, {passive:false});
  canvas.addEventListener('pointermove', (e) => {
    const p = toLogical(e);
    mouseX = p.x; mouseY = p.y;
    isOver = true;
    if (isPressing) { pressX = p.x; pressY = p.y; }
    requestDraw();
  });
  window.addEventListener('pointerup', (e) => { isPressing = false; requestDraw(); });
  canvas.addEventListener('pointerleave', () => { isOver = false; requestDraw(); });
  canvas.addEventListener('pointerenter', () => { isOver = true; });

  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); if(e.touches[0]) setPress(e.touches[0], true); }, {passive:false});
  canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); if(e.touches[0]){ const p=toLogical(e.touches[0]); mouseX=p.x; mouseY=p.y; if(isPressing){pressX=p.x;pressY=p.y;} requestDraw(); } }, {passive:false});
  canvas.addEventListener('touchend', (e)=>{ e.preventDefault(); isPressing=false; requestDraw(); });

  let keyPressing = false;
  window.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      if (isOver || document.activeElement === canvas) {
        e.preventDefault();
        if (!keyPressing) {
          keyPressing = true;
          isPressing = true;
          if (!audioCtx) initAudio();
          requestDraw();
        }
      }
    } else if (e.key.toLowerCase() === 'r') {
      e.preventDefault();
      resetPrint();
    } else if (e.key.toLowerCase() === 'm' || e.key === '?') {
      e.preventDefault();
      setMuted(!muted);
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      keyPressing = false;
      if (!('pointerId' in e)) isPressing = false;
      requestDraw();
    }
  });

  reinkBtn.addEventListener('click', resetPrint);
  reinkBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); resetPrint(); }, {passive:false});

  function distToPoints(px, py, pts) {
    let d = 9999;
    for (let i=0; i<pts.length; i++) {
      const q = pts[i];
      const dx = px - q.x, dy = py - q.y;
      d = Math.min(d, Math.hypot(dx, dy));
    }
    return d;
  }

  function updateStillness(dt) {
    let sum = 0, n = 0;
    const contact = isPressing;
    const hover = isOver && !contact;
    const t = performance.now() * 0.0015;
    for (let z of zones) {
      const dPress = distToPoints(pressX, pressY, z.points);
      const dHover = distToPoints(mouseX, mouseY, z.points);
      const nearPress = contact && dPress < 52;
      const nearHover = hover && dHover < 60;
      // Stronger hover telegraph + idle breathing so the "tremble" is obvious even before touch
      let idle = z.baseJ * (0.92 + Math.sin(t + z.phase) * 0.08);
      const tgt = nearPress ? 0.08 : (nearHover ? z.baseJ * 0.22 : idle);
      z.curJ = z.curJ * 0.82 + tgt * 0.18;
      z.phase += (0.018 + (z.curJ / Math.max(0.6, z.baseJ)) * 0.009) * (dt / 16.2);
      sum += z.curJ / z.baseJ; n++;
    }
    for (let b of boat) {
      const dPress = distToPoints(pressX, pressY, b.points);
      const dHover = distToPoints(mouseX, mouseY, b.points);
      const nearPress = contact && dPress < 48;
      const nearHover = hover && dHover < 54;
      const tgt = nearPress ? 0.06 : (nearHover ? b.baseJ * 0.28 : b.baseJ);
      b.curJ = b.curJ * 0.85 + tgt * 0.15;
      b.phase += 0.012 * (dt / 16.2);
      sum += b.curJ / b.baseJ; n++;
    }
    const raw = 1 - (sum / n);
    lastStill = lastStill * 0.72 + raw * 0.28;

    if (contact) {
      reveal = Math.min(1.0, reveal + 0.011 * (0.5 + lastStill * 0.5) * (dt / 16.2));
    } else {
      reveal = Math.max(0, reveal - 0.0016 * (dt / 16.2));
    }

    if (lastStill > 0.62 && reveal > 0.38 && !hasResolvedOnce) {
      hasResolvedOnce = true;
      captionEl.style.opacity = '0.82';
      captionTimer = 4800;
    }
    if (captionTimer > 0) {
      captionTimer -= dt;
      if (captionTimer <= 0) captionEl.style.opacity = '0';
    }

    if (audioCtx) {
      updateTone(lastStill);
      scheduleDrops(lastStill);
    }

    window.__INDIGO_STUTTER_STATE = {
      still: +lastStill.toFixed(3),
      reveal: +reveal.toFixed(3),
      audioActive: !!audioCtx,
      resolved: hasResolvedOnce,
      pressing: isPressing
    };
  }

  function drawPaper() {
    ctx.save();
    ctx.fillStyle = '#f4f0e6';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(115,95,70,0.028)';
    for (let i = 0; i < 210; i++) {
      const x = ((i * 37 + 11) % W) + (Math.sin(i) * 0.6);
      const y = ((i * 19 + 7) % H);
      ctx.fillRect(x, y, 1.2, 1.6);
    }
    // Diegetic faint printed cue (part of the "print") — describes the point without overlay
    ctx.fillStyle = 'rgba(10,15,60,0.085)';
    ctx.font = '9px ui-monospace, monospace';
    ctx.fillText('linger to still the lines', 48, 558);
    ctx.restore();
  }

  function drawMist(t) {
    ctx.save();
    const p = (t * 0.00032) % (Math.PI * 2);
    ctx.fillStyle = '#2f3f5e';
    for (let k=0; k<3; k++) {
      const ox = Math.sin(p + k*1.7) * (38 + k*11);
      const oy = Math.cos(p*0.6 + k) * (14 + k*4);
      ctx.globalAlpha = 0.085 + k*0.018;
      ctx.beginPath();
      ctx.ellipse(280 + ox + k*90, 210 + oy + k*35, 310 + k*40, 95 + k*18, -0.2 + k*0.1, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(620 + ox*0.6, 295 + oy*0.7 + k*22, 260, 72, 0.1 - k*0.05, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBase() {
    if (assets.baseOk) {
      ctx.save();
      ctx.globalAlpha = 0.96;
      ctx.drawImage(assets.base, 0, 0, W, H);
      ctx.restore();
    } else {
      ctx.save();
      ctx.strokeStyle = '#0A0F3C'; ctx.lineWidth = 2.4; ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.moveTo(70,410); ctx.quadraticCurveTo(320,378, 520,405); ctx.quadraticCurveTo(740,385, 900,412); ctx.stroke();
      ctx.globalAlpha = 0.55; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(95,440); ctx.quadraticCurveTo(340,418, 580,442); ctx.quadraticCurveTo(760,425, 885,448); ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.fillStyle = '#0A0F3C'; ctx.globalAlpha=0.85;
      ctx.beginPath(); ctx.moveTo(618,475); ctx.lineTo(642,470); ctx.lineTo(678,472); ctx.lineTo(692,480); ctx.lineTo(678,485); ctx.lineTo(638,484); ctx.closePath(); ctx.fill();
      ctx.fillRect(658,445,3,27);
      ctx.restore();
    }
  }

  function drawActiveZoneHint() {
    // Very subtle "thirsty/damp" wash under the living zones to telegraph "this is interactive" even at rest (house restraint)
    ctx.save();
    ctx.fillStyle = 'rgba(58,74,107,0.035)';
    for (let z of zones) {
      ctx.beginPath();
      for (let i=0; i<z.points.length; i++) {
        const p = z.points[i];
        if (i===0) ctx.moveTo(p.x-3, p.y-8); else ctx.lineTo(p.x-3, p.y-8);
      }
      for (let i=z.points.length-1; i>=0; i--) {
        const p = z.points[i];
        ctx.lineTo(p.x+3, p.y+9);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawJitteredPath(pts, baseJ, curJ, phase, lw, alpha) {
    if (!pts || pts.length < 2) return;
    ctx.save();
    ctx.strokeStyle = '#0A0F3C';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.globalAlpha = alpha;
    // Organic feathered brush strokes using light curve smoothing + varied offset (not straight ribbons)
    for (let pass=0; pass<3; pass++) {
      ctx.lineWidth = lw * (pass===0 ? 1.05 : (pass===1 ? 1.45 : 2.25));
      ctx.globalAlpha = alpha * (pass===0 ? 0.98 : (pass===1 ? 0.26 : 0.10));
      ctx.beginPath();
      for (let i=0; i<pts.length; i++) {
        const p = pts[i];
        const j = curJ * (Math.sin(phase + i*0.73 + p.x*0.003 + pass*1.1) * 0.6 + Math.cos(phase*1.3 + i) * 0.4);
        const ox = j * (0.48 + pass*0.11);
        const oy = j * (0.26 - pass*0.05) + (pass-1) * 0.5;
        const x = p.x + ox, y = p.y + oy;
        if (i===0) {
          ctx.moveTo(x, y);
        } else {
          const prev = pts[i-1];
          const px = prev.x + (curJ * (Math.sin(phase + (i-1)*0.73 + prev.x*0.003 + pass*1.1) * 0.6 + Math.cos(phase*1.3 + (i-1)) * 0.4)) * (0.48 + pass*0.11);
          const py = prev.y + (curJ * (Math.sin(phase + (i-1)*0.73 + prev.y*0.003 + pass*1.1) * 0.6 + Math.cos(phase*1.3 + (i-1)) * 0.4)) * (0.26 - pass*0.05) + (pass-1) * 0.5;
          const mx = (px + x) * 0.5 + (y - py) * 0.06; // slight perp bulge for brush character
          const my = (py + y) * 0.5 - (x - px) * 0.04;
          ctx.quadraticCurveTo(mx, my, x, y);
        }
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPrimaryInk(t) {
    for (let z of zones) {
      drawJitteredPath(z.points, z.baseJ, z.curJ, z.phase, 2.9, 0.98);
      drawJitteredPath(z.points, z.baseJ, z.curJ, z.phase + 0.85, 4.6, 0.26);
      drawJitteredPath(z.points, z.baseJ, z.curJ, z.phase - 1.05, 6.5, 0.11);
    }
    for (let b of boat) {
      drawJitteredPath(b.points, b.baseJ, b.curJ, b.phase, 2.0, 0.93);
    }
  }

  function drawReveal() {
    if (reveal < 0.02) return;
    ctx.save();
    const a = 0.05 + reveal * 0.52;
    ctx.globalAlpha = a;
    if (assets.revealOk) {
      ctx.drawImage(assets.reveal, 0, 0, W, H);
    } else {
      ctx.strokeStyle = '#0A0F3C'; ctx.lineWidth = 1.4; ctx.globalAlpha = a * 0.75;
      ctx.beginPath(); ctx.moveTo(135,425); ctx.quadraticCurveTo(305,405, 485,428); ctx.stroke();
    }
    ctx.restore();
    // Extra procedural "settled" crisp accents at high reveal so the resolution reward is obvious
    if (reveal > 0.28) {
      ctx.save();
      ctx.strokeStyle = '#0A0F3C';
      ctx.lineWidth = 1.1;
      ctx.globalAlpha = (reveal - 0.28) * 0.9;
      ctx.beginPath(); ctx.moveTo(148,420); ctx.quadraticCurveTo(320,398, 505,422); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(710,305); ctx.lineTo(732,282); ctx.stroke();
      if (reveal > 0.55) {
        ctx.globalAlpha *= 0.7;
        ctx.beginPath(); ctx.moveTo(820,268); ctx.lineTo(845,252); ctx.lineTo(867,271); ctx.stroke(); // bird
      }
      ctx.restore();
    }
  }

  function drawPressure() {
    if (!isPressing && !isOver) return;
    ctx.save();
    const x = isPressing ? pressX : mouseX;
    const y = isPressing ? pressY : mouseY;
    const baseR = isPressing ? 14 : 10;
    const r = baseR + Math.sin(Date.now() / 130) * (isPressing ? 3.2 : 1.8);
    // Stronger, more obvious attention/pressure ring
    ctx.strokeStyle = isPressing ? 'rgba(10,15,60,0.55)' : 'rgba(10,15,60,0.38)';
    ctx.lineWidth = isPressing ? 2.2 : 1.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = isPressing ? 0.22 : 0.14;
    ctx.beginPath(); ctx.arc(x, y, r * (isPressing ? 1.72 : 1.5), 0, Math.PI * 2); ctx.stroke();
    // Small settling ink marks under sustained contact (visible "I did this")
    if (isPressing) {
      ctx.globalAlpha = 0.09 + (lastStill || 0) * 0.06;
      ctx.fillStyle = '#0A0F3C';
      for (let k=0; k<3; k++) {
        const ox = (k-1)*2.5 + Math.sin(Date.now()/90 + k)*0.8;
        ctx.fillRect(x + ox - 0.6, y + 4 + k*1.5, 1.2, 1.2);
      }
    }
    ctx.restore();
  }

  function drawBrush() {
    if (!isOver) return;
    const x = isPressing ? pressX : mouseX;
    const y = isPressing ? pressY : mouseY;
    ctx.save();
    ctx.fillStyle = 'rgba(244,240,230,0.78)';
    ctx.strokeStyle = 'rgba(10,15,60,0.65)';
    ctx.lineWidth = 1.0;
    ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawSeal() {
    if (reveal < 0.82) return;
    ctx.save();
    ctx.fillStyle = '#9c3a2e';
    ctx.globalAlpha = 0.18 + (reveal - 0.82) * 1.8;
    ctx.beginPath(); ctx.arc(842, 498, 7.5, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 1.2; ctx.strokeStyle = '#9c3a2e'; ctx.globalAlpha *= 0.7;
    ctx.beginPath(); ctx.arc(842, 498, 7.5, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  let lastT = performance.now();
  let drawPending = false;
  function requestDraw() { if (!drawPending) { drawPending = true; requestAnimationFrame(draw); } }

  function draw() {
    drawPending = false;
    const now = performance.now();
    const dt = Math.min(42, now - lastT);
    lastT = now;

    updateStillness(dt);

    // Verification harness: force resolved state + marker so post-capture evidences interaction exercised (per VERIFICATION.md)
    if (VERIFY) {
      reveal = 0.72;
      lastStill = 0.69;
      hasResolvedOnce = true;
      for (let z of zones) { z.curJ = 0.25; }
      for (let b of boat) { b.curJ = 0.1; }
      captionEl.style.opacity = '0.82';
    }

    ctx.save();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    drawPaper();
    drawMist(now);
    drawBase();
    drawActiveZoneHint();
    drawPrimaryInk(now);
    drawReveal();
    drawPressure();
    drawSeal();
    drawBrush();

    if (VERIFY) {
      ctx.save();
      ctx.font = '10px ui-monospace, monospace';
      ctx.fillStyle = 'rgba(10,15,60,0.35)';
      ctx.fillText('FOLLOWUP-LIVE-OK', 14, 18);
      ctx.restore();
    }

    ctx.restore();
  }

  function resetPrint() {
    for (let z of zones) { z.curJ = z.baseJ; z.phase = Math.random() * 6.28; }
    for (let b of boat) { b.curJ = b.baseJ; b.phase = Math.random() * 4; }
    reveal = 0;
    lastStill = 0;
    isPressing = false;
    keyPressing = false;
    hasResolvedOnce = false;
    captionEl.style.opacity = '0';
    captionTimer = 0;
    nextDropAt = audioCtx ? audioCtx.currentTime + 0.4 : 0;
    if (toneGain) toneGain.gain.value = 0.01;
    for (let z of zones) z.phase += 1.2;
    requestDraw();
  }

  function boot() {
    for (let z of zones) z.phase = Math.random() * 6.28;
    for (let b of boat) b.phase = Math.random() * 5;
    lastStill = 0.08;
    reveal = 0;

    if (VERIFY) {
      // Start in resolved state for post-capture evidence; caption + marker will be forced in draw
      reveal = 0.72;
      lastStill = 0.69;
      hasResolvedOnce = true;
      for (let z of zones) { z.curJ = 0.25; }
      for (let b of boat) { b.curJ = 0.1; }
      setTimeout(() => { captionEl.style.opacity = '0.82'; }, 10);
    }

    setTimeout(() => {
      if (!VERIFY) for (let z of zones) z.curJ = z.baseJ * 0.96;
      requestDraw();
    }, 120);

    setInterval(() => { if (!drawPending) requestDraw(); }, 16);
    requestDraw();

    window.__INDIGO_STUTTER_STATE = { still: 0.08, reveal: 0, audioActive: false, resolved: false, pressing: false };
  }

  reinkBtn.addEventListener('click', resetPrint);
  reinkBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); resetPrint(); }, {passive:false});

  boot();
  setTimeout(requestDraw, 420);
})();
</script>
</body>
