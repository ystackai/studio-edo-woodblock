<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Floating Moment — Capture the Ephemeral</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #1f1b16;
      font-family: 'IBM Plex Mono', 'Noto Serif JP', 'Georgia', serif;
      -webkit-user-select: none; user-select: none; touch-action: none;
      color: #e8e0d8;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

    #header {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      text-align: center; pointer-events: none; z-index: 12;
      transition: opacity 0.8s ease;
    }
    #header h1 {
      font-size: 0.95rem; color: rgba(232,224,216,0.45);
      font-weight: 400; letter-spacing: 0.18em;
    }
    #header .sub {
      font-size: 0.5rem; color: rgba(232,224,216,0.18);
      margin-top: 3px; letter-spacing: 0.10em;
    }

    #hint {
      position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
      font-size: 1.1rem; color: rgba(232,224,216,0.30);
      letter-spacing: 0.2em; text-align: center; pointer-events: none; z-index: 10;
      transition: opacity 2.0s ease;
      line-height: 1.6;
    }
    #hint .action { color: rgba(232,224,216,0.5); font-style: italic; }
    #hint .key { color: rgba(232,224,216,0.35); }

    #controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 20;
    }
    #controls button {
      background: rgba(232,224,216,0.06); border: 1px solid rgba(232,224,216,0.12);
      border-radius: 20px; padding: 6px 16px; font-size: 0.55rem;
      color: rgba(232,224,216,0.4); cursor: pointer; z-index: 20;
      font-family: inherit; letter-spacing: 0.08em;
      transition: background 0.2s, color 0.2s;
    }
    #controls button:hover { background: rgba(232,224,216,0.12); color: rgba(232,224,216,0.7); }
    #controls button:active { background: rgba(232,224,216,0.18); }

    #palette-hint {
      position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
      font-size: 0.45rem; color: rgba(232,224,216,0.15);
      letter-spacing: 0.10em; pointer-events: none; z-index: 15;
    }

    #counter {
      position: absolute; bottom: 20px; right: 20px;
      font-size: 0.55rem; color: rgba(232,224,216,0.20);
      letter-spacing: 0.06em; pointer-events: none; z-index: 15;
    }

    @media (max-width: 600px) {
      #header h1 { font-size: 0.75rem; }
      #hint { font-size: 0.85rem; }
      #controls button { padding: 4px 12px; font-size: 0.5rem; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="header">
    <h1>Floating Moment</h1>
    <div class="sub">ukiyo-e · the ephemeral beauty of a single bloom</div>
  </div>

  <div id="hint">
    <span class="action">click · tap · press</span><br>
    <span class="key">1–5</span> choose flower · <span class="key">r</span> scatter
  </div>

  <div id="controls">
    <button id="reset-btn">✻ scatter</button>
    <button id="fade-btn">◐ fade</button>
  </div>

  <div id="palette-hint">flowers drift and fade — each moment is the only one</div>
  <div id="counter">0 blooms</div>

  <script>
    (function () {
      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d');
      const hint = document.getElementById('hint');
      const header = document.getElementById('header');
      const counterEl = document.getElementById('counter');
      const resetBtn = document.getElementById('reset-btn');
      const fadeBtn = document.getElementById('fade-btn');

      let W, H;
      let blooms = [];
      let flowerPalette = 0;
      let frame = 0;
      let hintFade = false;

      // ---- Flower definitions (ukiyo-e woodblock motifs) ----
      const FLOWERS = [
        { name: 'cherry',    petals: 5, inner: 0, sizeMul: 1.0, hue: 345, sat: 40, light: 75, innerHue: 350, innerLight: 60 },
        { name: 'chrysanthemum', petals: 12, inner: 4, sizeMul: 1.2, hue: 45, sat: 50, light: 70, innerHue: 30, innerLight: 55 },
        { name: 'plum',      petals: 5, inner: 0, sizeMul: 0.9, hue: 355, sat: 35, light: 80, innerHue: 0, innerLight: 65 },
        { name: 'camellia',  petals: 8, inner: 0, sizeMul: 1.1, hue: 0, sat: 55, light: 65, innerHue: 355, innerLight: 50 },
        { name: 'lotus',     petals: 10, inner: 6, sizeMul: 1.3, hue: 220, sat: 35, light: 75, innerHue: 240, innerLight: 60 },
      ];

      function resize() {
        W = canvas.clientWidth;
        H = canvas.clientHeight;
        canvas.width = W * devicePixelRatio;
        canvas.height = H * devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }

      function createBloom(x, y, paletteIdx) {
        const f = FLOWERS[paletteIdx % FLOWERS.length];
        const hueOffset = (Math.random() * 20 - 10);
        const driftSpeed = 0.002 + Math.random() * 0.008;
        const driftAngle = Math.random() * Math.PI * 2;
        const size = (0.3 + Math.random() * 0.7) * f.sizeMul;
        const life = 200 + Math.random() * 400;
        return {
          x, y,
          size,
          hue: f.hue + hueOffset,
          sat: f.sat + (Math.random() * 10 - 5),
          light: f.light + (Math.random() * 10 - 5),
          innerHue: f.innerHue + hueOffset,
          innerLight: f.innerLight + (Math.random() * 10 - 5),
          petalCount: f.petals,
          innerCount: f.inner,
          driftVx: Math.cos(driftAngle) * driftSpeed * size,
          driftVy: Math.sin(driftAngle) * driftSpeed * size,
          age: 0,
          maxAge: life,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.003,
        };
      }

      function scatter(count) {
        const cx = W * 0.5;
        const cy = H * 0.5;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.sqrt(Math.random()) * W * 0.35;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          blooms.push(createBloom(x, y, Math.floor(Math.random() * FLOWERS.length)));
        }
        updateCounter();
        if (!hintFade && blooms.length > 0) {
          hintFade = true;
          hint.style.opacity = '0';
          setTimeout(function () { hint.style.display = 'none'; }, 2000);
        }
      }

      function resetAll() {
        blooms = [];
        flowerPalette = 0;
        updateCounter();
        hint.style.display = '';
        hint.style.opacity = '1';
        hintFade = false;
      }

      function updateCounter() {
        counterEl.textContent = blooms.length + ' blooms';
      }

      // ---- Drawing ----
      function drawBloom(b) {
        const progress = b.age / b.maxAge;
        const fade = 1 - progress;
        const alpha = fade * 0.85;
        const scale = b.size * (0.6 + 0.4 * (1 - progress));

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);

        const petalCount = b.petalCount;
        const angleStep = Math.PI * 2 / petalCount;
        const petalLen = scale * 18;
        const petalWidth = scale * 6;

        for (let i = 0; i < petalCount; i++) {
          const a = i * angleStep;
          const x1 = Math.cos(a) * petalLen * 0.4;
          const y1 = Math.sin(a) * petalLen * 0.4;
          const x2 = Math.cos(a + 0.3) * petalLen;
          const y2 = Math.sin(a + 0.3) * petalLen;
          const x3 = Math.cos(a - 0.3) * petalLen;
          const y3 = Math.sin(a - 0.3) * petalLen;

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.quadraticCurveTo(x2, y2, 0, 0);
          ctx.quadraticCurveTo(x3, y3, x1, y1);
          ctx.closePath();

          const h = b.hue + (i / petalCount) * 15;
          ctx.fillStyle = 'hsla(' + h + ',' + b.sat + '%,' + b.light + '%,' + alpha + ')';
          ctx.fill();
        }

        if (b.innerCount > 0) {
          const innerStep = Math.PI * 2 / b.innerCount;
          const innerLen = scale * 10;
          for (let i = 0; i < b.innerCount; i++) {
            const a = i * innerStep + 0.15;
            const x1 = Math.cos(a) * innerLen * 0.4;
            const y1 = Math.sin(a) * innerLen * 0.4;
            const x2 = Math.cos(a + 0.2) * innerLen;
            const y2 = Math.sin(a + 0.2) * innerLen;
            const x3 = Math.cos(a - 0.2) * innerLen;
            const y3 = Math.sin(a - 0.2) * innerLen;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.quadraticCurveTo(x2, y2, 0, 0);
            ctx.quadraticCurveTo(x3, y3, x1, y1);
            ctx.closePath();

            ctx.fillStyle = 'hsla(' + b.innerHue + ',' + 30 + '%,' + b.innerLight + '%,' + (alpha * 0.8) + ')';
            ctx.fill();
          }
        }

        // Center stamen dots
        const dotCount = 3 + Math.floor(scale * 2);
        for (let i = 0; i < dotCount; i++) {
          const da = Math.random() * Math.PI * 2;
          const dd = scale * 4 * Math.random();
          ctx.beginPath();
          ctx.arc(Math.cos(da) * dd, Math.sin(da) * dd, scale * 1.2, 0, Math.PI * 2);
          ctx.fillStyle = 'hsla(' + (b.hue + 20) + ',60%,' + (b.light + 5) + '%,' + (alpha * 0.5) + ')';
          ctx.fill();
        }

        ctx.restore();
      }

      // ---- Background ----
      function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, '#2a241f');
        grad.addColorStop(0.5, '#1f1b16');
        grad.addColorStop(1, '#181410');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Subtle grain texture
        const grainAlpha = 0.012;
        for (let i = 0; i < 60; i++) {
          const gx = Math.random() * W;
          const gy = Math.random() * H;
          const gw = Math.random() * 40 + 5;
          const gh = Math.random() * 2 + 1;
          ctx.fillStyle = 'rgba(200,180,160,' + (grainAlpha * Math.random()) + ')';
          ctx.fillRect(gx, gy, gw, gh);
        }

        const glow = ctx.createRadialGradient(W * 0.5, H * 0.6, 0, W * 0.5, H * 0.6, W * 0.6);
        glow.addColorStop(0, 'rgba(80,70,60,0.08)');
        glow.addColorStop(1, 'rgba(80,70,60,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, H);
      }


      // ---- Dust particles for lingering beauty after fade ----
      let dustParticles = [];
      function spawnDust(x, y, hue, size) {
        for (let i = 0; i < 6; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.01 + Math.random() * 0.03;
          dustParticles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed * size,
            vy: Math.sin(angle) * speed * size,
            life: 60 + Math.random() * 60,
            age: 0,
            hue: hue + (Math.random() - 0.5) * 20,
            size: 1.0 + Math.random() * 2.0,
          });
        }
      }

      function drawDust() {
        for (let i = dustParticles.length - 1; i >= 0; i--) {
          const p = dustParticles[i];
          p.age++;
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.98;
          p.vy *= 0.98;
          const progress = p.age / p.life;
          if (progress >= 1) {
            dustParticles.splice(i, 1);
            continue;
          }
          const alpha = (1 - progress) * 0.4;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (1 - progress * 0.5), 0, Math.PI * 2);
          ctx.fillStyle = 'hsla(' + p.hue + ',40%,70%,' + alpha + ')';
          ctx.fill();
        }
      }

      // ---- Main loop ----
      function tick() {
        frame++;
        drawBackground();

        for (let i = 0; i < blooms.length; i++) {
          const b = blooms[i];
          b.age++;
          b.x += b.driftVx;
          b.y += b.driftVy;
          b.rot += b.rotSpeed;

          b.x += Math.sin(frame * 0.002 + i) * 0.15;
          b.y += Math.cos(frame * 0.0025 + i * 0.7) * 0.1;
        }

        for (var i = blooms.length - 1; i >= 0; i--) {
          var b = blooms[i];
          if (b.age >= b.maxAge) {
            spawnDust(b.x, b.y, b.hue, b.size);
            blooms.splice(i, 1);
          }
        }
        updateCounter();

        var sorted = blooms.slice().sort(function (a, b) { return a.age - b.age; });
        for (var i = 0; i < sorted.length; i++) {
          drawBloom(sorted[i]);
        }

        drawDust();
        requestAnimationFrame(tick);
      }

      // ---- Interaction ----
      function spawnAt(e) {
        var rect = canvas.getBoundingClientRect();
        var x, y;
        if (e.touches) {
          x = e.touches[0].clientX - rect.left;
          y = e.touches[0].clientY - rect.top;
        } else {
          x = e.clientX - rect.left;
          y = e.clientY - rect.top;
        }
        x = Math.max(0, Math.min(W, x));
        y = Math.max(0, Math.min(H, y));
        blooms.push(createBloom(x, y, flowerPalette % FLOWERS.length));
        flowerPalette++;
        updateCounter();
        if (!hintFade) {
          hintFade = true;
          hint.style.opacity = '0';
          setTimeout(function () { hint.style.display = 'none'; }, 2000);
        }
      }

      canvas.addEventListener('click', spawnAt);

      canvas.addEventListener('touchstart', function (e) {
        e.preventDefault();
        spawnAt(e);
      }, { passive: false });

      document.addEventListener('keydown', function (e) {
        var key = e.key;
        if (key >= '1' && key <= '5') {
          flowerPalette = parseInt(key) - 1;
        }
        if (key === 'r' || key === 'R') {
          scatter(40);
        }
      });

      resetBtn.addEventListener('click', function () { scatter(40); });
      resetBtn.addEventListener('touchstart', function (e) {
        e.preventDefault();
        scatter(40);
      }, { passive: false });

      fadeBtn.addEventListener('click', function () {
        for (var i = 0; i < blooms.length; i++) {
          blooms[i].age = blooms[i].maxAge - 30;
        }
      });
      fadeBtn.addEventListener('touchstart', function (e) {
        e.preventDefault();
        for (var i = 0; i < blooms.length; i++) {
          blooms[i].age = blooms[i].maxAge - 30;
        }
      }, { passive: false });

      resize();
      window.addEventListener('resize', resize);
      scatter(40);
      // Gentle welcoming bloom pulse at center
      for (var i = 0; i < 5; i++) {
        setTimeout(function() {
          var cx = W * 0.5 + (Math.random() - 0.5) * W * 0.1;
          var cy = H * 0.5 + (Math.random() - 0.5) * H * 0.1;
          blooms.push(createBloom(cx, cy, Math.floor(Math.random() * FLOWERS.length)));
        }, i * 300 + 200);
      }
      tick();
    })();
  </script>
</body>
</html>
