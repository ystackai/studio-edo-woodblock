<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edo Inkblade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;color:#e0d5c8;font-family:'Segoe UI',system-ui,sans-serif;display:flex;justify-content:center;padding:20px}
#game{max-width:800px;width:100%}
canvas{display:block;background:#2d2418;border:2px solid #5a4a38;border-radius:4px;width:100%;aspect-ratio:4/3}
#ui{display:flex;justify-content:space-between;padding:10px 0;gap:10px}
#info{display:flex;gap:20px;font-size:14px}
#info span{background:#2d2418;padding:4px 10px;border-radius:4px;border:1px solid #5a4a38}
#controls{font-size:13px;color:#a09080}
.hidden{display:none}
#char-select{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px;margin-bottom:10px}
#char-select h2{font-size:18px;font-weight:400}
#char-select div{display:flex;gap:12px}
#char-select button{padding:10px 20px;border:1px solid #5a4a38;border-radius:4px;cursor:pointer;font-size:14px}
#char-select button.selected{border-color:#d4b878;background:#3a3028}
</style>
</head>
<body>
<div id="game">
  <h1 style="text-align:center;font-size:20px;font-weight:400;padding:6px 0">Edo Inkblade</h1>
  <div id="char-select">
    <h2>Choose your style</h2>
    <div>
      <button data-char="musashi" class="selected">Miyamoto Musashi</button>
      <button data-char="koeda">Koeda Kendo</button>
      <button data-char="yoshino">Yoshino Yagyu</button>
    </div>
    <p style="font-size:12px;color:#a09080">WASD move · Space art · E duel · F objective</p>
  </div>
  <canvas id="c" width="800" height="600"></canvas>
  <div id="ui">
    <div id="info"><span id="hp">HP: 100</span><span id="ink">Ink: 3</span><span id="obj">Artwork: 0/3</span></div>
    <div id="controls">WASD move · Space art · E duel</div>
  </div>
</div>
<script>
// Edo Inkblade — minimal playable scaffold
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;

// Character definitions
const chars = {
  musashi: { name: 'Miyamoto Musashi', hp: 100, ink: 3, speed: 3, artStyle: 'watercolor', color: '#d4b878' },
  koeda: { name: 'Koeda Kendo', hp: 120, ink: 2, speed: 4, artStyle: 'brush', color: '#78b8d4' },
  yoshino: { name: 'Yoshino Yagyu', hp: 80, ink: 5, speed: 2, artStyle: 'woodblock', color: '#d47878' }
};

// Game state
let selectedChar = 'musashi';
let player = { x: 100, y: 300, hp: 100, maxHp: 100, ink: 3, maxInk: 5 };
let artworks = [];
let enemies = [];
let duelActive = false;
let duelTimer = 0;
let artMarks = [];
let objective = { completed: 0, needed: 3 };
let keys = {};
let messages = [];
let frame = 0;

function resetPlayer(char) {
  const c = chars[char];
  player = { x: 100, y: 300, hp: c.hp, maxHp: c.hp, ink: c.ink, maxInk: 5 };
  artworks = [];
  artMarks = [];
  enemies = [
    { x: 600, y: 200, hp: 40, maxHp: 40, type: 'ronin', patrol: true, dir: 1 },
    { x: 650, y: 450, hp: 50, maxHp: 50, type: 'bandit', patrol: true, dir: -1 }
  ];
  duelActive = false;
  objective = { completed: 0, needed: 3 };
}

resetPlayer(selectedChar);

// Character selection
document.querySelectorAll('#char-select button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#char-select button').forEach(x => x.classList.remove('selected'));
    b.classList.add('selected');
    selectedChar = b.dataset.char;
    resetPlayer(selectedChar);
  });
});

// Input
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') handleArt();
  if (e.key.toLowerCase() === 'e') handleDuelStart();
  if (e.key.toLowerCase() === 'f') handleObjective();
});
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Movement
function movePlayer() {
  const s = chars[selectedChar].speed;
  let dx = 0, dy = 0;
  if (keys['w']) dy -= s;
  if (keys['s']) dy += s;
  if (keys['a']) dx -= s;
  if (keys['d']) dx += s;
  player.x = Math.max(20, Math.min(W - 20, player.x + dx));
  player.y = Math.max(20, Math.min(H - 20, player.y + dy));
}

// Enemy patrol
function updateEnemies() {
  for (const e of enemies) {
    if (e.patrol) {
      e.x += e.dir * 1.2;
      if (e.x > 750 || e.x < 200) e.dir *= -1;
    }
    // Detect player proximity
    const dist = Math.hypot(player.x - e.x, player.y - e.y);
    if (dist < 60 && !duelActive) {
      duelActive = true;
      duelTimer = 60;
      addMsg(`Duel with ${e.type}!`);
    }
  }
}

// Art action (Space)
function handleArt() {
  if (player.ink <= 0) return;
  player.ink--;
  const style = chars[selectedChar].artStyle;
  const mark = {
    x: player.x, y: player.y,
    style, frame: 0,
    color: chars[selectedChar].color
  };
  artMarks.push(mark);
  artworks.push({ x: player.x, y: player.y, style });
  addMsg(`${style} mark placed`);
  if (artworks.length >= objective.needed) {
    objective.completed = objective.needed;
    addMsg('Objective met! Artwork complete.');
  }
  updateUI();
}

// Duel action (E)
function handleDuelStart() {
  if (duelActive) return;
  for (const e of enemies) {
    const dist = Math.hypot(player.x - e.x, player.y - e.y);
    if (dist < 80) {
      duelActive = true;
      duelTimer = 60;
      addMsg(`Duel with ${e.type}!`);
      return;
    }
  }
  addMsg('No enemy nearby');
}

function updateDuel() {
  if (!duelActive) return;
  duelTimer--;
  if (duelTimer % 20 === 0 && duelTimer > 0) {
    const e = enemies.find(e => Math.hypot(player.x - e.x, player.y - e.y) < 80) || enemies[0];
    if (e) {
      player.hp -= 5;
      e.hp -= 15;
      addMsg(`Strike! ${e.type} -${15}HP, you -${5}HP`);
      if (e.hp <= 0) {
        addMsg(`${e.type} defeated!`);
        enemies = enemies.filter(x => x.hp > 0);
        duelActive = false;
        objective.completed = Math.min(objective.needed, objective.completed + 1);
      }
    }
  }
  if (duelTimer <= 0) duelActive = false;
  if (player.hp <= 0) { addMsg('Defeated — resetting'); resetPlayer(selectedChar); }
  updateUI();
}

// Objective (F)
function handleObjective() {
  addMsg(`Artwork: ${artworks.length}/${objective.needed} · Enemies: ${enemies.length}`);
}

function addMsg(t) { messages.push(t); if (messages.length > 8) messages.shift(); }

// Render
function draw() {
  ctx.clearRect(0, 0, W, H);
  // Ground
  ctx.fillStyle = '#2d2418';
  ctx.fillRect(0, 0, W, H);
  // Checkerboard floor
  for (let i = 0; i < W; i += 40) {
    for (let j = 0; j < H; j += 40) {
      ctx.fillStyle = ((i / 40 + j / 40) % 2 === 0) ? '#3a3028' : '#2d2418';
      ctx.fillRect(i, j, 40, 40);
    }
  }
  // Art marks
  for (const m of artMarks) {
    m.frame++;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    if (m.style === 'watercolor') {
      ctx.fillStyle = m.color;
      ctx.arc(m.x, m.y, 20 + Math.sin(m.frame * 0.05) * 4, 0, Math.PI * 2);
      ctx.fill();
    } else if (m.style === 'brush') {
      ctx.strokeStyle = m.color;
      ctx.lineWidth = 6;
      for (let t = 0; t < 1; t += 0.1) {
        const angle = m.frame * 0.03 + t * Math.PI;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x + Math.cos(angle) * 25, m.y + Math.sin(angle) * 25);
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = m.color;
      for (let t = 0; t < 4; t++) {
        const a = m.frame * 0.02 + t * Math.PI / 2;
        ctx.fillRect(m.x + Math.cos(a) * 18 - 4, m.y + Math.sin(a) * 18 - 4, 8, 8);
      }
    }
    ctx.globalAlpha = 1;
  }
  // Enemies
  for (const e of enemies) {
    ctx.fillStyle = e.type === 'ronin' ? '#6b4a3a' : '#3a4a6b';
    ctx.beginPath();
    ctx.arc(e.x, e.y, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.fillText(`${e.type} ${e.hp}HP`, e.x - 20, e.y - 22);
  }
  // Player
  const pc = chars[selectedChar];
  ctx.fillStyle = pc.color;
  ctx.beginPath();
  ctx.arc(player.x, player.y, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '11px monospace';
  ctx.fillText(pc.name.split(' ')[0], player.x - 16, player.y - 22);
  // Duel indicator
  if (duelActive) {
    ctx.strokeStyle = '#ff6666';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 28, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Messages
  ctx.fillStyle = '#ffffcc';
  ctx.font = '12px monospace';
  messages.forEach((m, i) => ctx.fillText(m, 10, H - 10 - i * 16));
}

function updateUI() {
  document.getElementById('hp').textContent = `HP: ${player.hp}/${player.maxHp}`;
  document.getElementById('ink').textContent = `Ink: ${player.ink}/${player.maxInk}`;
  document.getElementById('obj').textContent = `Artwork: ${artworks.length}/${objective.needed}`;
}

// Game loop
function loop() {
  frame++;
  movePlayer();
  updateEnemies();
  updateDuel();
  draw();
  requestAnimationFrame(loop);
}
loop();
updateUI();
</script>
</body>
</html>
