<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>松 &#x2014; Pine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#d9cfc0}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ================================================================
// 2646 -- A lone pine on a sea cliff in fog
// Edo Woodblock studio -- single-file interactive woodblock print
//
// The first screen is already the piece. No intro, no instructions.
// Move your pointer (or finger) to gently part the fog and reveal
// the scene. The sea breathes. The fog shifts. The pine stands.
// ================================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, dpr;
let mouseX = -9999, mouseY = -9999;
let smoothX = -9999, smoothY = -9999;
let pointerActive = false;
let time = 0;
let paperTex, paperTexLarge;
let fogCanvas, fogCtx;

// ================================================================
// INIT
// ================================================================
function init() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  makePaper();
  makeFogBuffer();
}

function makeFogBuffer() {
  fogCanvas = document.createElement('canvas');
  fogCanvas.width = W;
  fogCanvas.height = H;
  fogCtx = fogCanvas.getContext('2d');
}

// ================================================================
// PAPER TEXTURE -- layered, organic grain
// ================================================================
function makePaper() {
  const sz = 256;
  paperTex = document.createElement('canvas');
  paperTex.width = sz;
  paperTex.height = sz;
  const c = paperTex.getContext('2d');
  bakePaper(c, sz);

  const sz2 = 512;
  paperTexLarge = document.createElement('canvas');
  paperTexLarge.width = sz2;
  paperTexLarge.height = sz2;
  const c2 = paperTexLarge.getContext('2d');
  bakePaper(c2, sz2);
}

function bakePaper(c, sz) {
  c.fillStyle = '#d9cfc0';
  c.fillRect(0, 0, sz, sz);

  const id = c.getImageData(0, 0, sz, sz);
  const d = id.data;

  for (let i = 0; i < d.length; i += 4) {
    const px = (i / 4) % sz;
    const py = Math.floor(i / 4 / sz);
    let n = 0;
    n += (Math.random() - 0.5) * 8;
    n += Math.sin(px * 0.025 + py * 0.012) * 3;
    n += Math.sin(px * 0.06 - py * 0.04 + 1.7) * 1.8;
    n += Math.cos(px * 0.12 + py * 0.09 + 3.2) * 0.9;
    const fiberBias = Math.sin(py * 0.15 + px * 0.003) * 2;
    n += fiberBias;
    const w = (Math.random() - 0.5) * 3;
    d[i]      = clamp(d[i] + n + w * 0.5, 0, 255);
    d[i + 1] = clamp(d[i + 1] + n - w * 0.3, 0, 255);
    d[i + 2] = clamp(d[i + 2] + n - w * 1.2, 0, 255);
  }
  c.putImageData(id, 0, 0);

  c.strokeStyle = 'rgba(155,145,125,0.06)';
  c.lineWidth = 0.4;
  for (let i = 0; i < 120; i++) {
    const y = Math.random() * sz;
    const x1 = Math.random() * sz;
    const l = 10 + Math.random() * 60;
    c.beginPath();
    c.moveTo(x1, y);
    c.lineTo(x1 + l, y + (Math.random() - 0.5) * 3);
    c.stroke();
  }

  c.fillStyle = 'rgba(140,130,110,0.05)';
  for (let i = 0; i < 40; i++) {
    c.beginPath();
    c.ellipse(Math.random() * sz, Math.random() * sz,
       1 + Math.random() * 8, 0.5 + Math.random() * 2.5,
      Math.random() * Math.PI, 0, Math.PI * 2);
    c.fill();
  }

  c.fillStyle = 'rgba(200,190,170,0.04)';
  for (let i = 0; i < 6; i++) {
    c.beginPath();
    c.ellipse(Math.random() * sz, Math.random() * sz,
       20 + Math.random() * 40, 15 + Math.random() * 30,
      Math.random() * Math.PI, 0, Math.PI * 2);
    c.fill();
  }
}

// ================================================================
// COMPOSITION CONSTANTS
// ================================================================
const COMP = {
  horizon: 0.52,
  cliffLeft: 0.02,
  cliffRight: 0.42,
  pineBaseX: 0.30,
  pineBaseY: 0.38,
  sunX: 0.65,
  sunY: 0.38,
  sunR: 180,
};

// ================================================================
// SKY -- muted, atmospheric
// ================================================================
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H * COMP.horizon + 20);
  g.addColorStop(0, '#9a9188');
  g.addColorStop(0.25, '#a89e92');
  g.addColorStop(0.5, '#b8ae9e');
  g.addColorStop(0.75, '#c5baa8');
  g.addColorStop(1, '#cfc5b3');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * COMP.horizon + 20);

  // Subtle sun glow behind fog
  const sunGlow = ctx.createRadialGradient(
    W * COMP.sunX, H * COMP.sunY, 0,
    W * COMP.sunX, H * COMP.sunY, H * COMP.sunR
  );
  sunGlow.addColorStop(0, 'rgba(240,230,210,0.12)');
  sunGlow.addColorStop(0.3, 'rgba(235,225,205,0.06)');
  sunGlow.addColorStop(0.7, 'rgba(225,215,195,0.02)');
  sunGlow.addColorStop(1, 'rgba(220,210,190,0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, W, H * COMP.horizon);

  // Light rays -- very subtle, through fog
  ctx.save();
  ctx.globalAlpha = 0.015;
  const rayAngle = -0.4 + Math.sin(time * 0.02) * 0.05;
  const rayX = W * COMP.sunX;
  const rayY = H * COMP.sunY;
  for (let i = 0; i < 5; i++) {
    const a = rayAngle + (i - 2) * 0.08 + Math.sin(time * 0.015 + i * 1.3) * 0.02;
    const len = H * 1.2;
    ctx.strokeStyle = 'rgba(230,220,200,0.3)';
    ctx.lineWidth = 8 + i * 4;
    ctx.beginPath();
    ctx.moveTo(rayX, rayY);
    ctx.lineTo(rayX + Math.cos(a) * len, rayY + Math.sin(a) * len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ================================================================
// DISTANT MOUNTAINS -- fading into fog
// ================================================================
function drawDistantMountains() {
  const baseY = H * COMP.horizon;
  const breathe = 0.9 + Math.sin(time * 0.06) * 0.1;

  ctx.save();
  // Farthest range -- barely visible
  ctx.globalAlpha = 0.05 * breathe;
  ctx.fillStyle = '#8a8478';
  ctx.beginPath();
  ctx.moveTo(W * 0.45, baseY + 10);
  ctx.bezierCurveTo(W * 0.52, baseY - 70, W * 0.60, baseY - 35, W * 0.68, baseY + 5);
  ctx.bezierCurveTo(W * 0.74, baseY - 5, W * 0.80, baseY - 20, W * 0.88, baseY + 10);
  ctx.bezierCurveTo(W * 0.94, baseY + 15, W, baseY + 5, W, baseY + 20);
  ctx.lineTo(W, baseY + 30);
  ctx.lineTo(W * 0.45, baseY + 30);
  ctx.closePath();
  ctx.fill();

  // Mid range -- slightly more defined
  ctx.globalAlpha = 0.07 * breathe;
  ctx.fillStyle = '#7a7468';
  ctx.beginPath();
  ctx.moveTo(W * 0.40, baseY + 8);
  ctx.bezierCurveTo(W * 0.48, baseY - 50, W * 0.55, baseY - 20, W * 0.63, baseY + 3);
  ctx.bezierCurveTo(W * 0.70, baseY - 8, W * 0.78, baseY + 8, W * 0.85, baseY + 12);
  ctx.bezierCurveTo(W * 0.90, baseY + 18, W, baseY + 8, W, baseY + 22);
  ctx.lineTo(W, baseY + 30);
  ctx.lineTo(W * 0.40, baseY + 30);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// ================================================================
// BIRDS -- slow, meditative flight
// ================================================================
function drawBirds() {
  ctx.save();
  ctx.strokeStyle = '#4a4640';
  ctx.lineWidth = 1.0;
  ctx.lineCap = 'round';

  const birds = [
    { ox: 0.55, oy: 0.15, sz: 2.5, phase: 0, speed: 0.03 },
    { ox: 0.58, oy: 0.12, sz: 2.0, phase: 2.5, speed: 0.035 },
    { ox: 0.62, oy: 0.18, sz: 1.8, phase: 1.2, speed: 0.028 },
    { ox: 0.53, oy: 0.19, sz: 2.2, phase: 3.8, speed: 0.032 },
  ];

  for (const b of birds) {
    const bx = W * (b.ox + Math.sin(time * b.speed + b.phase) * 0.04);
    const by = H * (b.oy + Math.sin(time * b.speed * 0.4 + b.phase) * 0.008);
    const wing = Math.sin(time * 1.8 + b.phase) * b.sz * 0.5;
    const alpha = 0.25 + Math.sin(time * 0.3 + b.phase) * 0.08;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(bx - b.sz * 1.2, by + wing);
    ctx.quadraticCurveTo(bx - b.sz * 0.3, by - Math.abs(wing) * 0.3, bx, by);
    ctx.quadraticCurveTo(bx + b.sz * 0.3, by - Math.abs(wing) * 0.3, bx + b.sz * 1.2, by + wing);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ================================================================
// SEA -- deep indigo with subtle wave motion
// ================================================================
function drawSea() {
  const top = H * COMP.horizon;

  const sg = ctx.createLinearGradient(0, top, 0, H);
  sg.addColorStop(0, '#5a6a74');
  sg.addColorStop(0.2, '#4a5a64');
  sg.addColorStop(0.5, '#3e4e58');
  sg.addColorStop(0.8, '#354550');
  sg.addColorStop(1, '#2e3a45');
  ctx.fillStyle = sg;
  ctx.fillRect(0, top, W, H - top);

  // Reflection shimmer
  const reflG = ctx.createLinearGradient(0, top, 0, top + H * 0.15);
  reflG.addColorStop(0, 'rgba(190,185,175,0.08)');
  reflG.addColorStop(1, 'rgba(180,175,165,0)');
  ctx.fillStyle = reflG;
  ctx.fillRect(W * 0.4, top, W * 0.5, H * 0.15);

  // Wave layers
  const waves = [
    { y: 0.55, amp: 1.2, freq: 0.0025, speed: 0.10, phase: 0, color: 'rgba(140,150,158,0.12)' },
    { y: 0.58, amp: 1.8, freq: 0.003, speed: 0.14, phase: 1.5, color: 'rgba(130,140,148,0.15)' },
    { y: 0.62, amp: 2.4, freq: 0.0028, speed: 0.12, phase: 3.0, color: 'rgba(120,130,138,0.17)' },
    { y: 0.67, amp: 3.2, freq: 0.0035, speed: 0.18, phase: 0.8, color: 'rgba(110,120,128,0.19)' },
    { y: 0.73, amp: 4.0, freq: 0.003, speed: 0.20, phase: 2.2, color: 'rgba(100,110,118,0.16)' },
    { y: 0.80, amp: 5.0, freq: 0.0032, speed: 0.22, phase: 4.5, color: 'rgba(90,100,108,0.14)' },
    { y: 0.87, amp: 6.0, freq: 0.0038, speed: 0.25, phase: 1.0, color: 'rgba(80,90,98,0.12)' },
  ];

  for (const w of waves) {
    const wy = H * w.y;
    ctx.beginPath();
    ctx.moveTo(0, wy);
    for (let x = 0; x <= W; x += 2) {
      const p1 = Math.sin(x * w.freq + time * w.speed + w.phase) * w.amp;
      const p2 = Math.sin(x * w.freq * 2.1 + time * w.speed * 0.6 + w.phase * 1.5) * w.amp * 0.25;
      const p3 = Math.sin(x * w.freq * 0.5 + time * w.speed * 1.2 + w.phase * 0.7) * w.amp * 0.15;
      ctx.lineTo(x, wy + p1 + p2 + p3);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = w.color;
    ctx.fill();
  }

  // Foam near cliff
  ctx.save();
  const cliffRim = H * COMP.horizon;
  const cliffRimRight = W * COMP.cliffRight;
  ctx.strokeStyle = 'rgba(200,195,185,0.08)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 5; i++) {
    const fy = cliffRim + 5 + i * 12;
    ctx.beginPath();
    for (let x = cliffRimRight; x <= cliffRimRight + W * 0.3; x += 2) {
      const wave = Math.sin(x * 0.004 + time * (0.15 + i * 0.03)) * (3 + i * 1.5)
        + Math.sin(x * 0.009 + time * (0.25 + i * 0.05)) * 1.5;
      x === cliffRimRight ? ctx.moveTo(x, fy + wave) : ctx.lineTo(x, fy + wave);
    }
    ctx.stroke();
  }
  ctx.restore();

  // Foam near right edge
  ctx.save();
  ctx.strokeStyle = 'rgba(195,190,180,0.05)';
  ctx.lineWidth = 0.4;
  for (let i = 0; i < 3; i++) {
    const fy = H * (0.68 + i * 0.05);
    ctx.beginPath();
    for (let x = W * 0.85; x <= W; x += 2) {
      const wave = Math.sin(x * 0.005 + time * (0.12 + i * 0.02)) * 2.5;
      x === W * 0.85 ? ctx.moveTo(x, fy + wave) : ctx.lineTo(x, fy + wave);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ================================================================
// CLIFF -- dark, weathered stone
// ================================================================
function drawCliff() {
  ctx.save();
  const left = W * COMP.cliffLeft;
  const right = W * COMP.cliffRight;
  const topY = H * COMP.horizon - 2;

  ctx.beginPath();
  ctx.moveTo(left, H);
  ctx.lineTo(left, topY + 20);

  const segs = 40;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const x = left + t * (right - left);
    const r = Math.sin(t * 13) * 6 + Math.sin(t * 28) * 3
      + Math.sin(t * 7 + 2) * 5 + Math.sin(t * 45) * 1.5;
    const dip = Math.sin(t * Math.PI) * 12;
    ctx.lineTo(x, topY + r + dip);
  }

  ctx.lineTo(right + 6, topY + 35);
  const fs = 12;
  for (let i = 0; i <= fs; i++) {
    const t = i / fs;
    const x = right + 6 + t * 22 + Math.sin(t * 9) * 8;
    const y = topY + 35 + t * (H - topY - 35);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(right + 28, H);
  ctx.closePath();

  const cg = ctx.createLinearGradient(left, topY - 10, left, H);
  cg.addColorStop(0, '#2a251e');
  cg.addColorStop(0.1, '#241f16');
  cg.addColorStop(0.35, '#1e1a12');
  cg.addColorStop(0.65, '#16130e');
  cg.addColorStop(1, '#0e0b08');
  ctx.fillStyle = cg;
  ctx.fill();

  // Striations
  ctx.globalAlpha = 0.07;
  ctx.strokeStyle = '#3a352d';
  ctx.lineWidth = 0.6;
  for (let i = 0; i < 40; i++) {
    const y = topY + 20 + Math.random() * (H - topY - 30);
    const x = left + 5 + Math.random() * (right - left) * 0.7;
    const l = 15 + Math.random() * 55;
    const tilt = (Math.random() - 0.5) * 0.05;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + l, y + l * tilt);
    ctx.stroke();
  }

  // Fissures
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = '#0a0806';
  ctx.lineWidth = 0.8;
  for (let i = 0; i < 8; i++) {
    const y = topY + 35 + Math.random() * (H - topY - 55);
    const x = left + 10 + Math.random() * (right - left) * 0.5;
    const d = 20 + Math.random() * 40;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.random() * 3 - 1.5, y + d);
    ctx.stroke();
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// ================================================================
// PINE TREE -- windswept, characterful
// ================================================================
function drawPine() {
  ctx.save();
  const bx = W * COMP.pineBaseX;
  const by = H * COMP.pineBaseY;

  // ---- TRUNK ----
  ctx.strokeStyle = '#1a1814';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Main trunk -- leaning into the wind
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(bx - 4, by + 8);
  ctx.bezierCurveTo(bx + 2, by - 10, bx + 5, by - 25, bx + 8, by - 38);
  ctx.stroke();

  // Thicker lower trunk
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(bx - 6, by + 10);
  ctx.bezierCurveTo(bx - 1, by - 5, bx + 3, by - 18, bx + 5, by - 30);
  ctx.stroke();

  // Upper trunk taper
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(bx + 6, by - 58);
  ctx.bezierCurveTo(bx + 9, by - 72, bx + 11, by - 85, bx + 14, by - 95);
  ctx.stroke();

  // Bark texture
  ctx.lineWidth = 0.5;
  ctx.globalAlpha = 0.25;
  ctx.strokeStyle = '#2a2824';
  for (let i = 0; i < 18; i++) {
    const t = 0.05 + (i / 18) * 0.92;
    const tx = bx - 4 + t * 18;
    const ty = by + 8 - t * 95;
    const l = 4 + Math.random() * 8;
    ctx.beginPath();
    ctx.moveTo(tx - 1, ty);
    ctx.quadraticCurveTo(tx + Math.random() * 2 - 1, ty - l * 0.5,
      tx + (Math.random() - 0.5) * 2, ty - l);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // ---- NEEDLE CLUSTER ----
  function needles(cx, cy, sz, spr, al) {
    const cnt = 3 + Math.floor(spr * 5);
    for (let i = 0; i < cnt; i++) {
      const ox = Math.sin(i * 2.7 + cx * 0.004) * spr * sz * 0.45;
      const oy = Math.cos(i * 3.1 + cy * 0.004) * spr * sz * 0.18;
      const rx = sz * (0.3 + Math.random() * 0.7);
      const ry = sz * (0.08 + Math.random() * 0.22);
      ctx.globalAlpha = al * (0.4 + Math.random() * 0.6);
      ctx.fillStyle = '#181612';
      ctx.beginPath();
      ctx.ellipse(cx + ox, cy + oy, rx, ry,
        -0.12 + Math.random() * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- BRANCHES -- wind-swept to the right ----
  const branches = [
    [-8,   22, 36, 16, 0.36],
    [-20, 28, 44, 22, 0.48],
    [-33, 33, 52, 25, 0.54],
    [-46, 36, 58, 28, 0.60],
    [-58, 39, 56, 26, 0.56],
    [-70, 37, 50, 22, 0.50],
    [-80, 35, 44, 20, 0.44],
    [-90, 32, 38, 16, 0.40],
    [-100, 27, 32, 13, 0.34],
    [-110, 22, 24, 9,  0.28],
    [-118, 16, 16, 6,  0.22],
  ];

  ctx.strokeStyle = '#1a1814';
  for (const [yo, lx, len, nsz, spr] of branches) {
    const sx = bx + 1 + Math.abs(yo) * 0.12;
    const sy = by + yo;
    ctx.lineWidth = 2.0 - Math.abs(yo) / 200;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    const ex = sx + lx + Math.sin(yo * 0.06) * 6;
    const ey = sy - 3 + Math.sin(yo * 0.04) * 3;
    ctx.quadraticCurveTo(sx + lx * 0.5, sy + 1, ex, ey);
    ctx.stroke();

    needles(ex, ey, nsz, spr, 0.72);
    needles(sx + lx * 0.5, sy, nsz * 0.55, spr * 0.7, 0.55);
    needles(sx + lx * 0.25, sy + 2, nsz * 0.3, spr * 0.5, 0.45);
  }

  // Crown
  needles(bx + 14, by - 128, 10, 0.28, 0.60);
  needles(bx + 18, by - 120, 7, 0.20, 0.45);

  // Small secondary left branch
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = '#1a1814';
  ctx.beginPath();
  ctx.moveTo(bx + 6, by - 45);
  ctx.quadraticCurveTo(bx - 10, by - 40, bx - 28, by - 42);
  ctx.stroke();
  needles(bx - 30, by - 43, 9, 0.24, 0.50);

  // Ink splatter
  ctx.fillStyle = '#1a1814';
  for (let i = 0; i < 10; i++) {
    const sx = bx + Math.sin(i * 5.3) * 55;
    const sy = by - 15 + Math.cos(i * 3.7) * 70;
    const sr = 0.3 + Math.random() * 1.2;
    ctx.globalAlpha = 0.04 + Math.random() * 0.08;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ================================================================
// SEAWEED / GRASS at cliff base
// ================================================================
function drawSeaweed() {
  ctx.save();
  const bx = W * COMP.pineBaseX;
  const by = H * COMP.pineBaseY;

  ctx.strokeStyle = '#1a1814';
  ctx.lineWidth = 0.7;
  ctx.lineCap = 'round';

  const tufts = [
    [bx - 35, by + 8, 3],
    [bx - 10, by + 6, 2],
    [bx + 40, by + 8, 3],
    [bx + 58, by + 10, 2],
    [bx + 75, by + 7, 2],
  ];

  for (const [tx, ty, cnt] of tufts) {
    const sw = Math.sin(time * 1.0 + tx * 0.03) * 4;
    for (let s = 0; s < cnt; s++) {
      ctx.beginPath();
      ctx.moveTo(tx + s * 3, ty);
      const ex = tx + s * 3 + 12 + sw + Math.sin(s * 1.7) * 3;
      const ey = ty + 7 + s * 2;
      ctx.quadraticCurveTo(tx + s * 3 + 5 + sw * 0.5, ty + 3, ex, ey);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// ================================================================
// FOG -- multiple layers, slow breathing movement
// ================================================================
function drawFog() {
  fogCtx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);

  const blobs = [
    { cx: 0.15, cy: 0.22, rx: 0.28, ry: 0.05, sp: 0.06, op: 0.08, ph: 0 },
    { cx: 0.48, cy: 0.19, rx: 0.22, ry: 0.04, sp: 0.07, op: 0.06, ph: 1.8 },
    { cx: 0.75, cy: 0.26, rx: 0.26, ry: 0.06, sp: 0.08, op: 0.09, ph: 3.6 },
    { cx: 0.92, cy: 0.20, rx: 0.20, ry: 0.04, sp: 0.05, op: 0.07, ph: 5.4 },
    { cx: 0.30, cy: 0.38, rx: 0.20, ry: 0.05, sp: 0.09, op: 0.14, ph: 7.2 },
    { cx: 0.55, cy: 0.35, rx: 0.24, ry: 0.04, sp: 0.10, op: 0.12, ph: 9.0 },
    { cx: 0.80, cy: 0.40, rx: 0.22, ry: 0.05, sp: 0.11, op: 0.13, ph: 10.8 },
    { cx: 0.12, cy: 0.50, rx: 0.35, ry: 0.06, sp: 0.12, op: 0.20, ph: 12.6 },
    { cx: 0.44, cy: 0.48, rx: 0.30, ry: 0.05, sp: 0.13, op: 0.18, ph: 14.4 },
    { cx: 0.70, cy: 0.52, rx: 0.26, ry: 0.06, sp: 0.14, op: 0.22, ph: 16.2 },
    { cx: 0.96, cy: 0.49, rx: 0.22, ry: 0.05, sp: 0.10, op: 0.16, ph: 18.0 },
    { cx: 0.58, cy: 0.54, rx: 0.32, ry: 0.04, sp: 0.15, op: 0.19, ph: 19.8 },
    { cx: 0.48, cy: 0.58, rx: 0.30, ry: 0.03, sp: 0.16, op: 0.11, ph: 21.6 },
    { cx: 0.22, cy: 0.56, rx: 0.24, ry: 0.03, sp: 0.18, op: 0.09, ph: 23.4 },
    { cx: 0.78, cy: 0.60, rx: 0.28, ry: 0.04, sp: 0.17, op: 0.10, ph: 25.2 },
  ];

  for (const b of blobs) {
    const bx = W * (b.cx + Math.sin(time * b.sp + b.ph) * 0.06);
    const by = H * (b.cy + Math.sin(time * b.sp * 0.4 + b.ph + 2) * 0.02);
    const brx = W * b.rx;
    const bry = H * b.ry;

    let opMod = 1;
    if (pointerActive && smoothX > -5000) {
      const dx = bx - smoothX;
      const dy = by - smoothY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 200) {
        opMod = easeOutCubic(clamp(dist / 200, 0, 1)) * 0.08;
      }
    }

    const g = fogCtx.createRadialGradient(bx, by, 0, bx, by, brx);
    const baseOp = b.op * opMod * (0.82 + Math.sin(time * 0.12 + b.ph) * 0.18);
    g.addColorStop(0,       'rgba(235,229,218,' + baseOp + ')');
    g.addColorStop(0.4,     'rgba(232,226,215,' + (baseOp * 0.55) + ')');
    g.addColorStop(0.75,    'rgba(228,222,210,' + (baseOp * 0.2) + ')');
    g.addColorStop(1,       'rgba(228,222,210,0)');
    fogCtx.fillStyle = g;
    fogCtx.beginPath();
    fogCtx.ellipse(bx, by, brx, bry, 0, 0, Math.PI * 2);
    fogCtx.fill();
  }

  // Horizon band
  const hy = H * 0.49;
  const hh = H * 0.20;
  const hg = fogCtx.createLinearGradient(0, hy - hh / 2, 0, hy + hh / 2);
  let ho = 0.32;
  if (pointerActive && smoothX > -5000) {
    const hd = Math.abs(hy - smoothY);
    if (hd < 200) {
      ho *= easeOutCubic(clamp(hd / 200, 0, 1)) * 0.14;
    }
  }
  ho *= (0.84 + Math.sin(time * 0.09) * 0.16);
  hg.addColorStop(0,     'rgba(232,226,214,0)');
  hg.addColorStop(0.25, 'rgba(232,226,214,' + ho + ')');
  hg.addColorStop(0.75, 'rgba(232,226,214,' + ho + ')');
  hg.addColorStop(1,     'rgba(232,226,214,0)');
  fogCtx.fillStyle = hg;
  fogCtx.fillRect(0, hy - hh / 2, W, hh);

  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.drawImage(fogCanvas, 0, 0);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ================================================================
// POINTER GLOW -- gentle light at cursor
// ================================================================
function drawPointerGlow() {
  if (!pointerActive || smoothX < -5000) return;
  const g = ctx.createRadialGradient(smoothX, smoothY, 0, smoothX, smoothY, 140);
  g.addColorStop(0,     'rgba(245,238,225,0.05)');
  g.addColorStop(0.4,   'rgba(245,238,225,0.015)');
  g.addColorStop(1,     'rgba(245,238,225,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(smoothX, smoothY, 140, 0, Math.PI * 2);
  ctx.fill();
}

// ================================================================
// PAPER OVERLAY -- brings it all together
// ================================================================
function drawPaperOverlay() {
  ctx.save();
  ctx.globalAlpha = 0.35;
  const pat = ctx.createPattern(paperTexLarge, 'repeat');
  ctx.fillStyle = pat;
  ctx.globalCompositeOperation = 'overlay';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#c8bfa8';
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 1;
  const v = ctx.createRadialGradient(W / 2, H / 2, W * 0.12, W / 2, H / 2, W * 0.78);
  v.addColorStop(0,     'rgba(180,170,150,0)');
  v.addColorStop(0.5, 'rgba(160,150,130,0.03)');
  v.addColorStop(0.8, 'rgba(140,130,110,0.08)');
  v.addColorStop(1,     'rgba(120,110,90,0.22)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 0.03;
  ctx.fillStyle = '#1a1814';
  const seed = 42;
  for (let i = 0; i < 8; i++) {
    const sx = ((Math.sin(i * 7.3 + seed) * 0.5 + 0.5) * W + 0.5) | 0;
    const sy = ((Math.cos(i * 5.1 + seed) * 0.5 + 0.5) * H + 0.5) | 0;
    const sr = 0.3 + Math.sin(i * 3.7 + seed) * 0.7;
    if (sr > 0) {
      ctx.beginPath();
      ctx.arc(sx, sy, Math.abs(sr), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Tiny red seal stamp top-right
  ctx.globalAlpha = 0.12;
  const sealX = W - 35;
  const sealY = 35;
  ctx.fillStyle = '#8a3028';
  ctx.fillRect(sealX, sealY, 16, 16);
  ctx.fillStyle = '#d9cfc0';
  ctx.font = '8px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('\u677e', sealX + 8, sealY + 9);

  ctx.globalAlpha = 1;
  ctx.restore();
}

// ================================================================
// RENDER LOOP
// ================================================================
let lastT = 0;
let rafId = null;

function render(ts) {
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;
  time += dt;

  const lerp = 0.05;
  smoothX += (mouseX - smoothX) * lerp;
  smoothY += (mouseY - smoothY) * lerp;

  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawDistantMountains();
  drawBirds();
  drawSea();
  drawCliff();
  drawPine();
  drawSeaweed();
  drawFog();
  drawPointerGlow();
  drawPaperOverlay();

  rafId = requestAnimationFrame(render);
}

// ================================================================
// INPUT
// ================================================================
function pos(e) {
  const t = e.touches ? e.touches[0] : e;
  return [t.clientX, t.clientY];
}

canvas.addEventListener('mousemove', function(e) {
  [mouseX, mouseY] = pos(e);
  pointerActive = true;
});

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  [mouseX, mouseY] = pos(e);
  pointerActive = true;
}, { passive: false });

canvas.addEventListener('mouseleave', function() {
  setTimeout(function() {
    pointerActive = false;
    smoothX = smoothY = -9999;
  }, 1200);
});

canvas.addEventListener('touchend', function() {
  setTimeout(function() {
    pointerActive = false;
    smoothX = smoothY = -9999;
  }, 900);
});

window.addEventListener('resize', function() {
  cancelAnimationFrame(rafId);
  init();
  lastT = 0;
  requestAnimationFrame(render);
});

// ================================================================
// HELPERS
// ================================================================
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// ================================================================
// START
// ================================================================
init();
requestAnimationFrame(render);
</script>
</body>
</html>
