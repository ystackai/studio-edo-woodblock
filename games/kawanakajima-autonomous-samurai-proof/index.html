<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawanakajima — 20 Samurai (autonomous proof)</title>
  <style>
    :root { --ink:#111; --paper:#e8e2d3; }
    html,body { margin:0; height:100%; overflow:hidden; background:#17140f; color:#d8cfbb; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    #c { display:block; width:100vw; height:100vh; }
    .ui { position:absolute; z-index:10; pointer-events:none; }
    .ui.top { top:12px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:flex-start; }
    .ui.bottom { bottom:12px; left:12px; right:12px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .badge, button { pointer-events:auto; font-size:11px; letter-spacing:0.06em; padding:4px 10px; border:1px solid rgba(216,207,187,0.4); background:rgba(15,14,10,0.58); color:#d8cfbb; border-radius:2px; }
    .badge { text-transform:uppercase; }
    button { cursor:pointer; transition: background .1s, color .1s; }
    button:hover { background:#d8cfbb; color:#111; }
    .label { font-size:10px; opacity:0.7; margin:0 4px; }
    .state { min-width:92px; text-align:center; }
    .hint { font-size:10px; opacity:.55; }
    #load { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(15,14,10,0.75); z-index:20; font-size:12px; letter-spacing:0.08em; }
    .hidden { display:none !important; }
    .thin { border-color: rgba(201,194,176,0.2); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="ui top">
    <div>
      <div class="badge">Kawanakajima — 20 Samurai</div>
      <div class="label">10 Takeda (oxblood) · 10 Uesugi (indigo) · autonomous foundry proof</div>
    </div>
    <div class="badge state" id="status">LOADING…</div>
  </div>

  <div class="ui bottom">
    <button id="btn-charge">CHARGE</button>
    <button id="btn-reform">REFORM</button>
    <button id="btn-inspect">INSPECT</button>
    <button id="btn-camera">RESET CAM</button>
    <span class="label hint">drag: orbit · wheel: zoom · click samurai: inspect · C/R/I keys</span>
  </div>

  <div id="load">preparing countryside…</div>

  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <script>
  (function(){
    const canvas = document.getElementById('c');
    const statusEl = document.getElementById('status');
    const loadEl = document.getElementById('load');

    // Renderer / scene
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, preserveDrawingBuffer:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = false;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x17140f, 0.006);

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 400);
    // Initial cinematic low/shoulder framing (rule-of-thirds bias toward left group)
    camera.position.set(-6.5, 3.8, 11.5);
    camera.lookAt(-1.5, 1.6, 0);

    // Lights — cool near-white key + subtle rim (color from materials)
    const key = new THREE.DirectionalLight(0xe2e8ee, 1.35);
    key.position.set(9, 22, -7);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xaec3d8, 0.8);
    rim.position.set(-18, 9, 16);
    scene.add(rim);
    scene.add(new THREE.AmbientLight(0x393225, 0.85));

    // Japanese countryside ground (layered paper/earth)
    const groundGeo = new THREE.PlaneGeometry(92, 72, 1, 1);
    const groundMat = new THREE.MeshLambertMaterial({ color:0x3d382d, flatShading:false });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI * 0.5;
    ground.position.y = -0.02;
    scene.add(ground);

    // Subtle field ridges / distance
    for (let k=0; k<5; k++) {
      const h = new THREE.Mesh(
        new THREE.PlaneGeometry(70 + k*6, 18),
        new THREE.MeshLambertMaterial({ color: 0x343026, transparent:true, opacity:0.5 })
      );
      h.rotation.x = -Math.PI*0.5;
      h.position.set( (k%2?-1:1)* (3+k*1.5), 0.01 + k*0.01, -11 -k*7 );
      scene.add(h);
    }

    // Sparse tree proxies (trunks + foliage) — not dense, readability first
    function addTree(x, z, s=1) {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12*s, 0.16*s, 1.6*s, 5), new THREE.MeshLambertMaterial({color:0x2c241c}));
      trunk.position.set(x, 0.8*s, z);
      scene.add(trunk);
      const foliage = new THREE.Mesh(new THREE.ConeGeometry(1.1*s, 2.6*s, 6), new THREE.MeshLambertMaterial({color:0x1f2a1f}));
      foliage.position.set(x, 2.1*s, z);
      scene.add(foliage);
    }
    addTree(-14, -18, 0.9); addTree(13, -19, 0.85); addTree(-18, 8, 0.7);
    addTree(19, 4, 0.75); addTree(-22, -6, 0.65);

    // Thin reference stones / markers (diegetic, low contrast)
    for (let i=0; i<6; i++) {
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35 + Math.random()*0.2), new THREE.MeshLambertMaterial({color:0x3a362f}));
      rock.position.set(-3 + i*1.6 + (i-2.5)*0.3, 0.18, -2.5 + (i%2)*1.2);
      rock.rotation.y = i;
      scene.add(rock);
    }

    // Groups for teams (for charge/reform)
    const takedaGroup = new THREE.Group();
    const uesugiGroup = new THREE.Group();
    scene.add(takedaGroup);
    scene.add(uesugiGroup);

    const ACTOR_COUNT = 20;
    const actors = []; // {mesh, basePos, team}
    const loader = new THREE.GLTFLoader();

    let loaded = 0;
    let chargePhase = 0; // 0 idle, 1 charging
    let originalPositions = [];

    function frameAll() {
      // Close shoulder framing proves the GLBs read as samurai, not tiny blocks.
      target.set(-4.15, 1.35, -4.75);
      yaw = -1.38;
      pitch = 0.34;
      dist = 8.8;
      updateCameraFromOrbit();
    }

    function placeActors(list) {
      // Two opposing lines, 10 vs 10, facing, readable spacing
      const spacing = 1.18;
      const startZ = -5.5;
      list.forEach((a, i) => {
        const isT = a.team === 'takeda';
        const col = i % 10;
        const row = Math.floor(i / 10);
        const x = (isT ? -5.8 : 5.8) + (col - 4.5) * spacing * 0.82;
        const z = startZ + row * 2.8 + (col % 3 - 1) * 0.2;
        const y = 0;
        a.mesh.position.set(x, y, z);
        a.mesh.rotation.y = isT ? 0.12 : -0.12;
        a.basePos = a.mesh.position.clone();
        a.baseRot = a.mesh.rotation.clone();
        (isT ? takedaGroup : uesugiGroup).add(a.mesh);
      });
      originalPositions = list.map(a => ({ pos: a.mesh.position.clone(), rot: a.mesh.rotation.clone() }));
    }

    function loadAll() {
      const baseList = [];
      // 10 takeda + 10 uesugi, pre-generated
      for (let i=0; i<10; i++) baseList.push({ path: 'assets/actor-takeda-' + String(i).padStart(2,'0') + '.glb', team:'takeda' });
      for (let i=0; i<10; i++) baseList.push({ path: 'assets/actor-uesugi-' + String(i).padStart(2,'0') + '.glb', team:'uesugi' });

      baseList.forEach(entry => {
        loader.load(entry.path, (gltf) => {
          const root = gltf.scene;
          // scale for game readability (model is ~2.4-2.6 units tall)
          root.scale.setScalar(1.08);
          // traverse to ensure shadows off and slight material tweak for contrast
          root.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = false;
              o.receiveShadow = false;
              if (o.material && o.material.color) {
                // keep foundry palette but boost value slightly for distant readability
                const c = o.material.color;
                if (entry.team === 'takeda' && c.r > 0.1 && c.r > c.b) {
                  // already tinted oxblood in asset
                }
              }
            }
          });
          const actor = { mesh: root, team: entry.team };
          actors.push(actor);
          loaded++;
          statusEl.textContent = `LOADING ${loaded}/${ACTOR_COUNT}`;
          if (loaded === ACTOR_COUNT) onAllLoaded();
        }, undefined, (err) => {
          console.error('GLB load failed', entry.path, err);
          // fallback: use baseline duplicate so we still have 20 readable
          loader.load('assets/samurai-baseline.glb', (gltf2) => {
            const root = gltf2.scene; root.scale.setScalar(1.08);
            const actor = { mesh: root, team: entry.team };
            actors.push(actor);
            loaded++;
            if (loaded === ACTOR_COUNT) onAllLoaded();
          });
        });
      });
    }

    function onAllLoaded() {
      placeActors(actors);
      frameAll();
      loadEl.classList.add('hidden');
      statusEl.textContent = 'FORMATION';
      // kick a resize in case
      onResize();
      // subtle idle bob animation setup
      actors.forEach((a, idx) => {
        a.idlePhase = idx * 0.7;
      });
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    // Simple orbit controls (no external dep)
    let isDragging = false;
    let prevX = 0, prevY = 0;
    let yaw = -1.38, pitch = 0.34, dist = 8.8;
    let target = new THREE.Vector3(-4.15, 1.35, -4.75);

    function updateCameraFromOrbit() {
      const x = target.x + dist * Math.cos(pitch) * Math.sin(yaw);
      const y = target.y + dist * Math.sin(pitch);
      const z = target.z + dist * Math.cos(pitch) * Math.cos(yaw);
      camera.position.set(x, y, z);
      camera.lookAt(target);
    }

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      prevX = e.clientX; prevY = e.clientY;
      if (e.button === 2) { /* right for future pan */ }
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = (e.clientX - prevX) * 0.0038;
      const dy = (e.clientY - prevY) * 0.0036;
      yaw -= dx;
      pitch = Math.max(0.05, Math.min(1.35, pitch + dy));
      prevX = e.clientX; prevY = e.clientY;
      updateCameraFromOrbit();
    });
    canvas.addEventListener('wheel', (e) => {
      dist = Math.max(3.5, Math.min(48, dist + e.deltaY * 0.018));
      updateCameraFromOrbit();
      e.preventDefault();
    }, {passive:false});
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // Click to inspect a samurai (raycast)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const meshes = actors.map(a => a.mesh);
      const hits = raycaster.intersectObjects(meshes, true);
      if (hits.length) {
        // find owning actor root
        let obj = hits[0].object;
        while (obj && !actors.find(a => a.mesh === obj)) obj = obj.parent;
        const actor = actors.find(a => a.mesh === obj) || actors[0];
        inspectActor(actor);
      }
    });

    function inspectActor(actor) {
      const p = actor.mesh.getWorldPosition(new THREE.Vector3());
      // three-quarter close framing on this figure
      target.set(p.x - 0.6, p.y + 1.35, p.z + 1.1);
      dist = 3.8;
      yaw = 2.35;
      pitch = 0.42;
      updateCameraFromOrbit();
      statusEl.textContent = 'INSPECT';
      setTimeout(() => { if (statusEl.textContent==='INSPECT') statusEl.textContent = chargePhase ? 'CHARGING' : 'FORMATION'; }, 1400);
    }

    // Interactions: charge / reform
    function charge() {
      chargePhase = 1;
      statusEl.textContent = 'CHARGING';
      // move targets inward
      actors.forEach((a) => {
        const dir = (a.team === 'takeda') ? 1 : -1;
        const dest = a.basePos.clone();
        dest.x += dir * 3.6;
        dest.z += (Math.random()-0.5) * 0.8;
        a.chargeDest = dest;
      });
    }

    function reform() {
      chargePhase = 0;
      statusEl.textContent = 'REFORM';
      actors.forEach((a) => {
        a.chargeDest = null;
        a.mesh.position.copy(a.basePos);
        a.mesh.rotation.copy(a.baseRot || a.mesh.rotation);
      });
      setTimeout(() => { statusEl.textContent = 'FORMATION'; }, 260);
      updateCameraFromOrbit();
    }

    function resetCamera() {
      frameAll();
      statusEl.textContent = chargePhase ? 'CHARGING' : 'FORMATION';
    }

    // Wire UI
    document.getElementById('btn-charge').addEventListener('click', charge);
    document.getElementById('btn-reform').addEventListener('click', reform);
    document.getElementById('btn-inspect').addEventListener('click', () => {
      if (actors.length) inspectActor(actors[Math.floor(Math.random()*actors.length)]);
    });
    document.getElementById('btn-camera').addEventListener('click', resetCamera);

    // Keyboard
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'c') charge();
      if (e.key.toLowerCase() === 'r') reform();
      if (e.key.toLowerCase() === 'i' && actors.length) inspectActor(actors[Math.floor(Math.random()*actors.length)]);
      if (e.key === ' ' || e.key.toLowerCase() === 'f') { e.preventDefault(); resetCamera(); }
    });

    // Main loop
    let t = 0;
    function tick() {
      requestAnimationFrame(tick);
      t += 0.016;

      // idle breathing + charge lerp
      actors.forEach((a, idx) => {
        if (!a.mesh) return;
        const baseY = a.basePos ? a.basePos.y : 0;
        // light idle
        a.mesh.position.y = baseY + Math.sin(t * 1.6 + (a.idlePhase||idx)) * 0.012;

        if (chargePhase && a.chargeDest) {
          const p = a.mesh.position;
          p.x = p.x * 0.92 + a.chargeDest.x * 0.08;
          p.z = p.z * 0.92 + a.chargeDest.z * 0.08;
          // slight lean in charge
          a.mesh.rotation.x = (a.team === 'takeda' ? 0.06 : -0.06) * 0.6;
        } else {
          a.mesh.rotation.x *= 0.9;
        }
      });

      // gentle wind on banners if present (by rotating children named banner-ish)
      scene.traverse((o) => {
        if (o.name && o.name.toLowerCase().includes('banner')) {
          o.rotation.y = Math.sin(t * 1.1) * 0.008;
        }
      });

      renderer.render(scene, camera);
    }

    function start() {
      updateCameraFromOrbit();
      loadAll();
      tick();
      // ensure first frame has content (non-blank) — renderer will draw ground + loading actors
      setTimeout(() => {
        if (loadEl.classList.contains('hidden') === false) {
          // still loading but ground + fog + trees should make non-blank
          statusEl.textContent = 'PREPARING…';
        }
      }, 120);
    }

    // expose a tiny state hook for verification
    window.KAWANAKAJIMA = {
      getActorCount: () => actors.length,
      isCharging: () => chargePhase === 1,
      doCharge: charge,
      doReform: reform,
      getCanvas: () => canvas
    };

    start();
  })();
  </script>
</body>
</html>
