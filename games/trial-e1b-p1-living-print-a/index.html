<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>living print</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #e8e4dc; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;
    buildPaper();
    buildMist();
  }

  // --- Paper grain ---
  let paperCanvas, paperCtx;
  function buildPaper() {
    paperCanvas = document.createElement('canvas');
    paperCanvas.width = W;
    paperCanvas.height = H;
    paperCtx = paperCanvas.getContext('2d');
    const img = paperCtx.createImageData(W, H);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 18;
      d[i]   = Math.min(255, Math.max(0, 232 + n));
      d[i+1] = Math.min(255, Math.max(0, 228 + n));
      d[i+2] = Math.min(255, Math.max(0, 220 + n));
      d[i+3] = 255;
    }
    paperCtx.putImageData(img, 0, 0);
  }

  // --- Mist particles ---
  const MIST_COUNT = 60;
  let mist = [];
  function buildMist() {
    mist = [];
    for (let i = 0; i < MIST_COUNT; i++) {
      mist.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.85 + H * 0.05,
        r: Math.random() * 120 + 40,
        speed: (Math.random() * 0.15 + 0.03) * (Math.random() < 0.5 ? 1 : -1),
        alpha: Math.random() * 0.06 + 0.01,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  // --- Wave horizon ---
  // Multi-octave sine wave forming the horizon line
  const WAVE_OCTAVES = 3;
  const BASE_FREQ = 0.002;
  const BASE_AMP = 22;
  let pressDepth = 0; // 0 = rest, 1 = full press
  let targetDepth = 0;

  function waveY(x, t) {
    let y = 0;
    const baseX = x + t * 0.3;
    y += Math.sin(baseX * BASE_FREQ) * BASE_AMP;
    y += Math.sin(baseX * BASE_FREQ * 2.1 + 1.3) * BASE_AMP * 0.5;
    y += Math.sin(baseX * BASE_FREQ * 4.3 + 0.7) * BASE_AMP * 0.25;
    // Slight vertical drift
    y += Math.sin(t * 0.15) * 3;
    return y;
  }

  // --- Audio (near-silent, user-initiated only) ---
  let audioCtx = null;
  let pressStarted = false;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  // Soft whispered noise burst on press
  function whisperPress() {
    if (!audioCtx || pressStarted) return;
    pressStarted = true;
    const dur = 1.2;
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) {
      const t = i / audioCtx.sampleRate;
      const env = Math.exp(-t * 3) * (1 - Math.exp(-t * 40));
      ch[i] = (Math.random() * 2 - 1) * env * 0.015;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 400;
    filt.Q.value = 2;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.3;
    src.connect(filt);
    filt.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();
  }

  // --- Drawing ---
  function draw(time) {
    const t = time * 0.001;

    // Smooth press depth easing (resistance feel: slower to press, slower to release)
    const pressEaseIn = 0.06;
    const pressEaseOut = 0.04;
    if (targetDepth > pressDepth) {
      pressDepth += (targetDepth - pressDepth) * pressEaseIn;
    } else {
      pressDepth += (targetDepth - pressDepth) * pressEaseOut;
    }

    // Background: paper grain
    ctx.drawImage(paperCanvas, 0, 0);

    const horizonY = H * 0.55;
    const inkAlpha = 0.15 + pressDepth * 0.55; // rest to full dark
    const inkY = horizonY - pressDepth * 15; // waves shift down slightly under pressure

    // Draw mist first (behind the wave)
    for (let i = 0; i < mist.length; i++) {
      const m = mist[i];
      m.x += m.speed;
      m.y += Math.sin(t * 0.2 + m.phase) * 0.15;
      if (m.x > W + m.r) m.x = -m.r;
      if (m.x < -m.r) m.x = W + m.r;
      const a = m.alpha * (0.7 + 0.3 * Math.sin(t * 0.1 + m.phase));
      const grad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
      grad.addColorStop(0, `rgba(220,218,210,${a})`);
      grad.addColorStop(1, 'rgba(220,218,210,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(m.x - m.r, m.y - m.r, m.r * 2, m.r * 2);
    }

    // Draw the wave form horizon — ink stroke with slight blur
    ctx.save();
    ctx.globalAlpha = inkAlpha;

    // Shadow/bleed layer
    ctx.shadowColor = 'rgba(20,18,15,0.3)';
    ctx.shadowBlur = 8 + pressDepth * 12;

    // Wave line — thick ink stroke
    ctx.beginPath();
    const step = 3;
    for (let x = 0; x <= W; x += step) {
      const wy = waveY(x, t) + inkY;
      if (x === 0) ctx.moveTo(x, wy);
      else ctx.lineTo(x, wy);
    }
    ctx.strokeStyle = `rgba(18,16,14,${0.6 + pressDepth * 0.4})`;
    ctx.lineWidth = 2.5 + pressDepth * 3;
    ctx.stroke();

    // Fatter bleed below the line
    ctx.shadowBlur = 0;
    ctx.beginPath();
    for (let x = 0; x <= W; x += step) {
      const wy = waveY(x, t) + inkY + 3;
      if (x === 0) ctx.moveTo(x, wy);
      else ctx.lineTo(x, wy);
    }
    const bleedGrad = ctx.createLinearGradient(0, inkY - 10, 0, inkY + 40);
    bleedGrad.addColorStop(0, `rgba(20,18,15,${0.03 + pressDepth * 0.08})`);
    bleedGrad.addColorStop(1, 'rgba(20,18,15,0)');
    ctx.strokeStyle = bleedGrad;
    ctx.lineWidth = 18 + pressDepth * 25;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    ctx.restore();

    // Subtle deepening of paper under press
    if (pressDepth > 0.01) {
      ctx.save();
      ctx.globalAlpha = pressDepth * 0.04;
      ctx.fillStyle = '#1a1815';
      ctx.fillRect(0, inkY + 5, W, H - inkY - 5);
      ctx.restore();
    }

    // Press indicator — barely perceptible ripple at touch point
    if (targetDepth > 0 && lastPressY > 0) {
      ctx.save();
      const rippleAlpha = targetDepth * 0.08 * Math.sin(time * 0.005);
      if (rippleAlpha > 0) {
        const grad = ctx.createRadialGradient(lastPressX, lastPressY, 0, lastPressX, lastPressY, 100 + targetDepth * 60);
        grad.addColorStop(0, `rgba(25,22,18,${rippleAlpha})`);
        grad.addColorStop(1, 'rgba(25,22,18,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(lastPressX - 200, lastPressY - 200, 400, 400);
      }
      ctx.restore();
    }
  }

  // --- Input ---
  let lastPressX = 0, lastPressY = 0;
  let isPressed = false;

  function onStart(x, y) {
    initAudio();
    whisperPress();
    isPressed = true;
    targetDepth = 1;
    lastPressX = x * devicePixelRatio;
    lastPressY = y * devicePixelRatio;
  }

  function onMove(x, y) {
    if (isPressed) {
      lastPressX = x * devicePixelRatio;
      lastPressY = y * devicePixelRatio;
    }
  }

  function onEnd() {
    isPressed = false;
    targetDepth = 0;
    pressStarted = false;
  }

  canvas.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
  canvas.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  canvas.addEventListener('mouseup', onEnd);
  canvas.addEventListener('mouseleave', onEnd);

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    onStart(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    onMove(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener('touchend', e => { e.preventDefault(); onEnd(); }, { passive: false });
  canvas.addEventListener('touchcancel', onEnd);

  // --- Resize handling ---
  window.addEventListener('resize', resize);

  // --- Main loop ---
  function frame(time) {
    draw(time);
    requestAnimationFrame(frame);
  }

  // --- Init ---
  resize();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
