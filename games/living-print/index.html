<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Living Print</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#ede8df}
  canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ─── Living Print ─────────────────────────────────────────────
// A single wave-form horizon in ink on paper grain.
// Mist drifts as primary expressive material.
// Press and hold: baren press with slight resistance.
// Near-silent by default. Deepened inward, not expanded.
// ────────────────────────────────────────────────────────────────

const cvs = document.getElementById('c');
const c = cvs.getContext('2d');
let W, H, dpr;

// ─── Paper grain (offscreen canvas, generated once) ──────────
let paperCanvas, paperCtx;

function generatePaper() {
  paperCanvas = document.createElement('canvas');
  paperCanvas.width = W;
  paperCanvas.height = H;
  paperCtx = paperCanvas.getContext('2d');
  const img = paperCtx.createImageData(W, H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 12;
    // Warm paper: off-white with slight variation
    d[i]     = 237 + n;
    d[i + 1] = 232 + n * 0.9;
    d[i + 2] = 223 + n * 0.8;
    d[i + 3] = 255;
   }
  paperCtx.putImageData(img, 0, 0);

  // Add subtle fiber streaks — the ghost of woodblock texture
  paperCtx.globalAlpha = 0.03;
  for (let i = 0; i < 60; i++) {
    const y = Math.random() * H;
    const len = 30 + Math.random() * 120;
    const x = Math.random() * W;
    paperCtx.strokeStyle = Math.random() > 0.5 ? '#b0a898' : '#d0c8b8';
    paperCtx.lineWidth = 0.5 + Math.random();
    paperCtx.beginPath();
    paperCtx.moveTo(x, y);
    paperCtx.lineTo(x + len, y + (Math.random() - 0.5) * 2);
    paperCtx.stroke();
   }
  paperCtx.globalAlpha = 1;
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width = W * dpr;
  cvs.height = H * dpr;
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  generatePaper();
}

// ─── Mist ────────────────────────────────────────────────────
// Mist is the primary expressive material.
// It drifts slowly, like breath on the paper.
// Not particle effects — atmosphere.

class Mist {
  constructor(fill) {
    this.reset(fill);
   }
  reset(fill) {
    this.x = fill ? Math.random() * (W + 400) - 200 : -200 - Math.random() * 300;
    this.y = H * 0.12 + Math.random() * H * 0.65;
    this.r = 60 + Math.random() * 200;
    this.vx = 0.12 + Math.random() * 0.3;
    this.vy = (Math.random() - 0.5) * 0.04;
    // Very subtle opacity — mist is not a thing you see, you see through it
    this.o = 0.01 + Math.random() * 0.035;
    this.wobblePhase = Math.random() * Math.PI * 2;
    this.wobbleAmp = 0.05 + Math.random() * 0.1;
    this.wobbleSpeed = 0.0003 + Math.random() * 0.0006;
    // Each mist has a slightly different warmth
    this.warmth = Math.random(); // 0=cold(blue), 1=warm(yellow)
   }
  tick(t) {
    this.x += this.vx;
    this.y += Math.sin(t * this.wobbleSpeed + this.wobblePhase) * this.wobbleAmp;
    if (this.x > W + this.r) this.reset(false);
   }
  draw(ctx, depth) {
    // Mist gets slightly more visible as the print deepens
    // like condensation forming on a cold surface
    const o = this.o * (1 + depth * 0.4);
    // Color shifts between warm and cool based on warmth parameter
    const r = Math.round(210 + this.warmth * 20);
    const g = Math.round(205 + this.warmth * 15);
    const b = Math.round(195 - this.warmth * 5);
    const g2 = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
    g2.addColorStop(0, `rgba(${r},${g},${b},${o})`);
    g2.addColorStop(0.5, `rgba(${r},${g},${b},${o * 0.4})`);
    g2.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
   }
}

const mists = [];
for (let i = 0; i < 32; i++) mists.push(new Mist(true));

// ─── Wave-form horizon ───────────────────────────────────────
// The horizon is not a line. It is a presence.
// The wave is gentle — not ocean, but the memory of water.

function horizonY(x, t, depth) {
  const cx = W * 0.5;
  // Base horizon — slightly below center
  let y = H * 0.52;

  // Primary wave: broad, slow
  y += Math.sin(x * 0.002 + t * 0.00008) * H * 0.04;

  // Secondary ripple: tighter, quieter
  y += Math.sin(x * 0.006 + t * 0.00015) * H * 0.012;

  // Tertiary texture: almost imperceptible
  y += Math.sin(x * 0.015 + t * 0.0003) * H * 0.003;

  // Depth deepens the wave — more presence, not more waves
  // The wave doesn't multiply; it becomes more itself
  y += depth * Math.sin(x * 0.004 + t * 0.0001) * H * 0.015;

  // Gentle bow: the center rises slightly, like a wave gathering
  const dist = Math.abs(x - cx) / cx;
  y -= (1 - dist * dist) * H * 0.018;

  return y;
}

// ─── Ink state (baren press) ─────────────────────────────────
let depth = 0;         // 0 → 1, how deeply pressed
let pressing = false;
let pressStart = 0;
let pressX = W * 0.5;  // where the baren is pressed

// The press feels slow and resistant — like ink meeting fiber
const PRESS_RAMP = 0.004;     // very slow deepening
const RELEASE_RAMP = 0.02;    // faster release
const RESISTANCE_MS = 350;    // delay before ink responds

function updateDepth(dt) {
  if (pressing) {
    const elapsed = performance.now() - pressStart;
    if (elapsed > RESISTANCE_MS) {
      depth = Math.min(1, depth + PRESS_RAMP * dt);
     }
   } else {
    depth = Math.max(0, depth - RELEASE_RAMP * dt);
   }
}

// ─── Audio (near-silent) ─────────────────────────────────────
let actx;

function initAudio() {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}

// A breathy press tone — felt more than heard
function pressTone() {
  if (!actx) return;
  const now = actx.currentTime;
  const osc = actx.createOscillator();
  const g = actx.createGain();
  const f = actx.createBiquadFilter();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(55, now);
  osc.frequency.exponentialRampToValueAtTime(38, now + 3);
  f.type = 'lowpass'; f.frequency.value = 180;
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.04, now + 0.15);
  g.gain.exponentialRampToValueAtTime(0.001, now + 2.5);
  osc.connect(f); f.connect(g); g.connect(actx.destination);
  osc.start(now); osc.stop(now + 3);
}

// Occasional mist breath — only at depth, very rare
let lastBreath = 0;
function mistBreath() {
  if (!actx || depth < 0.4) return;
  const now = actx.currentTime;
  if (now - lastBreath < 12) return;
  lastBreath = now;
  const buf = actx.createBuffer(1, actx.sampleRate * 4, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    d[i] = (Math.random() * 2 - 1) * 0.008 * Math.sin(i / d.length * Math.PI);
   }
  const s = actx.createBufferSource(); s.buffer = buf;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.025, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + 4);
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 120;
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(now);
}

// ─── Input ───────────────────────────────────────────────────
function startPress(x) {
  if (!pressing) {
    pressing = true;
    pressStart = performance.now();
    pressX = x;
    initAudio();
    pressTone();
   }
}
function endPress() { pressing = false; }

cvs.addEventListener('pointerdown', e => { e.preventDefault(); startPress(e.clientX); });
cvs.addEventListener('pointerup',   () => endPress());
cvs.addEventListener('pointerleave', () => endPress());
cvs.addEventListener('pointercancel', () => endPress());
cvs.addEventListener('pointermove', e => { if (pressing) pressX = e.clientX; });

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startPress(W * 0.5); }
});
document.addEventListener('keyup', endPress);

// ─── Draw layers ─────────────────────────────────────────────

function drawInkWash(t) {
  // The ink below the horizon — not flat, but a wash.
  // Depth increases the ink density, not the area.
  const inkR = Math.round(28 - depth * 18);
  const inkG = Math.round(32 - depth * 22);
  const inkB = Math.round(58 - depth * 28);

  // Build the wave path
  c.beginPath();
  c.moveTo(0, H);
  for (let x = 0; x <= W; x += 2) {
    c.lineTo(x, horizonY(x, t, depth));
   }
  c.lineTo(W, H);
  c.closePath();

  // Ink wash: gradient from horizon down
  const topY = H * 0.42;
  const grad = c.createLinearGradient(0, topY, 0, H);
  // The top edge of the wash is very faint (ink bleeding into paper)
  grad.addColorStop(0, `rgba(${inkR},${inkG},${inkB},${0.08 + depth * 0.12})`);
  grad.addColorStop(0.25, `rgba(${inkR},${inkG},${inkB},${0.3 + depth * 0.2})`);
  grad.addColorStop(0.6, `rgba(${inkR},${inkG},${inkB},${0.55 + depth * 0.25})`);
  grad.addColorStop(1, `rgba(${Math.max(0,inkR-8)},${Math.max(0,inkG-10)},${Math.max(0,inkB-15)},${0.7 + depth * 0.15})`);
  c.fillStyle = grad;
  c.fill();

  // Ink edge: visible only at sufficient depth
  // This is the "line" of the wave — the cut in the woodblock
  if (depth > 0.12) {
    const edgeA = Math.min(1, (depth - 0.12) * 1.5);
    c.beginPath();
    for (let x = 0; x <= W; x += 2) {
      const y = horizonY(x, t, depth);
      x === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
     }
    c.strokeStyle = `rgba(${inkR},${inkG},${inkB},${edgeA * 0.7})`;
    c.lineWidth = 1 + depth * 1.2;
    c.stroke();
   }

  // Secondary wash: a ghost echo below, at deeper presses
  if (depth > 0.35) {
    const ghostA = (depth - 0.35) * 0.15;
    c.beginPath();
    c.moveTo(0, H);
    for (let x = 0; x <= W; x += 2) {
      const y = horizonY(x, t + 3000, depth * 0.6) + H * 0.04;
      c.lineTo(x, y);
     }
    c.lineTo(W, H);
    c.closePath();
    c.fillStyle = `rgba(${inkR},${inkG},${inkB},${ghostA})`;
    c.fill();
   }
}

function drawPressPoint() {
  // Where the baren is pressed — a subtle circular presence
  if (depth < 0.03) return;
  const r = depth * Math.min(W, H) * 0.25;
  const g = c.createRadialGradient(pressX, H * 0.55, 0, pressX, H * 0.55, r);
  g.addColorStop(0, `rgba(18,20,40,${depth * 0.05})`);
  g.addColorStop(0.6, `rgba(18,20,40,${depth * 0.015})`);
  g.addColorStop(1, 'rgba(18,20,40,0)');
  c.fillStyle = g;
  c.beginPath();
  c.arc(pressX, H * 0.55, r, 0, Math.PI * 2);
  c.fill();
}

// ─── Render loop ─────────────────────────────────────────────
let lastT = 0;

function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05) * 60;
  lastT = now;

  updateDepth(dt);
  mistBreath();

  // Layer order: paper → ink wash (wave horizon) → press point → mist
  if (paperCanvas) c.drawImage(paperCanvas, 0, 0, W, H);
  drawInkWash(now);
  drawPressPoint();

  for (const m of mists) { m.tick(now); m.draw(c, depth); }

  requestAnimationFrame(frame);
}

// ─── Init ────────────────────────────────────────────────────
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
