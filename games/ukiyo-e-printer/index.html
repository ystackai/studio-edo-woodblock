<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>浮世絵 — Press the Baren · Pictures of the Floating World</title>
<style>
:root {
   --paper: #f8f4eb; --ink: #0f172a; --vermilion: #c2410f;
   --indigo: #2c3a5f; --gold: #b38b3f;
}
html, body { margin:0; padding:0; background:#1a1a18; height:100%; overflow:hidden;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Source Han Serif JP",Georgia,serif; }
#stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
canvas { display:block; cursor:crosshair; touch-action:none;
  image-rendering:auto; box-shadow:0 4px 40px rgba(0,0,0,0.55); }
#overlay { position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; pointer-events:none; z-index:10;
  transition:opacity 1.2s cubic-bezier(.4,0,.2,1); }
#overlay.hidden { opacity:0; pointer-events:none; }
#title {
  color:var(--paper); font-size:clamp(1.2rem,3.2vw,1.9rem); font-weight:300;
  letter-spacing:0.35em; text-align:center;
  text-shadow:0 2px 20px rgba(0,0,0,0.6);
  opacity:0; animation:titleFadeIn 2.5s 0.8s cubic-bezier(.25,0,.1,1) forwards;
}
@keyframes titleFadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:0.88;transform:translateY(0);} }
#title.show { animation:titleFadeIn 2.5s 0.8s cubic-bezier(.25,0,.1,1) forwards, titleBreath 8s 3.3s ease-in-out infinite; }
@keyframes titleBreath { 0%,100%{opacity:0.88;} 50%{opacity:0.75;} }
#subtitle.show { animation:titleFadeIn 2.5s 1.5s cubic-bezier(.25,0,.1,1) forwards, subBreath 10s 4s ease-in-out infinite; }
@keyframes subBreath { 0%,100%{opacity:0.78;} 50%{opacity:0.62;} }
#subtitle {
  color:var(--gold); font-size:clamp(0.6rem,1.3vw,0.8rem);
  font-weight:300; letter-spacing:0.2em; margin-top:16px; opacity:0;
  animation:titleFadeIn 2.5s 1.5s cubic-bezier(.25,0,.1,1) forwards;
}
#hint {
  position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
  color:var(--paper); font-size:clamp(0.6rem,1.1vw,0.75rem);
  letter-spacing:0.12em; opacity:0; text-align:center; z-index:10;
  pointer-events:none; transition:opacity 1.8s ease;
}
#hint.show { opacity:0.4; }
#hint.fade { opacity:0; }
#controls {
  position:absolute; top:14px; right:14px; display:flex; gap:8px; z-index:20;
}
#controls button {
  background:rgba(248,244,235,0.82); color:var(--ink);
  border:1px solid rgba(15,23,42,0.2);
  font-family:inherit; font-size:10px; font-weight:400; letter-spacing:0.15em;
  padding:6px 12px; border-radius:1px; cursor:pointer; user-select:none;
  min-height:40px; transition:all 0.25s ease;
  box-shadow:0 1px 2px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.25);
  outline:none; position:relative;
  text-shadow:0 1px 0 rgba(255,255,255,0.5);
}
#controls button::after {
  content:''; position:absolute; inset:0; border-radius:1px;
  border:1px solid rgba(15,23,42,0.06);
  pointer-events:none;
}
#controls button:focus-visible {
  box-shadow:0 0 0 2px rgba(194,65,15,0.55), 0 1px 2px rgba(0,0,0,0.12);
}
#controls button:hover { background:rgba(255,252,245,0.95); }
#controls button:active {
  transform:translateY(0.5px);
  box-shadow:0 0 1px rgba(0,0,0,0.2), inset 0 1px 2px rgba(0,0,0,0.08);
  background:rgba(240,236,225,0.9);
  transition:all 0.05s ease;
}
#controls button.muted { opacity:0.4; }
#progress {
  position:absolute; bottom:14px; right:14px; color:var(--paper); font-size:10px;
  opacity:0; z-index:20; pointer-events:none; transition:opacity 0.6s;
  letter-spacing:0.08em;
}
#progress.show { opacity:0.3; }
/* Print complete overlay */
#completeOverlay {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:11; opacity:0;
  transition:opacity 2s cubic-bezier(.25,0,.1,1);
}
#completeOverlay.show { opacity:1; }
#completeOverlay .glow {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at 50% 55%, rgba(248,244,235,0.08) 0%, transparent 60%);
}
#completeOverlay .completeText {
  color:var(--paper); font-size:clamp(1rem,2.5vw,1.5rem); font-weight:300;
  letter-spacing:0.5em; text-shadow:0 2px 30px rgba(0,0,0,0.5);
}
#completeOverlay .completeSub {
  color:var(--gold); font-size:clamp(0.55rem,1vw,0.7rem); font-weight:300;
  letter-spacing:0.25em; margin-top:12px; opacity:0.7;
}
/* Density meter */
#densityMeter {
  position:absolute; bottom:14px; left:14px; z-index:20;
  width:120px; height:3px; background:rgba(248,244,235,0.15);
  border-radius:1px; overflow:hidden; opacity:0;
  transition:opacity 1s ease;
}
#densityMeter.show { opacity:0.5; }
#densityFill {
  height:100%; width:0%; border-radius:1px;
  background:linear-gradient(90deg, var(--indigo), var(--vermilion));
  transition:width 0.3s ease;
}
/* Vignette pulse responds to ink density */
#vignette {
  position:absolute; inset:0; pointer-events:none; z-index:4;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(26,26,24,0.4) 100%);
  transition: opacity 2s ease;
}
/* Deckle edge overlay */
#deckle {
  position:absolute; inset:0; pointer-events:none; z-index:5;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(26,26,24,0.35) 100%);
  mix-blend-mode:multiply;
}
/* Hold ring indicator */
#holdRing {
  position:absolute; pointer-events:none; z-index:6;
  border:1.5px solid rgba(194,65,15,0.35);
  border-radius:50%; transform:translate(-50%,-50%);
  opacity:0; transition:opacity 0.15s ease;
}
/* Touch target min 44px */
@media (pointer:coarse) {
   #controls button { min-height:48px; min-width:48px; padding:9px 18px; font-size:12px; }
  canvas { touch-action: none; }
}
@media (max-width:600px) {
   #controls { top:8px; right:8px; gap:5px; }
   #controls button { padding:6px 10px; font-size:10px; letter-spacing:0.08em; }
}
</style>
</head>
<body>
<div id="stage">
   <canvas id="canvas"></canvas>
   <div id="deckle"></div>
   <div id="holdRing"></div>
   <div id="overlay">
     <div id="title">浮世絵 — Press the Baren</div>
     <div id="subtitle">Touch the paper. Breathe upon it. The floating world accumulates.</div>
   </div>
   <div id="completeOverlay">
     <div class="glow"></div>
     <div>
       <div class="completeText">完成</div>
       <div class="completeSub">The floating world is complete — press finish to capture your print</div>
     </div>
   </div>
   <div id="hint" class="show">press gently — the paper remembers</div>
   <div id="controls">
     <button id="soundBtn" title="Toggle sound (J)">♫</button>
     <button id="resetBtn" title="Clear print (R)">RESET</button>
     <button id="finishBtn" title="Finish and download (S)">FINISH</button>
   </div>
   <div id="densityMeter"><div id="densityFill"></div></div>
   <div id="progress"></div>
</div>
<script src="blocks-2d.js"></script>
<script>
(() => {
   /* ── Canvas setup ──────────────────────────────────────── */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const W = 1024, H = 768;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.scale(DPR, DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

  const overlay        = document.getElementById('overlay');
  const hint           = document.getElementById('hint');
  const progress       = document.getElementById('progress');
  const densityMeter   = document.getElementById('densityMeter');
  const densityFill    = document.getElementById('densityFill');
  const completeOverlay = document.getElementById('completeOverlay');
  const holdRing       = document.getElementById('holdRing');
  const soundBtn       = document.getElementById('soundBtn');
  const resetBtn       = document.getElementById('resetBtn');
  const finishBtn      = document.getElementById('finishBtn');

  function fit() {
    const s = Math.min(1, (innerWidth-24)/W, (innerHeight-24)/H);
    canvas.style.width    = (W*s|0)+'px';
    canvas.style.height = (H*s|0)+'px';
   }
  fit(); addEventListener('resize', fit);

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) };
   }

   /* ── Mouse tracking for mist/parallax ──────────────────── */
  let mouseX = W/2, mouseY = H/2;
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouseX = (e.clientX - r.left) * (W / r.width);
    mouseY = (e.clientY - r.top) * (H / r.height);
   }, {passive:true});

   /* ── Palette ─────────────────────────────────────────────── */
  const PAPER = '#f8f4eb', INK = '#0f172a', VERM = '#c2410f', INDIGO = '#2c3a5f', GOLD = '#b38b3f';
  function hexA(a){ return (Math.min(1,Math.max(0,a))*255|0).toString(16).padStart(2,'0'); }
  function cAlpha(c,a){ return c + hexA(a); }

   /* ── Paper texture (procedural washi with deckle edge) ─── */
  const paperC = document.createElement('canvas');
  paperC.width = W; paperC.height = H;
  const pX = paperC.getContext('2d');
  pX.fillStyle = PAPER;
  pX.fillRect(0, 0, W, H);
  const paperImage = pX.getImageData(0, 0, W, H);
  const pd = paperImage.data;
  for (let i = 0; i < pd.length; i += 4) {
    const n = (Math.random() - 0.5) * 8;
    pd[i]     = Math.min(255, Math.max(0, pd[i] + n));
    pd[i+1] = Math.min(255, Math.max(0, pd[i+1] + n));
    pd[i+2] = Math.min(255, Math.max(0, pd[i+2] + n));
   }
  pX.putImageData(paperImage, 0, 0);
  pX.strokeStyle = 'rgba(180,165,140,0.045)';
  pX.lineWidth = 1;
  for (let y = 0; y < H; y += 2 + Math.random() * 5) {
    pX.beginPath();
    pX.moveTo(0, y + Math.random() * 2);
    for (let x = 0; x < W; x += 15) {
      pX.lineTo(x, y + Math.sin(x * 0.015) * 2.5 + Math.random() * 0.8);
     }
    pX.stroke();
   }
  pX.strokeStyle = 'rgba(170,155,135,0.025)';
  for (let x = 0; x < W; x += 8 + Math.random() * 16) {
    pX.beginPath();
    pX.moveTo(x, 0);
    for (let y = 0; y < H; y += 12) {
      pX.lineTo(x + Math.sin(y * 0.02) * 3 + Math.random(), y);
     }
    pX.stroke();
   }

   /* ── Scene composition (Fuji + mountains + lake + foreground) ── */
  const sceneC = document.createElement('canvas');
  sceneC.width = W; sceneC.height = H;
  const sX = sceneC.getContext('2d');

   // Sky gradient
  const skyGrad = sX.createLinearGradient(0, 0, 0, H * 0.65);
  skyGrad.addColorStop(0, '#e8e0d0');
  skyGrad.addColorStop(0.25, '#ddd4c2');
  skyGrad.addColorStop(0.5, '#c5bfb0');
  skyGrad.addColorStop(0.75, '#a8b0c0');
  skyGrad.addColorStop(1, '#8a95a8');
  sX.fillStyle = skyGrad;
  sX.fillRect(0, 0, W, H);

   // Sun behind Fuji peak
  const sunX = W * 0.52, sunY = H * 0.22, sunR = 70;
  const sunGlow = sX.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 3);
  sunGlow.addColorStop(0, 'rgba(245,220,175,0.45)');
  sunGlow.addColorStop(0.4, 'rgba(240,215,165,0.15)');
  sunGlow.addColorStop(1, 'rgba(240,215,165,0)');
  sX.fillStyle = sunGlow;
  sX.fillRect(0, 0, W, H);
  sX.fillStyle = 'rgba(248,235,210,0.55)';
  sX.beginPath(); sX.arc(sunX, sunY, sunR, 0, Math.PI * 2); sX.fill();
  sX.strokeStyle = 'rgba(248,235,210,0.3)';
  sX.lineWidth = 2;
  sX.beginPath(); sX.arc(sunX, sunY, sunR + 12, 0, Math.PI * 2); sX.stroke();

   // Japanese clouds
  sX.save();
  sX.globalAlpha = 0.15;
  for (let i = 0; i < 6; i++) {
    const cx2 = W * (0.15 + Math.random() * 0.7);
    const cy2 = H * (0.12 + Math.random() * 0.28);
    const cw = 120 + Math.random() * 200;
    const ch = 6 + Math.random() * 14;
    sX.fillStyle = 'rgba(255,252,245,0.8)';
    sX.beginPath();
    sX.ellipse(cx2, cy2, cw, ch, 0, 0, Math.PI * 2);
    sX.fill();
   }
  sX.restore();

   // Mountain layers
  // Layer 1: Farthest
  sX.fillStyle = 'rgba(140,150,168,0.18)';
  sX.beginPath();
  sX.moveTo(0, H * 0.62);
  sX.bezierCurveTo(W*0.1, H*0.48, W*0.2, H*0.42, W*0.3, H*0.50);
  sX.bezierCurveTo(W*0.4, H*0.55, W*0.45, H*0.45, W*0.55, H*0.48);
  sX.bezierCurveTo(W*0.65, H*0.52, W*0.75, H*0.43, W*0.85, H*0.48);
  sX.bezierCurveTo(W*0.95, H*0.53, W, H*0.58, W, H*0.62);
  sX.closePath(); sX.fill();

   // Layer 2: Mid mountains
  sX.fillStyle = 'rgba(100,115,140,0.28)';
  sX.beginPath();
  sX.moveTo(0, H * 0.62);
  sX.bezierCurveTo(W*0.05, H*0.50, W*0.15, H*0.44, W*0.22, H*0.52);
  sX.bezierCurveTo(W*0.28, H*0.58, W*0.32, H*0.48, W*0.40, H*0.50);
  sX.bezierCurveTo(W*0.48, H*0.52, W*0.55, H*0.44, W*0.62, H*0.48);
  sX.bezierCurveTo(W*0.7, H*0.52, W*0.8, H*0.46, W*0.9, H*0.52);
  sX.bezierCurveTo(W*0.96, H*0.56, W, H*0.60, W, H*0.62);
  sX.closePath(); sX.fill();

   // Layer 3: Foothills
  sX.fillStyle = 'rgba(70,85,110,0.35)';
  sX.beginPath();
  sX.moveTo(0, H * 0.65);
  sX.bezierCurveTo(W*0.08, H*0.55, W*0.18, H*0.52, W*0.25, H*0.58);
  sX.bezierCurveTo(W*0.35, H*0.62, W*0.45, H*0.54, W*0.55, H*0.56);
  sX.bezierCurveTo(W*0.65, H*0.58, W*0.75, H*0.52, W*0.85, H*0.57);
  sX.bezierCurveTo(W*0.92, H*0.60, W, H*0.62, W, H*0.65);
  sX.closePath(); sX.fill();

   // Mt. Fuji
  sX.fillStyle = 'rgba(44,58,95,0.72)';
  sX.beginPath();
  sX.moveTo(W*0.12, H*0.68);
  sX.bezierCurveTo(W*0.22, H*0.48, W*0.38, H*0.35, W*0.47, H*0.27);
  sX.bezierCurveTo(W*0.50, H*0.24, W*0.52, H*0.23, W*0.54, H*0.24);
  sX.bezierCurveTo(W*0.57, H*0.23, W*0.60, H*0.26, W*0.63, H*0.30);
  sX.bezierCurveTo(W*0.70, H*0.38, W*0.80, H*0.52, W*0.88, H*0.68);
  sX.closePath(); sX.fill();

   // Snowcap
  sX.fillStyle = 'rgba(248,244,235,0.55)';
  sX.beginPath();
  sX.moveTo(W*0.42, H*0.38);
  sX.bezierCurveTo(W*0.46, H*0.27, W*0.50, H*0.21, W*0.54, H*0.25);
  sX.bezierCurveTo(W*0.58, H*0.27, W*0.62, H*0.34, W*0.60, H*0.38);
  sX.bezierCurveTo(W*0.56, H*0.35, W*0.52, H*0.33, W*0.50, H*0.31);
  sX.bezierCurveTo(W*0.48, H*0.33, W*0.44, H*0.35, W*0.42, H*0.38);
  sX.closePath(); sX.fill();

   // Snow tendrils
  sX.fillStyle = 'rgba(248,244,235,0.2)';
  sX.beginPath();
  sX.moveTo(W*0.48, H*0.30);
  sX.bezierCurveTo(W*0.46, H*0.38, W*0.42, H*0.48, W*0.40, H*0.55);
  sX.bezierCurveTo(W*0.41, H*0.50, W*0.44, H*0.42, W*0.46, H*0.35);
  sX.closePath(); sX.fill();
  sX.beginPath();
  sX.moveTo(W*0.55, H*0.28);
  sX.bezierCurveTo(W*0.58, H*0.36, W*0.62, H*0.46, W*0.64, H*0.52);
  sX.bezierCurveTo(W*0.62, H*0.46, W*0.59, H*0.38, W*0.57, H*0.32);
  sX.closePath(); sX.fill();

   // Fuji mist
  sX.save();
  sX.globalAlpha = 0.12;
  for (let i = 0; i < 5; i++) {
    const my = H * (0.38 + i * 0.06);
    const mx = W * (0.25 + Math.random() * 0.5);
    const mw = 80 + Math.random() * 120;
    sX.fillStyle = 'rgba(248,244,235,0.7)';
    sX.beginPath();
    sX.ellipse(mx, my, mw, 8 + Math.random() * 12, 0, 0, Math.PI * 2);
    sX.fill();
   }
  sX.restore();

   // Lake
  const lakeY = H * 0.67;
  const lakeGrad = sX.createLinearGradient(0, lakeY, 0, H);
  lakeGrad.addColorStop(0, 'rgba(120,135,160,0.3)');
  lakeGrad.addColorStop(0.3, 'rgba(100,118,148,0.35)');
  lakeGrad.addColorStop(1, 'rgba(80,95,125,0.4)');
  sX.fillStyle = lakeGrad;
  sX.fillRect(0, lakeY, W, H - lakeY);

   // Water reflections
  sX.save();
  sX.globalAlpha = 0.08;
  sX.strokeStyle = 'rgba(44,58,95,0.5)';
  sX.lineWidth = 1;
  for (let y = lakeY + 8; y < H - 10; y += 3 + Math.random() * 4) {
    const wobble = Math.sin(y * 0.05) * 8;
    sX.beginPath();
    sX.moveTo(W*0.35 + wobble, y);
    sX.bezierCurveTo(W*0.42, y + Math.sin(y*0.1)*3, W*0.48, y - Math.sin(y*0.08)*4, W*0.52 + wobble, y);
    sX.bezierCurveTo(W*0.56, y + Math.sin(y*0.06)*3, W*0.62, y - Math.sin(y*0.05)*4, W*0.68 + wobble, y);
    sX.stroke();
   }
  sX.restore();

   // Foreground pine tree — left side
  const treeX = W * 0.08, treeBaseY = H * 0.72;
  sX.fillStyle = 'rgba(20,28,48,0.85)';
  sX.beginPath();
  sX.moveTo(treeX - 5, treeBaseY);
  sX.quadraticCurveTo(treeX - 3, treeBaseY - H*0.25, treeX + 1, treeBaseY - H*0.42);
  sX.quadraticCurveTo(treeX + 5, treeBaseY - H*0.25, treeX + 7, treeBaseY);
  sX.closePath(); sX.fill();

  function drawPineBranch(bx, by, angle, length, depth) {
    if (depth <= 0 || length < 8) return;
    const ex = bx + Math.cos(angle) * length;
    const ey = by + Math.sin(angle) * length;
    sX.strokeStyle = 'rgba(20,28,48,0.8)';
    sX.lineWidth = Math.max(1, depth * 0.8);
    sX.beginPath();
    sX.moveTo(bx, by);
    sX.quadraticCurveTo((bx+ex)/2 + Math.sin(angle)*5, (by+ey)/2, ex, ey);
    sX.stroke();
    for (let i = 0; i < 3 + depth; i++) {
      const t = 0.3 + (i / (3 + depth)) * 0.7;
      const nx = bx + (ex-bx)*t + (Math.random()-0.5)*6;
      const ny = by + (ey-by)*t + (Math.random()-0.5)*6;
      sX.fillStyle = 'rgba(20,28,48,0.65)';
      sX.beginPath();
      sX.ellipse(nx, ny, 8 + Math.random()*8, 3 + Math.random()*3, angle + (Math.random()-0.5)*0.5, 0, Math.PI*2);
      sX.fill();
     }
    drawPineBranch(ex, ey, angle - 0.4, length * 0.6, depth - 1);
    drawPineBranch(ex, ey, angle + 0.35, length * 0.55, depth - 1);
    drawPineBranch(ex, ey, angle - 0.15, length * 0.7, depth - 1);
   }
  drawPineBranch(treeX, treeBaseY - H*0.42, -0.8, 70, 5);
  drawPineBranch(treeX, treeBaseY - H*0.42, -1.6, 60, 5);
  drawPineBranch(treeX, treeBaseY - H*0.42, -0.2, 55, 4);
  drawPineBranch(treeX, treeBaseY - H*0.32, -1.0, 50, 4);
  drawPineBranch(treeX, treeBaseY - H*0.32, -1.5, 45, 4);

   // Right side — rocks and grasses
  sX.fillStyle = 'rgba(50,60,80,0.55)';
  sX.beginPath();
  sX.moveTo(W*0.88, H*0.70);
  sX.bezierCurveTo(W*0.90, H*0.66, W*0.94, H*0.64, W*0.96, H*0.67);
  sX.bezierCurveTo(W*0.98, H*0.70, W*0.97, H*0.75, W*0.95, H*0.78);

   /* ── Ink bloom helper (kept as inline for density map) ────── */
  function drawBloom(cx, cy, radius, op, color) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    g.addColorStop(0, cAlpha(color, 0.85 * op));
    g.addColorStop(0.35, cAlpha(color, 0.48 * op));
    g.addColorStop(0.65, cAlpha(color, 0.14 * op));
    g.addColorStop(1, cAlpha(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.globalAlpha = 0.2 * op;
    ctx.strokeStyle = cAlpha('#000000', 0.5);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      const r = radius * (0.85 + 0.15 * Math.sin(a * 7 + cx) * Math.cos(a * 5 + cy));
      const x2 = cx + Math.cos(a) * r;
      const y2 = cy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x2, y2) : ctx.lineTo(x2, y2);
     }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
   }

  function drawStroke(pts, radius, op, color, holdDuration) {
    const bo = getOp(op);
    const br = getRad(radius);
    const holdBoost = holdDuration > 0 ? Math.min(0.45, holdDuration / 2000) : 0;
    const finalOp = Math.min(0.95, bo + holdBoost * 0.35);
    ctx.strokeStyle = cAlpha(color, finalOp);
    ctx.lineWidth = br * 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let j = 1; j < pts.length; j++) {
      ctx.lineTo(pts[j].x, pts[j].y);
     }
    ctx.stroke();
    ctx.globalAlpha = finalOp * 0.3;
    ctx.lineWidth = br * 4.5;
    ctx.strokeStyle = cAlpha(color, 0.5);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let j = 1; j < pts.length; j++) {
      ctx.lineTo(pts[j].x, pts[j].y);
     }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.globalAlpha = finalOp * 0.15;
    ctx.lineWidth = br * 1.4;
    ctx.strokeStyle = '#000000';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let j = 1; j < pts.length; j++) {
      ctx.lineTo(pts[j].x, pts[j].y);
     }
    ctx.stroke();
    ctx.globalAlpha = 1;
   }

   function getOp(b) {
    return Math.max(0.06, b * (1 - saturationLevel * 0.65));
   }
  function getRad(b) {
    return b * (1 - saturationLevel * 0.3);
   }

  function accumulateDensity(cx, cy, radius, op) {
    const sr = Math.round(radius);
    const sx = Math.max(0, cx - sr | 0);
    const sy = Math.max(0, cy - sr | 0);
    const ex = Math.min(W - 1, cx + sr | 0);
    const ey = Math.min(H - 1, cy + sr | 0);
    for (let py = sy; py <= ey; py++) {
      for (let px = sx; px <= ex; px++) {
        const dx = px - cx, dy = py - cy;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d <= sr) {
          densityMap[py * W + px] = Math.min(DENSITY_MAX, densityMap[py * W + px] + op * (1 - d / sr));
         }
       }
     }
    let tot = 0, cnt = 0;
    for (let py = sy; py <= ey; py++) {
      for (let px = sx; px <= ex; px++) {
        tot += densityMap[py * W + px];
        cnt++;
       }
     }
    if (cnt > 0) saturationLevel = Math.min(1, saturationLevel + (tot / cnt) * 0.012);
   }

  function registerMark(m) {
    inkMarks.push(m);
    accumulateDensity(m.x, m.y, m.radius, m.opacity);
    if (!printComplete && saturationLevel >= 0.35) {
      printComplete = true;
      completeOverlay.classList.add('show');
      playSealThud();
     }
   }

   /* ── Render loop (uses BlockList) ────────────────────────── */
  let frame = 0, lastInteract = Date.now();
  let lastTime = performance.now();
  let paperMemory = 0;
  let breathMist = 0;
  let fiberLift = 0;

   /* ── Context-independent draw functions for finish canvas ── */
  function drawBloomOn(ctx, cx, cy, radius, op, color) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    g.addColorStop(0, cAlpha(color, 0.85 * op));
    g.addColorStop(0.35, cAlpha(color, 0.48 * op));
    g.addColorStop(0.65, cAlpha(color, 0.14 * op));
    g.addColorStop(1, cAlpha(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.globalAlpha = 0.2 * op;
    ctx.strokeStyle = cAlpha('#000000', 0.5);
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      const r = radius * (0.85 + 0.15 * Math.sin(a * 7 + cx) * Math.cos(a * 5 + cy));
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
       }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
     }

  function drawStrokeOn(ctx, pts, radius, op, color, holdDuration) {
    const bo = getOp(op);
    const br = getRad(radius);
    const holdBoost = holdDuration > 0 ? Math.min(0.45, holdDuration / 2000) : 0;
    const finalOp = Math.min(0.95, bo + holdBoost * 0.35);
    ctx.strokeStyle = cAlpha(color, finalOp);
    ctx.lineWidth = br * 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let j = 1; j < pts.length; j++) {
      ctx.lineTo(pts[j].x, pts[j].y);
       }
    ctx.stroke();
    ctx.globalAlpha = finalOp * 0.3;
    ctx.lineWidth = br * 4.5;
    ctx.strokeStyle = cAlpha(color, 0.5);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let j = 1; j < pts.length; j++) {
      ctx.lineTo(pts[j].x, pts[j].y);
       }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.globalAlpha = finalOp * 0.15;
    ctx.lineWidth = br * 1.4;
    ctx.strokeStyle = '#000000';
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let j = 1; j < pts.length; j++) {
      ctx.lineTo(pts[j].x, pts[j].y);
       }
    ctx.stroke();
    ctx.globalAlpha = 1;
     }

  function drawBreathVapor(cx, cy, amount) {
    if (amount <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = Math.min(0.28, amount * 0.32);
    ctx.strokeStyle = 'rgba(248,244,235,0.86)';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 5; i++) {
      const phase = frame * 0.018 + i * 1.37;
      const lift = 22 + i * 7 + amount * 18;
      const spread = 18 + amount * 34;
      const sx = cx + Math.sin(phase) * spread * 0.35;
      const sy = cy - 8 - i * 3;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.bezierCurveTo(
        sx - spread * 0.35,
        sy - lift * 0.35,
        sx + spread * 0.5,
        sy - lift * 0.72,
        sx + Math.sin(phase + 1.1) * spread,
        sy - lift
      );
      ctx.stroke();
    }
    ctx.restore();
     }

  function drawLiftedFibers(cx, cy, amount) {
    if (amount <= 0.015) return;
    ctx.save();
    ctx.globalAlpha = Math.min(0.2, amount * 0.24);
    ctx.strokeStyle = cAlpha('#5c4a32', 0.75);
    ctx.lineWidth = 0.8;
    for (let i = 0; i < 14; i++) {
      const phase = frame * 0.012 + i * 0.73;
      const base = 12 + i * 3.2 + amount * 18;
      const a = phase + i * 1.91;
      const sx = cx + Math.cos(a) * base;
      const sy = cy + Math.sin(a) * base * 0.48;
      const len = 8 + amount * 18 + (i % 4) * 2;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(
        sx + Math.cos(a + 1.4) * len * 0.45,
        sy + Math.sin(a + 1.4) * len * 0.35 - amount * 5,
        sx + Math.cos(a + 0.35) * len,
        sy + Math.sin(a + 0.35) * len * 0.42
      );
      ctx.stroke();
    }
    ctx.restore();
     }

  function render(now) {
    const dt = now - lastTime;
    lastTime = now;
    frame++;

     // Saturation decay
    const decayRate = saturationLevel > 0 ? 0.00015 : 0;
    saturationLevel = Math.max(0, saturationLevel - decayRate);
    paperMemory = Math.max(0, paperMemory - 0.00008 * dt);
    breathMist = Math.max(0, breathMist - 0.00018 * dt);
    fiberLift = Math.max(0, fiberLift - 0.00022 * dt);
    lastInteract = Math.max(lastInteract, Date.now() - 3000);
     // Sync saturation to scene and lake blocks
    sceneBlock.saturationLevel = saturationLevel;
    lakeBlock.saturationLevel = saturationLevel;

     // Clear canvas
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

     // Update all blocks
    B.update(dt, { mouseX, mouseY, W, H });

     // Render all blocks (sorted by layer via BlockList.sorted)
    B.render(ctx);

     // Animated blooms (ink that fades over time)
    for (let i = blooms.length - 1; i >= 0; i--) {
      const b = blooms[i];
      b.t += dt;
      const t = Math.min(1, b.t / b.dur);
      const e = 1 - Math.pow(1 - t, 3);
      ctx.save();
      drawBloom(b.x, b.y, b.r * (.45 + e * .75), b.op * e, b.c);
      ctx.restore();
      if (t >= 1) blooms.splice(i, 1);
     }

     // Permanent ink marks
    ctx.save();
    for (const mk of inkMarks) {
      if (mk.type === 'bloom') {
        drawBloom(mk.x, mk.y, mk.radius, mk.opacity, mk.color);
       } else if (mk.type === 'stroke') {
        drawStroke(mk.pts, mk.radius, mk.opacity, mk.color, mk.holdDuration || 0);
       }
     }
    ctx.restore();

     // Current stroke preview
    if (isDrawing && strokePts.length > 1) {
      const bo = getOp(.32);
      const br = getRad(12);
      const holdDur = isHolding ? (Date.now() - strokeHoldTime) : 0;
      drawStroke(strokePts, br, .32, INK, holdDur);
     }

     // Baren press visual
    if (isHolding && holdProgress > 0) {
      const br = getRad(holdProgress * 35);
      const bg = ctx.createRadialGradient(holdCX, holdCY, 0, holdCX, holdCY, br);
      bg.addColorStop(0, cAlpha(INK, .55 * holdProgress));
      bg.addColorStop(.5, cAlpha(INK, .2 * holdProgress));
      bg.addColorStop(1, cAlpha(INK, 0));
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(holdCX, holdCY, br, 0, Math.PI * 2);
      ctx.fill();
      if (holdProgress > .6) {
        const ao = (holdProgress - .6) / .4 * .12;
        const ag = ctx.createRadialGradient(holdCX, holdCY, 0, holdCX, holdCY, br * .4);
        ag.addColorStop(0, cAlpha(VERM, ao));
        ag.addColorStop(1, cAlpha(VERM, 0));
        ctx.fillStyle = ag;
        ctx.beginPath();
        ctx.arc(holdCX, holdCY, br * .4, 0, Math.PI * 2);
        ctx.fill();
       }
      if (holdProgress > .25) {
        const ringR = br * (0.3 + holdProgress * 0.8);
        const ringOp = (holdProgress - .25) / .75 * .2;
        ctx.strokeStyle = cAlpha(INK, ringOp);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(holdCX, holdCY, ringR, 0, Math.PI * 2);
        ctx.stroke();
       }
      drawLiftedFibers(holdCX, holdCY, Math.max(fiberLift, holdProgress * 0.45));
      drawBreathVapor(holdCX, holdCY, Math.max(breathMist, holdProgress * 0.55));
     }

     // Density meter
    if (inkMarks.length > 0) {
      const markCount = inkMarks.length;
      const lang = markCount > 1 ? ' strokes' : ' stroke';
      const satText = saturationLevel > .3 ? '紙飽和 — paper saturated' : '紙は白く — paper white';
      const pressureText = paperMemory > .35 ? 'baren memory deepening' : 'press patiently';
      const fiberText = fiberLift > .38 ? 'paper fibers lifting' : pressureText;
      const breathText = breathMist > .35 ? 'wet ink breathing' : fiberText;
      progress.textContent = markCount + lang + ' · ' + satText + ' · ' + breathText;
      progress.classList.add('show');
      const meterPct = Math.min(100, (saturationLevel / 0.35) * 100);
      densityFill.style.width = meterPct + '%';
      densityMeter.classList.add('show');
     }

    requestAnimationFrame(render);
   }
  requestAnimationFrame(render);

   /* ── Interaction ─────────────────────────────────────────── */
  function placeInk(cx, cy, force = holdProgress) {
    let color = INK;
    const h = (cx / W + cy / H) % 3;
    if (h > 1.4 && saturationLevel < .55) color = INDIGO;
    if (h > 2.2 && saturationLevel < .35) color = VERM;
    const pressure = Math.max(0, Math.min(1, force));
    paperMemory = Math.min(1, paperMemory + 0.025 + pressure * 0.08);
    breathMist = Math.min(1, breathMist + pressure * 0.12);
    fiberLift = Math.min(1, fiberLift + 0.018 + pressure * 0.1);
    const br = getRad(14 + Math.random() * 16 + pressure * 20);
    const bo = getOp(.26 + Math.random() * .2 + pressure * .36 + paperMemory * .14);
    blooms.push({ x: cx, y: cy, r: br, op: bo, c: color, t: 0, dur: 350 + Math.random() * 350 });
    registerMark({ type: 'bloom', x: cx, y: cy, radius: br, opacity: bo, color: color });
    lastInteract = Date.now();
    playBrushSound();
   }

  let pointerDownTime = 0;

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    overlay.classList.add('hidden');
    hint.classList.add('fade');
    ctx.save();
    ctx.globalAlpha = 0.02;
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    playBarenFriction(0);
    const p = pos(e);
    const now = Date.now();
    const d = now - lastClickTime;
    if (d < 500) {
      rapidClickCount++;
      if (rapidClickCount > 5) saturationLevel = Math.min(1, saturationLevel + .04 * (rapidClickCount - 5));
     } else {
      rapidClickCount = 0;
     }
    lastClickTime = now;

    isDrawing = true;
    isHolding = true;
    holdT0 = now;
    strokeHoldTime = now;
    holdCX = p.x;
    holdCY = p.y;
    holdProgress = 0;
    strokePts = [{ x: p.x, y: p.y }];
    holdRingX = p.x * (canvas.getBoundingClientRect().width / W);
    holdRingY = p.y * (canvas.getBoundingClientRect().height / H);
    holdRing.style.left = holdRingX + 'px';
    holdRing.style.top = holdRingY + 'px';
    holdRing.style.width = '40px';
    holdRing.style.height = '40px';
    holdRing.style.opacity = '0.5';

    if (holdInterval) clearInterval(holdInterval);
    holdInterval = setInterval(() => {
      if (isHolding) {
        holdProgress = Math.min(1, (Date.now() - holdT0) / 2500);
        const pressSize = 30 + holdProgress * 70 + paperMemory * 18;
        holdRing.style.width = pressSize + 'px';
        holdRing.style.height = pressSize + 'px';
        holdRing.style.opacity = String(0.58 * (1 - holdProgress * 0.42));
        if (holdProgress > .22) fiberLift = Math.min(1, fiberLift + 0.01 + holdProgress * 0.012);
        if (holdProgress > .32) breathMist = Math.min(1, breathMist + 0.012 + holdProgress * 0.018);
        if (holdProgress > .15 && holdProgress < .3) playBarenFriction(holdProgress);
        if (holdProgress > .5 && Math.random() < .25) placeInk(holdCX, holdCY, holdProgress);
       }
     }, 80);
   });

  canvas.addEventListener('pointermove', e => {
    if (!isDrawing) return;
    e.preventDefault();
    const p = pos(e);
    const lag = Math.max(0.16, 0.5 - holdProgress * 0.22);
    const resistedX = holdCX + (p.x - holdCX) * lag;
    const resistedY = holdCY + (p.y - holdCY) * lag;
    const lastPt = strokePts[strokePts.length - 1] || { x: resistedX, y: resistedY };
    const travel = Math.hypot(resistedX - lastPt.x, resistedY - lastPt.y);
    if (travel > 2.5) {
      strokePts.push({ x: resistedX, y: resistedY });
      fiberLift = Math.min(1, fiberLift + 0.006 + holdProgress * 0.014);
    }
    holdCX = resistedX;
    holdCY = resistedY;
    holdRingX = p.x * (canvas.getBoundingClientRect().width / W);
    holdRingY = p.y * (canvas.getBoundingClientRect().height / H);
    holdRing.style.left = holdRingX + 'px';
    holdRing.style.top = holdRingY + 'px';
   });

  canvas.addEventListener('pointerup', e => {
    e.preventDefault();
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
    const holdDur = isHolding ? (Date.now() - strokeHoldTime) : 0;
    holdRing.style.opacity = '0';
    if (isDrawing && strokePts.length > 2) {
      const br = getRad(12);
      const bo = getOp(.3);
      registerMark({
        type: 'stroke',
        x: strokePts[strokePts.length - 1].x,
        y: strokePts[strokePts.length - 1].y,
        radius: br,
        opacity: bo,
        color: INK,
        pts: strokePts,
        holdDuration: holdDur,
       });
     } else if (strokePts.length <= 2 && holdDur > 200) {
      placeInk(holdCX, holdCY, Math.min(1, holdDur / 2500));
     }
    isDrawing = false;
    playInkWetSound();
    isHolding = false;
    strokePts = [];
    holdProgress = 0;
    lastInteract = Date.now();
   });

  canvas.addEventListener('pointerleave', e => {
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
    const holdDur = isHolding ? (Date.now() - strokeHoldTime) : 0;
    holdRing.style.opacity = '0';
    if (isDrawing) {
      if (strokePts.length > 2) {
        const br = getRad(12);
        const bo = getOp(.3);
        registerMark({
          type: 'stroke',
          x: strokePts[strokePts.length - 1].x,
          y: strokePts[strokePts.length - 1].y,
          radius: br,
          opacity: bo,
          color: INK,
          pts: strokePts,
          holdDuration: holdDur,
         });
       } else if (holdDur > 200) {
        placeInk(holdCX, holdCY, Math.min(1, holdDur / 2500));
       }
      isDrawing = false;
      playInkWetSound();
      isHolding = false;
      strokePts = [];
      holdProgress = 0;
     }
    lastInteract = Date.now();
   });

   /* ── Audio ───────────────────────────────────────────────── */
  let audioCtx = null, soundOn = true, ambientGain = null, ambientStarted = false;
  let bellOsc = null, bellGain = null;
  let windLfo = null, windLfoGain = null;
  let paperRustleVol = 0, paperRustleGain = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    ambientGain = audioCtx.createGain();
    ambientGain.gain.value = 0;
    ambientGain.connect(audioCtx.destination);

    const bs = audioCtx.sampleRate * 4;
    const bf = audioCtx.createBuffer(2, bs, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = bf.getChannelData(ch);
      let l = 0;
      for (let i = 0; i < bs; i++) {
        const w = Math.random() * 2 - 1;
        d[i] = (l + .018 * w) / 1.018;
        l = d[i];
        d[i] *= 3.5;
       }
     }
    const ambientNode = audioCtx.createBufferSource();
    ambientNode.buffer = bf;
    ambientNode.loop = true;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 380;
    bp.Q.value = .4;
    ambientNode.connect(bp);
    bp.connect(ambientGain);
    ambientNode.start();

    windLfo = audioCtx.createOscillator();
    windLfo.frequency.value = 0.07;
    windLfoGain = audioCtx.createGain();
    windLfoGain.gain.value = 80;
    windLfo.connect(windLfoGain);
    windLfoGain.connect(bp.frequency);
    windLfo.start();

    const o1 = audioCtx.createOscillator();
    o1.type = 'sine';
    o1.frequency.value = 61.74;
    const og1 = audioCtx.createGain();
    og1.gain.value = 0;
    o1.connect(og1);
    og1.connect(ambientGain);
    o1.start();

    const o2 = audioCtx.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = 92.5;
    const og2 = audioCtx.createGain();
    og2.gain.value = 0;
    o2.connect(og2);
    og2.connect(ambientGain);
    o2.start();

    const o3 = audioCtx.createOscillator();
    o3.type = 'sine';
    o3.frequency.value = 41;
    const og3 = audioCtx.createGain();
    og3.gain.value = 0;
    o3.connect(og3);
    og3.connect(ambientGain);
    o3.start();

    const paperBs = audioCtx.sampleRate * 3;
    const paperBf = audioCtx.createBuffer(2, paperBs, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = paperBf.getChannelData(ch);
      for (let i = 0; i < paperBs; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / paperBs, 1.5) * 0.3;
       }
     }
    const paperNode = audioCtx.createBufferSource();
    paperNode.buffer = paperBf;
    paperNode.loop = true;
    const paperFilt = audioCtx.createBiquadFilter();
    paperFilt.type = 'bandpass';
    paperFilt.frequency.value = 2200;
    paperFilt.Q.value = 0.8;
    paperRustleGain = audioCtx.createGain();
    paperRustleGain.gain.value = 0;
    paperNode.connect(paperFilt);
    paperFilt.connect(paperRustleGain);
    paperRustleGain.connect(ambientGain);
    paperNode.start();
    paperRustleVol = 1;

    const bellBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const bellData = bellBuf.getChannelData(0);
    for (let i = 0; i < bellData.length; i++) {
      const t = i / audioCtx.sampleRate;
      bellData[i] = (Math.sin(2 * Math.PI * 523 * t) * 0.4 +
                      Math.sin(2 * Math.PI * 1046 * t) * 0.2 +
                      Math.sin(2 * Math.PI * 1568 * t) * 0.1) * Math.exp(-t * 1.5);
     }
    bellOsc = audioCtx.createBufferSource();
    bellOsc.buffer = bellBuf;
    bellOsc.loop = true;
    bellGain = audioCtx.createGain();
    bellGain.gain.value = 0;
    bellOsc.connect(bellGain);
    bellGain.connect(ambientGain);
    bellOsc.start();

    ambientStarted = true;
   }

  function playBrushSound() {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const bs = audioCtx.sampleRate * .15;
    const bf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
    const d = bf.getChannelData(0);
    for (let i = 0; i < bs; i++) {
      const envelope = Math.pow(1 - i / bs, 2);
      d[i] = ((Math.random() * 2 - 1) * envelope * 0.7 +
               Math.sin(2 * Math.PI * 800 * i / audioCtx.sampleRate) * Math.exp(-i / (bs * 0.3)) * 0.3) * envelope;
     }
    const s = audioCtx.createBufferSource();
    s.buffer = bf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 800 + Math.random() * 600;
    bp.Q.value = 0.8 + Math.random() * 0.6;
    const g = audioCtx.createGain();
    g.gain.value = .05 + Math.random() * .04;
    s.connect(bp);
    bp.connect(g);
    g.connect(audioCtx.destination);
    s.start(t);

    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = 180 + Math.random() * 120;
    const og = audioCtx.createGain();
    og.gain.setValueAtTime(.015, t);
    og.gain.exponentialRampToValueAtTime(.001, t + .3);
    o.connect(og);
    og.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + .3);
   }

  function playBarenFriction(progress) {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const vol = .012 + .03 * Math.max(0, progress) + .012 * paperMemory;
    const bs = audioCtx.sampleRate * .3;
    const bf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
    const d = bf.getChannelData(0);
    for (let i = 0; i < bs; i++) {
      const envelope = Math.pow(1 - i / bs, 1.5);
      d[i] = (Math.random() * 2 - 1) * envelope * vol * (0.5 + 0.5 * Math.sin(i * 0.01));
     }
    const s = audioCtx.createBufferSource();
    s.buffer = bf;
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 170 + progress * 120;
    bp.Q.value = 2;
    const g = audioCtx.createGain();
    g.gain.value = vol * 2;
    s.connect(bp);
    bp.connect(g);
    g.connect(audioCtx.destination);
    s.start(t);
    s.stop(t + .3);
   }

  function playInkWetSound() {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const bs = audioCtx.sampleRate * .2;
    const bf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
    const d = bf.getChannelData(0);
    for (let i = 0; i < bs; i++) {
      const env = Math.exp(-i / (bs * 0.4));
      d[i] = (Math.random() * 2 - 1) * env * 0.3;
     }
    const s = audioCtx.createBufferSource();
    s.buffer = bf;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 400;
    const g = audioCtx.createGain();
    g.gain.value = .03;
    s.connect(lp);
    lp.connect(g);
    g.connect(audioCtx.destination);
    s.start(t);
    s.stop(t + .2);
   }

  function playSealThud() {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const bs = audioCtx.sampleRate * .4;
    const bf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
    const d = bf.getChannelData(0);
    for (let i = 0; i < bs; i++) {
      const env = Math.pow(1 - i / bs, 2);
      d[i] = Math.sin(2 * Math.PI * (1200 - i / bs * 800) * i / audioCtx.sampleRate) * env * 0.4;
     }
    const s = audioCtx.createBufferSource();
    s.buffer = bf;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1200;
    lp.frequency.exponentialRampToValueAtTime(400, t + .3);
    const g = audioCtx.createGain();
    g.gain.value = .02;
    g.gain.exponentialRampToValueAtTime(.001, t + .5);
    s.connect(lp);
    lp.connect(g);
    g.connect(audioCtx.destination);
    s.start(t);
    s.stop(t + .5);
   }

  function playResetSound() {
    if (!audioCtx || !soundOn) return;
    const t = audioCtx.currentTime;
    const bs = audioCtx.sampleRate * .25;
    const bf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
    const d = bf.getChannelData(0);
    for (let i = 0; i < bs; i++) {
      const env = Math.pow(1 - i / bs, 2);
      d[i] = Math.sin(2 * Math.PI * (200 - i / bs * 150) * i / audioCtx.sampleRate) * env;
     }
    const s = audioCtx.createBufferSource();
    s.buffer = bf;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1500;
    const g = audioCtx.createGain();
    g.gain.value = .04;
    s.connect(lp);
    lp.connect(g);
    g.connect(audioCtx.destination);
    s.start(t);
    s.stop(t + .25);
   }

  soundBtn.addEventListener('click', () => {
    if (!audioCtx) initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '♫' : '♪';
    soundBtn.classList.toggle('muted', !soundOn);
    if (ambientGain) ambientGain.gain.linearRampToValueAtTime(soundOn ? .1 : .0, audioCtx.currentTime + .5);
   });

   /* ── Audio init on first interaction ────────────────────── */
  let firstInteraction = false;
  canvas.addEventListener('pointerdown', () => {
    if (!firstInteraction) {
      firstInteraction = true;
      if (!audioCtx) initAudio();
      if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
       }
      setTimeout(() => {
        if (ambientGain) ambientGain.gain.linearRampToValueAtTime(soundOn ? .1 : .0, audioCtx.currentTime + 2);
       }, 100);
     }
    setTimeout(() => hint.classList.remove("show"), 2000);
    setTimeout(() => hint.classList.add("fade"), 3000);
   }, { once: false });

/* ── Controls ────────────────────────────────────────────── */
  resetBtn.addEventListener('click', () => {
    inkMarks.length = 0;
    blooms.length = 0;
    densityMap.fill(0);
    saturationLevel = 0;
    rapidClickCount = 0;
    paperMemory = 0;
    breathMist = 0;
    fiberLift = 0;
    printComplete = false;
    completeOverlay.classList.remove('show');
    progress.textContent = '';
    progress.classList.remove('show');
    densityMeter.classList.remove('show');
    densityFill.style.width = '0%';
    playResetSound();
   });

  finishBtn.addEventListener('click', () => {
    if (inkMarks.length === 0) return;

    const sc = document.createElement('canvas');
    sc.width = W; sc.height = H;
    const sX = sc.getContext('2d');
    sX.drawImage(paperC, 0, 0);
    sX.drawImage(sceneC, 0, 0);
    for (const mk of inkMarks) {
      if (mk.type === 'bloom') {
        drawBloomOn(sX, mk.x, mk.y, mk.radius, mk.opacity, mk.color);
       } else if (mk.type === 'stroke') {
        drawStrokeOn(sX, mk.pts, mk.radius, mk.opacity, mk.color, mk.holdDuration || 0);
       }
     }

    const sx = W - 80 + (Math.random() - .5) * 12;
    const sy = H - 80 + (Math.random() - .5) * 12;
    const sr = (Math.random() - .5) * .04;
    sX.save();
    sX.translate(sx, sy);
    sX.rotate(sr);
    sX.fillStyle = VERM;
    const rw = 34, rh = 44, rr = 4;
    sX.beginPath();
    sX.moveTo(-rw/2 + rr, -rh/2);
    sX.lineTo(rw/2 - rr, -rh/2);
    sX.quadraticCurveTo(rw/2, -rh/2, rw/2, -rh/2 + rr);
    sX.lineTo(rw/2, rh/2 - rr);
    sX.quadraticCurveTo(rw/2, rh/2, rw/2 - rr, rh/2);
    sX.lineTo(-rw/2 + rr, rh/2);
    sX.quadraticCurveTo(-rw/2, rh/2, -rw/2 + rr, rh/2 - rr);
    sX.lineTo(-rw/2, -rh/2 + rr);
    sX.quadraticCurveTo(-rw/2, -rh/2, -rw/2 + rr, -rh/2);
    sX.closePath();
    sX.fill();
    sX.fillStyle = PAPER;
    sX.font = 'bold 26px serif';
    sX.textAlign = 'center';
    sX.textBaseline = 'middle';
    sX.fillText('印', 0, 2);
    sX.restore();

    sX.save();
    sX.fillStyle = INK;
    sX.globalAlpha = .55;
    sX.font = '11px serif';
    sX.textAlign = 'left';
    sX.textBaseline = 'top';
    sX.fillText('浮世絵 — Ukiyo-e', 20, 18);
    sX.restore();

    sc.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ukiyo-e-' + Date.now() + '.png';
      a.click();
      URL.revokeObjectURL(url);
     }, 'image/png');
   });

   /* ── Keyboard ────────────────────────────────────────────── */
  addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') resetBtn.click();
    if (e.key === 's' || e.key === 'S') finishBtn.click();
    if (e.key === 'j' || e.key === 'J') soundBtn.click();
   });

  soundBtn.setAttribute('aria-label', 'Toggle ambient sound');
  resetBtn.setAttribute('aria-label', 'Clear the print');
  finishBtn.setAttribute('aria-label', 'Finish and download your print');

})();
</script>
</body>
</html>
