<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>v12 Runtime Check</title></head>
<body>
<canvas id="game" width="480" height="640"></canvas>
<script src="game-loop.js"></script>
<script src="input.js"></script>
<script src="webaudio-kit.js"></script>
<script src="game.js"></script>
<script>
(function(){
  var canvas = document.getElementById('game');
  // Wait for one rAF cycle then dispatch click synchronously
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      // Simulate pointerdown on canvas
      var evt = new PointerEvent('pointerdown', {
        bubbles: true, cancelable: true,
        clientX: 240, clientY: 320, pointerType: 'mouse'
      });
      canvas.dispatchEvent(evt);
      // Also dispatch keydown to trigger AudioContext
      var keyEvt = new KeyboardEvent('keydown', {
        bubbles: true, cancelable: true, key: 'Enter', code: 'Enter'
      });
      window.dispatchEvent(keyEvt);
      // Let a few frames run, then mark done
      setTimeout(function(){ document.title = "RUNTIME_OK"; }, 500);
    });
  });
})();
</script>
</body>
</html>
