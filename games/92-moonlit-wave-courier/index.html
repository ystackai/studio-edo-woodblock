<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moonlit Wave Courier</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0f3c;font-family:'Noto Serif JP','Hiragino Mincho Pro','Georgia',serif}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
#ui.active{pointer-events:all}
#title{font-size:clamp(28px,5vw,56px);color:#f5f0e8;text-shadow:0 0 30px rgba(245,240,232,0.25),0 0 80px rgba(26,31,78,0.5);letter-spacing:0.15em;margin-bottom:0.3em;opacity:0;transform:translateY(20px);transition:all 1s cubic-bezier(0.25,0.46,0.45,0.94)}
#subtitle{font-size:clamp(12px,2vw,18px);color:#8a8faa;letter-spacing:0.3em;margin-bottom:2em;opacity:0;transform:translateY(10px);transition:all 1s cubic-bezier(0.25,0.46,0.45,0.94) 0.3s}
#start-btn{background:none;border:2px solid rgba(245,240,232,0.6);color:#f5f0e8;font-family:inherit;font-size:clamp(16px,2.5vw,24px);padding:16px 48px;cursor:pointer;letter-spacing:0.2em;opacity:0;transform:translateY(10px);transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);pointer-events:all;min-height:44px;border-radius:2px}
#start-btn:hover,#start-btn:focus{background:rgba(245,240,232,0.15);border-color:#f5f0e8;outline:none}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:#f5f0e8;font-size:clamp(11px,1.4vw,15px);opacity:0;transition:opacity 0.5s;pointer-events:none}
#hud.visible{opacity:1}
.hud-item{background:rgba(10,15,60,0.65);padding:8px 14px;border-radius:3px;border:1px solid rgba(245,240,232,0.12);backdrop-filter:blur(4px)}
#streak-display{color:#c23b27;font-weight:bold;letter-spacing:0.1em;transition:transform 0.2s}
#streak-display.bump{transform:scale(1.3)}
#gameover{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,15,60,0.88);pointer-events:all;opacity:0;transition:opacity 0.6s}
#gameover.visible{display:flex;opacity:1}
#gameover h2{color:#f5f0e8;font-size:clamp(22px,4vw,40px);margin-bottom:0.6em;letter-spacing:0.12em;font-weight:normal}
#gameover .score-line{color:#8a8faa;font-size:clamp(13px,1.8vw,18px);margin:5px 0}
#gameover .score-line span{color:#f5f0e8;font-weight:bold}
#gameover #restart-btn{background:none;border:2px solid rgba(245,240,232,0.5);color:#f5f0e8;font-family:inherit;font-size:clamp(14px,2vw,20px);padding:12px 40px;cursor:pointer;letter-spacing:0.2em;margin-top:1.5em;pointer-events:all;min-height:44px;transition:all 0.3s ease;border-radius:2px}
#gameover #restart-btn:hover,#gameover #restart-btn:focus{background:rgba(245,240,232,0.15);border-color:#f5f0e8;outline:none}
#mobile-controls{position:absolute;bottom:0;left:0;width:100%;height:35%;display:none;pointer-events:none}
.mobile-btn{position:absolute;width:64px;height:64px;background:rgba(245,240,232,0.08);border:1.5px solid rgba(245,240,232,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(245,240,232,0.5);font-size:24px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;pointer-events:all;transition:all 0.15s}
.mobile-btn:active{background:rgba(245,240,232,0.25);color:rgba(245,240,232,0.8)}
#btn-jump{right:12%;bottom:8%}
#btn-dash{right:30%;bottom:8%}
@media(hover:none)and(pointer:coarse){#mobile-controls{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui" class="active">
   <div id="title">月明 Wave Courier</div>
   <div id="subtitle">MOONLIT WAVE COURIER</div>
   <button id="start-btn" tabindex="0">START</button>
</div>
<div id="hud">
   <div class="hud-item" id="score-display">Score: 0</div>
   <div class="hud-item" id="streak-display"></div>
   <div class="hud-item" id="dist-display">0m</div>
</div>
<div id="gameover">
   <h2>The courier rests</h2>
   <div class="score-line">Score: <span id="final-score">0</span></div>
   <div class="score-line">Distance: <span id="final-dist">0</span>m</div>
   <div class="score-line">Delivered: <span id="final-delivered">0</span></div>
   <div class="score-line">Best: <span id="final-best">0</span></div>
   <button id="restart-btn" tabindex="0">RIDE AGAIN</button>
</div>
<div id="mobile-controls">
   <div class="mobile-btn" id="btn-jump">↑</div>
   <div class="mobile-btn" id="btn-dash">»</div>
</div>
<script>
'use strict';

// ─── Constants ──────────────────────────────────────────
const GRAVITY = 0.55;
const JUMP_VEL = -11.5;
const DASH_VEL = 16;
const DASH_COOLDOWN = 50;
const DASH_DURATION = 10;
const BASE_SCROLL_SPEED = 3.2;
const MAX_SCROLL_SPEED = 7.5;
const SPEED_INCREMENT = 0.35;
const SPEED_INTERVAL = 500;
const PLATFORM_MIN_W = 100;
const PLATFORM_MAX_W = 280;
const PLATFORM_GAP_MIN = 50;
const PLATFORM_GAP_MAX = 160;
const YOKAI_SPEED = 1.8;
const PARTICLE_MAX = 80;
const SCALE_TARGET = 800;

// ─── Color Palette ──────────────────────────────────────
const C = {
  sky1:'#0c1138', sky2:'#161c52', sky3:'#222868',
  moon:'#f2edd8', moonGlow:'rgba(242,237,216,0.06)',
  water1:'#080d30', water2:'#121848', water3:'#1a2060',
  ink:'#1a1a2e', inkLight:'#303050',
  paper:'#f2edd8', paperDim:'#b0a890',
  vermilion:'#c23b27', vermilionDark:'#8a2a1e',
  gold:'#d4a843', goldDim:'#8a7030',
  mist:'rgba(180,185,200,0.035)',
  lantern:'#e0a038', lanternGlow:'rgba(224,160,56,0.12)',
  waterHighlight:'rgba(200,210,230,0.08)'
};

// ─── Canvas Setup ───────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H, scale;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
  scale = Math.min(W, H) / SCALE_TARGET;
}
window.addEventListener('resize', resize);
resize();

// ─── Utility ────────────────────────────────────────────
function lerp(a,b,t){return a+(b-a)*t}
function rand(a,b){return a+Math.random()*(b-a)}
function randInt(a,b){return Math.floor(rand(a,b+1))}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

// ─── Audio System ───────────────────────────────────────
let audioCtx=null;
function initAudio(){if(!audioCtx) audioCtx=new(AudioContext||webkitAudioContext)()}

function playTone(freq,dur,vol=0.07,type='sine'){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(freq*0.6,audioCtx.currentTime+dur);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}

function sfxJump(){playTone(280,0.18,0.06,'triangle')}
function sfxDash(){playTone(120,0.25,0.04,'sawtooth')}
function sfxLetter(){
  playTone(523,0.1,0.06,'sine');
  setTimeout(()=>playTone(659,0.12,0.06,'sine'),80);
  setTimeout(()=>playTone(784,0.15,0.05,'sine'),160);
}
function sfxHit(){playTone(80,0.5,0.12,'sawtooth')}
function sfxWind(){playTone(180,0.3,0.04,'triangle')}

// ─── Game State ─────────────────────────────────────────
let state='title';
let score=0, streak=0, distance=0, highScore=0;
let scrollSpeed=BASE_SCROLL_SPEED, scrollDist=0;
let lastSpeedUp=0;
let gameTime=0;
let shakeTimer=0, shakeIntensity=0;
let flashTimer=0, flashColor=C.paper;
let scorePopup={text:'',x:0,y:0,life:0,vx:0,vy:-2};

// ─── Player ─────────────────────────────────────────────
const player={
  x:120, y:0, w:22, h:38,
  vx:0, vy:0,
  onGround:false, jumping:false,
  dashing:false, dashTimer:0, dashCooldown:0,
  facing:1, animFrame:0, animTimer:0,
  squashX:1, squashY:1, squashTimer:0,
  alive:true, hitAnim:0,
  runParticles:[], dashTrail:[]
};

function resetPlayer(){
  player.x=120; player.y=0;
  player.vx=0; player.vy=0;
  player.onGround=false; player.jumping=false;
  player.dashing=false; player.dashTimer=0; player.dashCooldown=0;
  player.facing=1; player.animFrame=0; player.animTimer=0;
  player.squashX=1; player.squashY=1; player.squashTimer=0;
  player.alive=true; player.hitAnim=0;
  player.runParticles=[]; player.dashTrail=[];
}

// ─── Platforms ──────────────────────────────────────────
let platforms=[];

function generatePlatform(x){
  const pw=rand(PLATFORM_MIN_W,PLATFORM_MAX_W)*scale;
  const baseY=H*0.58+rand(-50,40)*scale;
  return{
    x, y:baseY, w:pw, h:7*scale,
    type:Math.random()<0.35?'bridge':'wave',
    offset:rand(0,20), speed:rand(0.02,0.04)
  };
}

function initPlatforms(){
  platforms=[];
  let x=0;
  for(let i=0;i<20;i++){
    const p=generatePlatform(x);
    platforms.push(p);
    x+=p.w+rand(PLATFORM_GAP_MIN,PLATFORM_GAP_MAX)*scale;
  }
  // Ensure first platform is wide and solid
  platforms[0].w=300*scale;
  platforms[0].type='bridge';
}

function updatePlatforms(){
  for(let i=platforms.length-1;i>=0;i--){
    platforms[i].x-=scrollSpeed*scale*0.5;
    if(platforms[i].x+platforms[i].w<-100){
      platforms.splice(i,1);
      const lastX=platforms.length>0?platforms[platforms.length-1].x:0;
      platforms.push(generatePlatform(lastX+rand(PLATFORM_MIN_W,PLATFORM_MAX_W)*scale+rand(PLATFORM_GAP_MIN,PLATFORM_GAP_MAX)*scale));
    }
  }
}

function drawPlatforms(){
  for(const p of platforms){
    if(p.x+p.w<-50||p.x>W+100)continue;
    ctx.save();
    if(p.type==='bridge'){
      // Bridge deck
      ctx.fillStyle='#3a2a18';
      ctx.fillRect(p.x,p.y,p.w,p.h);
      // Top edge highlight
      ctx.fillStyle='#4a3a28';
      ctx.fillRect(p.x,p.y,p.w,2*scale);
      // Wood grain lines
      ctx.strokeStyle='rgba(245,240,232,0.06)';
      ctx.lineWidth=1;
      for(let gx=p.x+8*scale;gx<p.x+p.w;gx+=12*scale){
        ctx.beginPath();
        ctx.moveTo(gx,p.y+2*scale);
        ctx.lineTo(gx,p.y+p.h);
        ctx.stroke();
      }
      // Railings
      ctx.fillStyle='#2a1a08';
      const rh=14*scale;
      ctx.fillRect(p.x,p.y-rh,3.5*scale,rh);
      ctx.fillRect(p.x+p.w-3.5*scale,p.y-rh,3.5*scale,rh);
      ctx.fillRect(p.x,p.y-rh,p.w,2*scale);
      // Railing posts
      for(let rp=p.x+30*scale;rp<p.x+p.w-10*scale;rp+=40*scale){
        ctx.fillRect(rp-1.5*scale,p.y-rh,3*scale,rh+2*scale);
      }
      // Moonlight reflection on bridge
      ctx.globalAlpha=0.08;
      ctx.fillStyle=C.paper;
      ctx.fillRect(p.x+20*scale,p.y,p.w*0.3,p.h);
    } else {
      // Wave platform
      ctx.fillStyle=C.water3;
      ctx.globalAlpha=0.65;
      const waveT=gameTime*p.speed+p.offset;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y+p.h);
      for(let wx=p.x;wx<=p.x+p.w;wx+=3*scale){
        const wy=p.y-Math.sin(wx*0.04+waveT)*3*scale;
        ctx.lineTo(wx,wy);
      }
      ctx.lineTo(p.x+p.w,p.y+p.h);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha=1;
      // Foam line
      ctx.strokeStyle='rgba(245,240,232,0.12)';
      ctx.lineWidth=1.5*scale;
      ctx.beginPath();
      for(let wx=p.x;wx<=p.x+p.w;wx+=3*scale){
        const wy=p.y-Math.sin(wx*0.04+waveT)*3*scale;
        if(wx===p.x)ctx.moveTo(wx,wy);
        else ctx.lineTo(wx,wy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ─── Hazards ────────────────────────────────────────────
let hazards=[];

function spawnHazard(){
  const chance=0.012+distance*0.000008;
  if(Math.random()>chance)return;
  const type=Math.random()<0.6?'yokai':'crest';
  if(type==='yokai'){
    const py=H*0.55+rand(-30,20)*scale;
    hazards.push({
      type:'yokai', x:W+60, y:py,
      w:30*scale, h:34*scale,
      vx:-YOKAI_SPEED*scale,
      vy:Math.sin(gameTime*0.04)*0.6*scale,
      phase:rand(0,Math.PI*2), alive:true
    });
  } else {
    hazards.push({
      type:'crest', x:W+60, y:H*0.62,
      w:55*scale, h:32*scale,
      vx:-scrollSpeed*scale*0.7,
      vy:0, alive:true, riseTimer:rand(0,Math.PI*2)
    });
  }
}

function updateHazards(){
  for(let i=hazards.length-1;i>=0;i--){
    const h=hazards[i];
    h.x+=h.vx;
    if(h.type==='yokai'){
      h.phase+=0.04;
      h.y+=Math.sin(h.phase)*0.7*scale;
    } else {
      h.riseTimer+=0.04;
      h.y=H*0.62-Math.sin(h.riseTimer)*8*scale;
    }
    if(h.x+h.w<-60){hazards.splice(i,1);continue}
    if(player.alive&&!player.dashing&&rectsOverlap(player,h)){
      hitPlayer();
    }
  }
}

function drawHazards(){
  for(const h of hazards){
    if(h.x+h.w<-60||h.x>W+100)continue;
    ctx.save();
    if(h.type==='yokai'){
      const alpha=0.65+Math.sin(h.phase)*0.2;
      ctx.globalAlpha=alpha;
      // Shadow body
      ctx.fillStyle='#0e0e1e';
      ctx.beginPath();
      ctx.ellipse(h.x+h.w/2,h.y+h.h*0.55,h.w*0.42,h.h*0.45,0,0,Math.PI*2);
      ctx.fill();
      // Wispy lower body
      ctx.strokeStyle='#0e0e1e';
      ctx.lineWidth=2.5*scale;
      ctx.lineCap='round';
      ctx.globalAlpha=alpha*0.5;
      for(let w=0;w<3;w++){
        const wx=h.x+h.w*(0.2+w*0.2);
        ctx.beginPath();
        ctx.moveTo(wx,h.y+h.h*0.8);
        ctx.quadraticCurveTo(wx+Math.sin(h.phase+w)*8*scale,h.y+h.h,wx+Math.sin(h.phase+w+1)*6*scale,h.y+h.h+8*scale);
        ctx.stroke();
      }
      // Head
      ctx.globalAlpha=alpha;
      ctx.fillStyle='#0e0e1e';
      ctx.beginPath();
      ctx.arc(h.x+h.w/2,h.y+h.h*0.18,h.w*0.28,0,Math.PI*2);
      ctx.fill();
      // Glowing eyes
      ctx.fillStyle=C.vermilion;
      ctx.globalAlpha=alpha*(0.6+Math.sin(h.phase*3)*0.4);
      const eyeY=h.y+h.h*0.15;
      ctx.beginPath();
      ctx.arc(h.x+h.w*0.38,eyeY,2.5*scale,0,Math.PI*2);
      ctx.arc(h.x+h.w*0.62,eyeY,2.5*scale,0,Math.PI*2);
      ctx.fill();
      // Eye glow
      ctx.globalAlpha=alpha*0.15;
      ctx.fillStyle=C.vermilion;
      ctx.beginPath();
      ctx.arc(h.x+h.w*0.38,eyeY,6*scale,0,Math.PI*2);
      ctx.arc(h.x+h.w*0.62,eyeY,6*scale,0,Math.PI*2);
      ctx.fill();
      // Wispy arms
      ctx.globalAlpha=alpha*0.45;
      ctx.strokeStyle='#0e0e1e';
      ctx.lineWidth=2*scale;
      ctx.beginPath();
      ctx.moveTo(h.x+h.w*0.15,h.y+h.h*0.35);
      ctx.quadraticCurveTo(h.x-8*scale,h.y+h.h*0.15,h.x-12*scale,h.y+h.h*0.25+Math.sin(h.phase*2)*5*scale);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(h.x+h.w*0.85,h.y+h.h*0.35);
      ctx.quadraticCurveTo(h.x+h.w+8*scale,h.y+h.h*0.15,h.x+h.w+12*scale,h.y+h.h*0.25+Math.sin(h.phase*2+1)*5*scale);
      ctx.stroke();
    } else if(h.type==='crest'){
      const r=Math.sin(h.riseTimer)*0.5+0.5;
      ctx.globalAlpha=0.6+0.3*r;
      // Wave body
      ctx.fillStyle=C.water3;
      ctx.beginPath();
      ctx.moveTo(h.x,h.y+h.h);
      ctx.quadraticCurveTo(h.x+h.w*0.2,h.y-h.h*0.3*r,h.x+h.w*0.5,h.y-h.h*0.5*r);
      ctx.quadraticCurveTo(h.x+h.w*0.8,h.y-h.h*0.3*r,h.x+h.w,h.y+h.h);
      ctx.closePath();
      ctx.fill();
      // Foam at crest
      ctx.globalAlpha=0.4*r;
      ctx.fillStyle=C.paper;
      ctx.beginPath();
      ctx.arc(h.x+h.w*0.5,h.y-h.h*0.5*r,5*scale*r,0,Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(h.x+h.w*0.42,h.y-h.h*0.35*r,3*scale*r,0,Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(h.x+h.w*0.58,h.y-h.h*0.35*r,3*scale*r,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function rectsOverlap(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

// ─── Collectibles ───────────────────────────────────────
let letters=[];

function spawnLetter(){
  if(Math.random()>0.006)return;
  const py=H*0.38+rand(-60,30)*scale;
  // Don't spawn too close to existing letters
  if(letters.length>0&&letters[letters.length-1].x>W-200*scale)return;
  letters.push({
    x:W+50, y:py,
    w:20*scale, h:15*scale,
    alive:true, bobPhase:rand(0,Math.PI*2), collected:false
  });
}

function updateLetters(){
  for(let i=letters.length-1;i>=0;i--){
    const l=letters[i];
    if(l.collected){
      l.life-=0.03;
      l.x+=l.vx||0;
      l.y+=l.vy||0;
      if(l.life<=0){letters.splice(i,1);continue}
      continue;
    }
    l.x-=scrollSpeed*scale*0.35;
    l.bobPhase+=0.04;
    l.y+=Math.sin(l.bobPhase)*0.35*scale;
    if(l.x+l.w<-60){letters.splice(i,1);continue}
    if(player.alive&&!player.dashing&&rectsOverlap(player,l)){
      collectLetter(l);
    }
  }
}

function collectLetter(l){
  l.collected=true;
  l.life=1;
  l.vx=rand(-2,2)*scale;
  l.vy=rand(-5,-2)*scale;
  streak++;
  const pts=100*Math.max(1,streak);
  score+=pts;
  sfxLetter();
  // Bump streak display
  const sd=document.getElementById('streak-display');
  sd.classList.add('bump');
  setTimeout(()=>sd.classList.remove('bump'),200);
  // Particles
  for(let i=0;i<15;i++){
    particles.push({
      x:l.x+l.w/2,y:l.y+l.h/2,
      vx:rand(-3.5,3.5)*scale,vy:rand(-4.5,1)*scale,
      life:1,decay:rand(0.015,0.035),
      size:rand(2,5)*scale,color:Math.random()<0.5?C.gold:C.paper
    });
  }
  // Score popup
  scorePopup={text:'+'+pts,x:l.x+l.w/2,y:l.y,life:1,vx:0.5*scale,vy:-2.5*scale};
  flashTimer=8;flashColor=C.gold;
  // Increment delivered
  delivered++;
}

function drawLetters(){
  for(const l of letters){
    if(!l.collected&&(l.x+l.w<-60||l.x>W+100))continue;
    ctx.save();
    if(l.collected){
      ctx.globalAlpha=l.life*0.8;
      ctx.translate(l.x+l.w/2,l.y+l.h/2);
      ctx.rotate((1-l.life)*Math.PI);
    }
    ctx.translate(l.x+l.w/2,l.y+l.h/2);
    // Envelope body
    ctx.fillStyle=C.paper;
    ctx.fillRect(-l.w/2,-l.h/2,l.w,l.h);
    // Flap
    ctx.strokeStyle=C.vermilionDark;
    ctx.lineWidth=1.5*scale;
    ctx.beginPath();
    ctx.moveTo(-l.w/2,-l.h/2);
    ctx.lineTo(0,l.h*0.1);
    ctx.lineTo(l.w/2,-l.h/2);
    ctx.stroke();
    // Seal
    ctx.fillStyle=C.vermilion;
    ctx.beginPath();
    ctx.arc(0,l.h*0.2,3*scale,0,Math.PI*2);
    ctx.fill();
    // Glow
    if(!l.collected){
      ctx.globalAlpha=0.12+Math.sin(l.bobPhase)*0.04;
      ctx.fillStyle=C.gold;
      ctx.beginPath();
      ctx.arc(0,0,l.w*0.7,0,Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ─── Wind Currents ──────────────────────────────────────
let windCurrents=[];

function spawnWind(){
  if(Math.random()>0.004)return;
  if(windCurrents.length>4)return;
  windCurrents.push({
    x:W+50, y:H*0.3+rand(-50,50)*scale,
    w:70*scale, h:45*scale,
    alive:true, life:350, phase:rand(0,Math.PI*2)
  });
}

function updateWind(){
  for(let i=windCurrents.length-1;i>=0;i--){
    const w=windCurrents[i];
    w.x-=scrollSpeed*scale*0.4;
    w.life--;
    if(w.life<=0||w.x+w.w<-60){windCurrents.splice(i,1);continue}
    if(player.alive&&!player.dashing&&rectsOverlap(player,w)){
      sfxWind();
      score+=25;
      player.dashing=true;
      player.dashTimer=DASH_DURATION;
      player.dashCooldown=DASH_COOLDOWN;
      // Wind particles
      for(let j=0;j<8;j++){
        particles.push({
          x:w.x+rand(0,w.w),y:w.y+rand(0,w.h),
          vx:rand(2,5)*scale,vy:rand(-0.5,0.5)*scale,
          life:1,decay:0.04,
          size:rand(1.5,3.5)*scale,color:C.paper
        });
      }
    }
  }
}

function drawWind(){
  for(const w of windCurrents){
    if(w.x+w.w<-60||w.x>W+100)continue;
    ctx.save();
    const pulse=0.1+Math.sin(w.phase+gameTime*0.04)*0.04;
    ctx.globalAlpha=pulse;
    // Wind lines
    ctx.strokeStyle=C.paper;
    ctx.lineWidth=1.5*scale;
    ctx.lineCap='round';
    for(let i=0;i<6;i++){
      const ly=w.y+w.h*(i/5);
      const off=Math.sin(gameTime*0.03+i*0.8)*12*scale;
      const lineLen=rand(20,45)*scale;
      const sx=w.x+off;
      ctx.beginPath();
      ctx.moveTo(sx,ly);
      ctx.lineTo(sx+lineLen,ly);
      ctx.stroke();
      // Arrowhead
      ctx.beginPath();
      ctx.moveTo(sx+lineLen,ly-3*scale);
      ctx.lineTo(sx+lineLen+5*scale,ly);
      ctx.lineTo(sx+lineLen,ly+3*scale);
      ctx.stroke();
    }
    // Subtle glow area
    ctx.globalAlpha=0.04;
    ctx.fillStyle=C.paper;
    ctx.beginPath();
    ctx.ellipse(w.x+w.w/2,w.y+w.h/2,w.w*0.5,w.h*0.5,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ─── Particles ──────────────────────────────────────────
let particles=[];

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;
    p.vy+=0.04*scale;
    p.life-=p.decay;
    if(p.life<=0)particles.splice(i,1);
  }
  if(particles.length>PARTICLE_MAX)particles.splice(0,particles.length-PARTICLE_MAX);
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function spawnRunParticles(){
  if(!player.onGround||!player.alive||player.dashing)return;
  if(gameTime%5!==0)return;
  particles.push({
    x:player.x+4*scale,y:player.y+player.h,
    vx:rand(-1,-2.5)*scale,vy:rand(-0.5,0.3)*scale,
    life:1,decay:0.05,
    size:rand(1.5,3)*scale,color:C.paperDim
  });
}

function spawnSplashParticles(x,y,count){
  for(let i=0;i<count;i++){
    particles.push({
      x,y,
      vx:rand(-3,3)*scale,vy:rand(-5,-1)*scale,
      life:1,decay:rand(0.02,0.04),
      size:rand(2,4)*scale,color:C.water3
    });
  }
}

// ─── Score Popup ────────────────────────────────────────
function updateScorePopup(){
  if(!scorePopup.text)return;
  scorePopup.life-=0.015;
  scorePopup.x+=scorePopup.vx;
  scorePopup.y+=scorePopup.vy;
  if(scorePopup.life<=0)scorePopup.text='';
}

function drawScorePopup(){
  if(!scorePopup.text)return;
  ctx.save();
  ctx.globalAlpha=scorePopup.life;
  ctx.fillStyle=C.gold;
  ctx.font=`bold ${Math.round(16*scale)}px 'Noto Serif JP', Georgia, serif`;
  ctx.textAlign='center';
  ctx.fillText(scorePopup.text,scorePopup.x,scorePopup.y);
  ctx.restore();
}

// ─── Background / Parallax ─────────────────────────────
let bgOffset=0;

function drawBackground(){
  ctx.save();
  // Sky gradient
  const skyGrad=ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0,C.sky1);
  skyGrad.addColorStop(0.35,C.sky2);
  skyGrad.addColorStop(0.65,C.sky3);
  skyGrad.addColorStop(1,C.water1);
  ctx.fillStyle=skyGrad;
  ctx.fillRect(0,0,W,H);

  // Moon
  const moonX=W*0.72;
  const moonY=H*0.13;
  const moonR=38*scale;
  // Moon glow layers
  for(let g=3;g>=1;g--){
    ctx.globalAlpha=0.03*g;
    ctx.fillStyle=C.moon;
    ctx.beginPath();
    ctx.arc(moonX,moonY,moonR*(1+g*1.5),0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  // Moon body
  ctx.fillStyle=C.moon;
  ctx.beginPath();
  ctx.arc(moonX,moonY,moonR,0,Math.PI*2);
  ctx.fill();
  // Crescent shadow
  ctx.fillStyle=C.sky2;
  ctx.globalAlpha=0.35;
  ctx.beginPath();
  ctx.arc(moonX+12*scale,moonY-4*scale,moonR*0.85,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;

  // Stars
  ctx.fillStyle=C.moon;
  const starSeed=42;
  for(let i=0;i<50;i++){
    const sx=(i*137+starSeed)%W;
    const sy=(i*251+starSeed)%(H*0.45);
    const ss=((i*73)%3+1)*scale*0.7;
    const tw=Math.sin(gameTime*0.015+i*0.7)*0.35+0.65;
    ctx.globalAlpha=tw*0.45;
    ctx.beginPath();
    ctx.arc(sx,sy,ss,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // Mist layers (3 parallax layers)
  for(let m=0;m<3;m++){
    const mY=H*(0.48+m*0.07);
    const mSpeed=bgOffset*(0.2+m*0.08);
    ctx.fillStyle=C.mist;
    for(let i=0;i<10;i++){
      const mx=((i*W/4+mSpeed)%(W*1.3))-W*0.15;
      const mw=(W*0.15+m*20*scale);
      ctx.beginPath();
      ctx.ellipse(mx,mY,mw,15*scale+m*8*scale,0,0,Math.PI*2);
      ctx.fill();
    }
  }

  // Mountains (3 layers with parallax)
  drawMountainLayer(0.12,mountains1,-80*scale,'#141848',0.45);
  drawMountainLayer(0.25,mountains2,-40*scale,'#1c2258',0.6);
  drawMountainLayer(0.4,mountains3,-20*scale,'#242a6a',0.75);

  // Water surface
  const waterY=H*0.62;
  ctx.fillStyle=C.water1;
  ctx.globalAlpha=0.75;
  ctx.fillRect(0,waterY,W,H-waterY);
  ctx.globalAlpha=1;

  // Moonlight reflection on water
  ctx.globalAlpha=0.06;
  const refGrad=ctx.createLinearGradient(moonX-waterY*0.3,waterY,moonX+waterY*0.3,waterY+80*scale);
  refGrad.addColorStop(0,C.moon);
  refGrad.addColorStop(1,'transparent');
  ctx.fillStyle=refGrad;
  ctx.fillRect(moonX-waterY*0.3,waterY,waterY*0.6,80*scale);
  ctx.globalAlpha=1;

  // Water ripples (moonlight path)
  ctx.strokeStyle='rgba(245,240,232,0.05)';
  ctx.lineWidth=1*scale;
  for(let i=0;i<20;i++){
    const ry=waterY+8*scale+i*12*scale;
    if(ry>H-20*scale)break;
    const rw=40*scale+Math.sin(gameTime*0.02+i)*20*scale;
    const rx=moonX+Math.sin(gameTime*0.015+i*0.5)*rw*0.3;
    ctx.beginPath();
    ctx.moveTo(rx-rw,ry);
    ctx.lineTo(rx+rw,ry);
    ctx.stroke();
  }

  ctx.restore();
}

// Mountain data - generated once then scrolled
let mountains1=[],mountains2=[],mountains3=[];
function initMountains(){
  mountains1=[];mountains2=[];mountains3=[];
  for(let layer=0;layer<3;layer++){
    const arr=layer===0?mountains1:layer===1?mountains2:mountains3;
    for(let i=0;i<60;i++){
      arr.push({
        x:i*120*scale,
        h:(30+Math.sin(i*0.5+layer)*20+Math.sin(i*1.3+layer*2)*15+Math.sin(i*2.7)*10)*scale
      });
    }
  }
}

function drawMountainLayer(parallax, data, baseOffY, color, alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  const baseY=H*0.62;
  ctx.beginPath();
  ctx.moveTo(-50,baseY);
  for(const m of data){
    const mx=m.x-bgOffset*parallax+baseOffY;
    if(mx>-150&&mx<W+150){
      const my=baseY-m.h;
      ctx.lineTo(mx,my);
    }
  }
  ctx.lineTo(W+50,baseY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ─── Lanterns ──────────────────────────────────────────
let lanterns=[];

function spawnLantern(){
  if(Math.random()>0.0015)return;
  if(lanterns.length>6)return;
  const p=platforms[Math.floor(Math.random()*platforms.length)];
  if(!p||p.x>W+200)return;
  lanterns.push({
    x:p.x+p.w*rand(0.15,0.85),
    y:p.y-18*scale,
    w:14*scale, h:22*scale,
    phase:rand(0,Math.PI*2),
    baseY:p.y-18*scale
  });
}

function updateLanterns(){
  for(let i=lanterns.length-1;i>=0;i--){
    lanterns[i].x-=scrollSpeed*scale*0.5;
    if(lanterns[i].x+lanterns[i].w<-60)lanterns.splice(i,1);
  }
}

function drawLanterns(){
  for(const l of lanterns){
    if(l.x+l.w<-60||l.x>W+100)continue;
    ctx.save();
    const flicker=0.65+Math.sin(l.phase+gameTime*0.07)*0.35;
    // Glow
    const glowGrad=ctx.createRadialGradient(l.x+l.w/2,l.y+l.h/2,2*scale,l.x+l.w/2,l.y+l.h/2,28*scale);
    glowGrad.addColorStop(0,`rgba(224,160,56,${0.12*flicker})`);
    glowGrad.addColorStop(1,'transparent');
    ctx.fillStyle=glowGrad;
    ctx.fillRect(l.x-26*scale,l.y-26*scale,l.w+52*scale,l.h+52*scale);
    // Lantern body
    ctx.globalAlpha=flicker;
    ctx.fillStyle=C.lantern;
    ctx.fillRect(l.x,l.y,l.w,l.h);
    ctx.globalAlpha=1;
    // Frame
    ctx.strokeStyle=C.vermilionDark;
    ctx.lineWidth=1*scale;
    ctx.strokeRect(l.x,l.y,l.w,l.h);
    // Top/bottom caps
    ctx.fillStyle='#2a1a08';
    ctx.fillRect(l.x-1*scale,l.y-2*scale,l.w+2*scale,2*scale);
    ctx.fillRect(l.x-1*scale,l.y+l.h,l.w+2*scale,2*scale);
    // Hanging string
    ctx.strokeStyle='#2a1a08';
    ctx.lineWidth=1*scale;
    ctx.beginPath();
    ctx.moveTo(l.x+l.w/2,l.y-2*scale);
    ctx.lineTo(l.x+l.w/2,l.y-14*scale);
    ctx.stroke();
    // Inner glow
    ctx.globalAlpha=0.3*flicker;
    ctx.fillStyle='#f0c060';
    ctx.fillRect(l.x+3*scale,l.y+3*scale,l.w-6*scale,l.h-6*scale);
    ctx.restore();
  }
}

// ─── Player Drawing ─────────────────────────────────────
function drawPlayer(){
  if(!player.alive&&player.hitAnim<=0)return;
  ctx.save();

  const px=player.x;
  const py=player.y;
  const s=scale;

  // Squash and stretch
  let sx=player.squashX, sy=player.squashY;
  if(player.squashTimer>0){
    player.squashTimer--;
    const t=1-player.squashTimer/15;
    sx=lerp(sx,1,easeOut(t));
    sy=lerp(sy,1,easeOut(t));
  }

  ctx.translate(px+player.w/2, py+player.h);
  ctx.scale(player.facing*sx, sy);
  ctx.translate(-player.w/2, 0);

  const alpha=player.alive?1:0.4+player.hitAnim*0.6;
  ctx.globalAlpha=alpha;

  // Dash trail
  if(player.dashing){
    for(const t of player.dashTrail){
      ctx.globalAlpha=t.life*0.2;
      ctx.fillStyle=C.paper;
      ctx.save();
      ctx.translate(t.x-px-player.w/2, t.y-py-player.h);
      ctx.scale(player.facing*sx, sy);
      ctx.fillRect(-2,-42,18,36);
      ctx.restore();
    }
    ctx.globalAlpha=alpha;
  }

  // Shadow on platform
  ctx.globalAlpha=0.15;
  ctx.fillStyle=C.ink;
  ctx.beginPath();
  ctx.ellipse(0,0,player.w*0.6,3*s,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=alpha;

  // Legs with running animation
  const legAnim=player.onGround?Math.sin(gameTime*0.22)*4.5*s:3.5*s;
  ctx.fillStyle=C.ink;
  // Left leg
  ctx.fillRect(-3*s,-11*s,5*s,11*s+legAnim*s);
  // Right leg
  ctx.fillRect(4*s,-11*s,5*s,11*s-legAnim*s);

  // Hakama (flowing pants)
  ctx.beginPath();
  ctx.moveTo(-7*s,-24*s);
  ctx.lineTo(11*s,-24*s);
  ctx.lineTo(9*s,-11*s);
  ctx.lineTo(-5*s,-11*s);
  ctx.closePath();
  ctx.fill();

  // Torso
  ctx.fillRect(-5*s,-40*s,13*s,16*s);

  // Arms
  ctx.strokeStyle=C.ink;
  ctx.lineWidth=2.5*s;
  ctx.lineCap='round';
  const armAnim=player.onGround?Math.sin(gameTime*0.22+Math.PI)*3.5*s:-2.5*s;
  // Back arm
  ctx.beginPath();
  ctx.moveTo(-3*s,-37*s);
  ctx.lineTo(-9*s,-30*s+armAnim*s);
  ctx.stroke();
  // Front arm (holding letter)
  ctx.beginPath();
  ctx.moveTo(6*s,-37*s);
  ctx.lineTo(13*s,-32*s-armAnim*s);
  ctx.stroke();

  // Head
  ctx.fillStyle=C.ink;
  ctx.beginPath();
  ctx.arc(2*s,-46*s,7*s,0,Math.PI*2);
  ctx.fill();

  // Conical courier hat
  ctx.fillStyle='#2a2018';
  ctx.beginPath();
  ctx.moveTo(-11*s,-50*s);
  ctx.lineTo(15*s,-50*s);
  ctx.lineTo(2*s,-60*s);
  ctx.closePath();
  ctx.fill();
  // Hat brim detail
  ctx.strokeStyle='#3a3028';
  ctx.lineWidth=0.8*s;
  ctx.beginPath();
  ctx.moveTo(-9*s,-50*s);
  ctx.lineTo(13*s,-50*s);
  ctx.stroke();

  // Flowing scarf/ribbon (vermilion)
  ctx.strokeStyle=C.vermilion;
  ctx.lineWidth=2.2*s;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(7*s,-44*s);
  const scarfWave=Math.sin(gameTime*0.08)*6*s;
  ctx.quadraticCurveTo(17*s,-46*s+scarfWave,25*s,-41*s+scarfWave*0.5);
  ctx.stroke();

  // Hit flash
  if(player.hitAnim>0){
    ctx.globalAlpha=player.hitAnim*0.4;
    ctx.fillStyle=C.vermilion;
    ctx.fillRect(-player.w/2,-player.h-player.w/2,player.w,player.h+player.w/2);
  }

  ctx.restore();
}

// Squash/stretch on jump and land
function applySquashStretch(onLand){
  if(onLand){
    player.squashX=1.25;
    player.squashY=0.7;
    player.squashTimer=15;
    spawnSplashParticles(player.x+player.w/2,player.y+player.h,6);
  } else {
    player.squashX=0.8;
    player.squashY=1.2;
    player.squashTimer=12;
  }
}

function hitPlayer(){
  player.alive=false;
  player.hitAnim=1;
  shakeTimer=25;
  shakeIntensity=10;
  flashTimer=15;
  flashColor=C.vermilion;
  sfxHit();
  for(let i=0;i<25;i++){
    particles.push({
      x:player.x+player.w/2,y:player.y+player.h/2,
      vx:rand(-4,4)*scale,vy:rand(-6,2)*scale,
      life:1,decay:rand(0.008,0.025),
      size:rand(2,6)*scale,color:C.paper
    });
  }
  setTimeout(()=>{
    if(score>highScore)highScore=score;
    localStorage.setItem('moonlitCourier_high',highScore);
    endGame();
  },1800);
}

// ─── Game Flow ──────────────────────────────────────────
const uiEl=document.getElementById('ui');
const hudEl=document.getElementById('hud');
const titleEl=document.getElementById('title');
const subtitleEl=document.getElementById('subtitle');
const startBtn=document.getElementById('start-btn');
const gameoverEl=document.getElementById('gameover');
const finalScoreEl=document.getElementById('final-score');
const finalDistEl=document.getElementById('final-dist');
const finalDeliveredEl=document.getElementById('final-delivered');
const finalBestEl=document.getElementById('final-best');
const restartBtn=document.getElementById('restart-btn');
const scoreDisp=document.getElementById('score-display');
const streakDisp=document.getElementById('streak-display');
const distDisp=document.getElementById('dist-display');

startBtn.addEventListener('click',startGame);
startBtn.addEventListener('touchend',e=>{e.preventDefault();startGame();},{passive:false});
restartBtn.addEventListener('click',restartGame);
restartBtn.addEventListener('touchend',e=>{e.preventDefault();restartGame();},{passive:false});

function startGame(){
  initAudio();
  state='playing';
  uiEl.classList.remove('active');
  uiEl.style.opacity='0';
  uiEl.style.pointerEvents='none';
  hudEl.classList.add('visible');
  gameoverEl.classList.remove('visible');
  gameoverEl.style.opacity='0';
  resetPlayer();
  initPlatforms();
  initMountains();
  letters=[];hazards=[];windCurrents=[];lanterns=[];particles=[];
  score=0;streak=0;distance=0;scrollDist=0;
  scrollSpeed=BASE_SCROLL_SPEED;lastSpeedUp=0;gameTime=0;
  bgOffset=0;
  delivered=0;
  scorePopup={text:'',x:0,y:0,life:0,vx:0,vy:-2.5*scale};
  // Place player on first platform
  if(platforms.length>0){
    player.y=platforms[0].y-player.h;
    player.onGround=true;
  }
}

function endGame(){
  state='gameover';
  hudEl.classList.remove('visible');
  finalScoreEl.textContent=score;
  finalDistEl.textContent=Math.floor(distance);
  finalDeliveredEl.textContent=delivered;
  finalBestEl.textContent=highScore;
  gameoverEl.style.opacity='1';
  gameoverEl.classList.add('visible');
}

function restartGame(){
  startGame();
}

// ─── Update ─────────────────────────────────────────────
function update(){
  if(state!=='playing')return;

  gameTime++;
  scrollDist+=scrollSpeed*scale;
  bgOffset=scrollDist;

  // Speed scaling
  const speedTier=Math.floor(distance/SPEED_INTERVAL);
  scrollSpeed=Math.min(MAX_SCROLL_SPEED,BASE_SCROLL_SPEED+speedTier*SPEED_INCREMENT);

  distance+=scrollSpeed*0.5;

  // Player input
  const wantJump=keys['Space']||keys['ArrowUp'];
  const wantDash=keys['ShiftLeft']||keys['ShiftRight']||keys['KeyX'];

  // Jump
  if(wantJump&&player.onGround&&!player.jumping){
    player.vy=JUMP_VEL*scale;
    player.onGround=false;
    player.jumping=true;
    sfxJump();
    applySquashStretch(false);
    // Jump particles
    for(let i=0;i<4;i++){
      particles.push({
        x:player.x+player.w/2,y:player.y+player.h,
        vx:rand(-1.5,1.5)*scale,vy:rand(-0.5,-2.5)*scale,
        life:1,decay:0.06,size:rand(1.5,3)*scale,color:C.paperDim
      });
    }
  }
  if(!wantJump)player.jumping=false;

  // Dash
  if(wantDash&&player.dashCooldown<=0&&!player.dashing){
    player.dashing=true;
    player.dashTimer=DASH_DURATION;
    player.dashCooldown=DASH_COOLDOWN;
    sfxDash();
  }
  if(player.dashing){
    player.dashTimer--;
    player.dashTrail.push({x:player.x,y:player.y,life:1});
    if(player.dashTrail.length>10)player.dashTrail.shift();
    if(player.dashTimer<=0)player.dashing=false;
  }
  if(player.dashCooldown>0)player.dashCooldown--;
  // Dash trail fade
  for(const t of player.dashTrail)t.life-=0.15;
  player.dashTrail=player.dashTrail.filter(t=>t.life>0);

  // Physics (dash overrides gravity)
  if(!player.dashing){
    player.vy+=GRAVITY*scale;
  } else {
    player.vy*=0.9; // slight gravity during dash
  }
  player.y+=player.vy;

  // Platform collision
  player.onGround=false;
  for(const p of platforms){
    if(player.x+player.w>p.x&&player.x<p.x+p.w){
      if(player.y+player.h>=p.y&&player.y+player.h<=p.y+p.h+10*scale&&player.vy>=0){
        // Landing squash
        if(player.y+player.h<=p.y+4*scale) applySquashStretch(true);
        player.y=p.y-player.h;
        player.vy=0;
        player.onGround=true;
      }
    }
  }

  // Fell off
  if(player.y>H+100)hitPlayer();

  // Spawning
  spawnHazard();
  spawnLetter();
  spawnWind();
  if(gameTime%120===0)spawnLantern();

  updatePlatforms();
  updateHazards();
  updateLetters();
  updateWind();
  updateLanterns();
  updateParticles();
  updateScorePopup();
  spawnRunParticles();
}

// ─── Render ─────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,W,H);

  // Screen shake
  ctx.save();
  if(shakeTimer>0){
    shakeTimer--;
    const i=shakeIntensity*(shakeTimer/25);
    ctx.translate((Math.random()-0.5)*i*scale,(Math.random()-0.5)*i*scale);
  }

  drawBackground();
  drawLanterns();
  drawPlatforms();
  drawWind();
  drawLetters();
  drawHazards();
  drawPlayer();
  drawParticles();
  drawScorePopup();

  // Flash overlay
  if(flashTimer>0){
    ctx.globalAlpha=flashTimer/15*0.18;
    ctx.fillStyle=flashColor;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
    flashTimer--;
  }

  // Dash indicator
  if(state==='playing'&&player.dashCooldown>0&&player.alive){
    ctx.globalAlpha=0.3;
    ctx.fillStyle=C.paper;
    const barW=40*scale;
    const barH=3*scale;
    ctx.fillRect(player.x,player.y+player.h+8*scale,barW,barH);
    ctx.globalAlpha=0.6;
    ctx.fillRect(player.x,player.y+player.h+8*scale,barW*(1-player.dashCooldown/DASH_COOLDOWN),barH);
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // Title screen
  if(state==='title'){
    const fade=Math.min(1,gameTime*0.012);
    titleEl.style.opacity=fade;
    titleEl.style.transform=`translateY(${lerp(20,0,fade)}px)`;
    subtitleEl.style.opacity=fade*0.7;
    subtitleEl.style.transform=`translateY(${lerp(10,0,fade)}px)`;
    startBtn.style.opacity=fade;
    startBtn.style.transform=`translateY(${lerp(10,0,fade)}px)`;
  }
}

// ─── Game Loop ──────────────────────────────────────────
let lastTime=0;
let accumulator=0;
const TICK=1000/60;

function loop(timestamp){
  if(!lastTime)lastTime=timestamp;
  const delta=Math.min(timestamp-lastTime,100);
  lastTime=timestamp;
  accumulator+=delta;
  while(accumulator>=TICK){
    update();
    accumulator-=TICK;
  }
  render();
  requestAnimationFrame(loop);
}

// ─── Init ───────────────────────────────────────────────
highScore=parseInt(localStorage.getItem('moonlitCourier_high')||'0');
gameTime=0;
initMountains();
resize();
requestAnimationFrame(loop);

</script>
