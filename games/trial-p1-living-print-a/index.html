<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Living Print — Wave Horizon</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#f5f0e8}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, DPR;
let pressDepth = 0;
let pressVel = 0;
let isPressing = false;
let breathPhase = 0;
let time = 0;

// Seeded pseudo-random for stable splatter positions
function seededRandom(seed){
  return function(){
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  };
}

// ── Mist particles ─────────────────────────────────────
const MIST_COUNT = 200;
const mist = [];

function initMist(){
  mist.length = 0;
  const rng = seededRandom(42);
  for(let i = 0; i < MIST_COUNT; i++){
    mist.push({
      x: rng() * W,
      y: H * 0.2 + rng() * H * 0.6,
      r: 25 + rng() * 100,
      vx: (rng() - 0.5) * 0.25,
      vy: (rng() - 0.5) * 0.06,
      alpha: 0.015 + rng() * 0.05,
      phase: rng() * Math.PI * 2,
      speed: 0.25 + rng() * 0.6,
      breathePhase: rng() * Math.PI * 2
    });
  }
}

// ── Wave functions (the horizon) ───────────────────────
function waveY(x, t, depth){
  const base = H * (0.52 + breathPhase * 0.015);
  const amp = (25 + depth * 20) * (H / 800);
  return base
    + Math.sin(x * 0.003 + t * 0.15) * amp
    + Math.sin(x * 0.007 - t * 0.08) * amp * 0.55
    + Math.sin(x * 0.013 + t * 0.22) * amp * 0.2;
}

function waveY2(x, t, depth){
  const base = H * (0.58 + breathPhase * 0.012);
  const amp = (20 + depth * 16) * (H / 800);
  return base
    + Math.sin(x * 0.004 - t * 0.12 + 1.5) * amp
    + Math.sin(x * 0.009 + t * 0.06) * amp * 0.5
    + Math.sin(x * 0.016 - t * 0.18 + 0.7) * amp * 0.25;
}

function waveY3(x, t, depth){
  const base = H * (0.64 + breathPhase * 0.008);
  const amp = (15 + depth * 12) * (H / 800);
  return base
    + Math.sin(x * 0.005 + t * 0.1 + 2.8) * amp
    + Math.sin(x * 0.011 - t * 0.09 + 1.2) * amp * 0.4;
}

// ── Paper grain texture ────────────────────────────────
let paperPattern = null;

function generatePaperTexture(){
  const sz = 256;
  const off = document.createElement('canvas');
  off.width = sz; off.height = sz;
  const oc = off.getContext('2d');

  // Warm paper base
  oc.fillStyle = '#f2ece2';
  oc.fillRect(0, 0, sz, sz);

  // Fiber noise — subtle warm dots
  for(let i = 0; i < 5000; i++){
    const x = Math.random() * sz;
    const y = Math.random() * sz;
    const b = 200 + Math.random() * 50;
    const a = 0.015 + Math.random() * 0.05;
    oc.fillStyle = `rgba(${b},${b-8},${b-18},${a})`;
    oc.fillRect(x, y, 0.5 + Math.random(), 0.5 + Math.random());
  }

  // Long grain fibers
  for(let i = 0; i < 250; i++){
    const x = Math.random() * sz;
    const y = Math.random() * sz;
    const len = 2 + Math.random() * 14;
    const a = 0.01 + Math.random() * 0.025;
    oc.strokeStyle = `rgba(155,148,132,${a})`;
    oc.lineWidth = 0.25 + Math.random() * 0.4;
    oc.beginPath();
    oc.moveTo(x, y);
    oc.bezierCurveTo(
      x + len * 0.3, y + (Math.random()-0.5)*1.5,
      x + len * 0.7, y + (Math.random()-0.5)*1.5,
      x + len, y + (Math.random()-0.5)*2
    );
    oc.stroke();
  }

  paperPattern = ctx.createPattern(off, 'repeat');
}

// ── Ink splatters (pre-seeded, stable positions) ───────
const splatters = [];
function initSplatters(){
  splatters.length = 0;
  const rng = seededRandom(77);
  for(let i = 0; i < 50; i++){
    splatters.push({
      nx: rng(),   // normalized x
      ny: 0.48 + rng() * 0.25,
      r: 0.5 + rng() * 2.5,
      phase: rng() * Math.PI * 2
    });
  }
}

// ── Ink wash rendering ─────────────────────────────────
function drawInkWash(waveFn, t, depth, colorBase, alpha){
  const steps = Math.max(20, Math.floor(W / 5));
  const dx = W / steps;

  // Build the wave path
  ctx.beginPath();
  ctx.moveTo(0, waveFn(0, t, depth));
  for(let i = 1; i <= steps; i++){
    ctx.lineTo(i * dx, waveFn(i * dx, t, depth));
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();

  // Ink wash gradient: dark at crest, fading into paper
  const midX = W / 2;
  const crestY = waveFn(midX, t, depth);
  const grad = ctx.createLinearGradient(0, crestY - 15, 0, H * 0.85);

  const r = parseInt(colorBase.slice(1,3),16);
  const g = parseInt(colorBase.slice(3,5),16);
  const b = parseInt(colorBase.slice(5,7),16);

  const darkA = Math.min(0.8, alpha * (0.25 + depth * 0.5));
  const midA  = darkA * 0.55;
  const fadeA = Math.min(0.25, alpha * (0.03 + depth * 0.15));

  grad.addColorStop(0,    `rgba(${r},${g},${b},${darkA})`);
  grad.addColorStop(0.25, `rgba(${r+12},${g+10},${b+8},${midA})`);
  grad.addColorStop(0.6,  `rgba(${r+35},${g+30},${b+20},${fadeA})`);
  grad.addColorStop(1,    `rgba(${r+55},${g+50},${b+35},${fadeA * 0.2})`);

  ctx.fillStyle = grad;
  ctx.fill();
}

// ── Ink line (the visible wave edge) ───────────────────
function drawInkLine(waveFn, t, depth, lineW, alpha){
  const steps = Math.max(40, Math.floor(W / 3));
  const dx = W / steps;

  ctx.beginPath();
  ctx.moveTo(0, waveFn(0, t, depth));
  for(let i = 1; i <= steps; i++){
    ctx.lineTo(i * dx, waveFn(i * dx, t, depth));
  }

  const lineA = Math.min(0.9, alpha * (0.12 + depth * 0.6));
  ctx.strokeStyle = `rgba(32,28,25,${lineA})`;
  ctx.lineWidth = lineW * (0.7 + depth * 0.5);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Ink bleed — softer, wider shadow
  const bleedA = lineA * 0.25;
  ctx.strokeStyle = `rgba(32,28,25,${bleedA})`;
  ctx.lineWidth = lineW * 3 * (0.5 + depth * 0.6);
  ctx.filter = `blur(${1.5 + depth * 1.5}px)`;
  ctx.stroke();
  ctx.filter = 'none';
}

// ── Mist layer ─────────────────────────────────────────
function drawMist(t, depth){
  for(const p of mist){
    // Drift with organic oscillation
    const sway = Math.sin(t * p.speed + p.phase) * 25;
    const driftY = Math.cos(t * p.speed * 0.35 + p.phase) * 10;
    const breathe = Math.sin(t * 0.4 + p.breathePhase) * 0.3 + 0.7;

    const px = (p.x + p.vx * t * 60 + sway + W) % W;
    const py = p.y + p.vy * t * 60 + driftY;

    // Mist density responds inversely to press depth
    const a = p.alpha * breathe * (1.0 - depth * 0.45);

    const grad = ctx.createRadialGradient(px, py, 0, px, py, p.r);
    grad.addColorStop(0,    `rgba(238,233,225,${a})`);
    grad.addColorStop(0.4,  `rgba(238,233,225,${a * 0.5})`);
    grad.addColorStop(0.7,  `rgba(238,233,225,${a * 0.15})`);
    grad.addColorStop(1,    'rgba(238,233,225,0)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Sky gradient ───────────────────────────────────────
function drawSky(depth){
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.65);

  // Sky deepens slightly when pressed (like ink soaking in)
  const r1 = 222 + depth * 12;
  const g1 = 218 + depth * 8;
  const b1 = 212 + depth * 4;

  const r2 = 212 + depth * 18;
  const g2 = 202 + depth * 12;
  const b2 = 192 + depth * 6;

  grad.addColorStop(0, `rgb(${r1},${g1},${b1})`);
  grad.addColorStop(1, `rgb(${r2},${g2},${b2})`);

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

// ── Draw splatters ─────────────────────────────────────
function drawSplatters(depth){
  if(depth < 0.05) return;
  const a = depth * 0.12;
  ctx.fillStyle = `rgba(32,28,25,${a})`;
  for(const s of splatters){
    const x = s.nx * W + Math.sin(time * 0.08 + s.phase) * 1.5;
    const y = s.ny * H;
    ctx.beginPath();
    ctx.arc(x, y, s.r * (H / 600), 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Resize ─────────────────────────────────────────────
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  generatePaperTexture();
  initMist();
  initSplatters();
}

// ── Input: baren press ─────────────────────────────────
function onPressStart(){ isPressing = true; }
function onPressEnd(){   isPressing = false; }

canvas.addEventListener('pointerdown',  e => { e.preventDefault(); onPressStart(); });
canvas.addEventListener('pointerup',    e => { onPressEnd(); });
canvas.addEventListener('pointerleave', e => { onPressEnd(); });
canvas.addEventListener('pointercancel',e => { onPressEnd(); });

document.addEventListener('keydown', e => {
  if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); onPressStart(); }
});
document.addEventListener('keyup', e => {
  if(e.code === 'Space' || e.code === 'Enter') onPressEnd();
});

// ── Audio: near-silent breath ──────────────────────────
let audioCtx = null;
let breathTimeout = null;

function initAudio(){
  if(audioCtx) return;
  try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}

function playBreath(){
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();

  const bufSize = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < bufSize; i++){
    // Soft noise shaped to sound like paper rubbing / distant wind
    d[i] = (Math.random() * 2 - 1) * 0.006;
  }

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 180;

  const gain = audioCtx.createGain();
  gain.gain.value = 0.025;

  src.connect(lp).connect(gain).connect(audioCtx.destination);
  src.start();

  // Store for cleanup
  if(!window._livingPrintAudio) window._livingPrintAudio = [];
  window._livingPrintAudio.push({ src, gain });
}

function stopBreath(){
  if(window._livingPrintAudio){
    for(const a of window._livingPrintAudio){
      try{
        a.gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5);
        a.src.stop(audioCtx.currentTime + 1.6);
      }catch(e){}
    }
    window._livingPrintAudio = [];
  }
}

let breathStarted = false;

// ── Main loop ──────────────────────────────────────────
let lastT = performance.now();

function frame(now){
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  time += dt;

  // Ambient breathing rhythm (~12s cycle)
  breathPhase = Math.sin(time * 0.25) * 0.5;

  // ── Press physics with baren-like resistance ──
  if(isPressing){
    // The deeper the press, the more resistance — slows approach to 1
    const resistance = 1.0 - pressDepth * 0.6;
    pressVel += resistance * dt * 2.0;
    pressVel = Math.min(pressVel, 0.8);
    pressDepth += pressVel * dt * 1.8 * (1.0 - pressDepth);
    pressDepth = Math.min(1, pressDepth);

    // Start breath sound on first meaningful press
    if(!breathStarted && pressDepth > 0.08){
      breathStarted = true;
      initAudio();
      playBreath();
    }
  } else {
    // Release: ink recedes with a gentle exhale
    pressVel *= Math.pow(0.02, dt);
    pressDepth -= (pressVel + 0.12) * dt * 1.5;
    pressDepth = Math.max(0, pressDepth);
    if(pressDepth < 0.001) pressDepth = 0;
  }

  // ── Render ──
  // 1. Sky
  drawSky(pressDepth);

  // 2. Paper texture overlay
  if(paperPattern){
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = paperPattern;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // 3. Mist (atmosphere layer, behind waves)
  drawMist(time, pressDepth);

  // 4. Wave wash layers (back → front)
  drawInkWash(waveY3, time, pressDepth, '#2a2522', 0.28);
  drawInkWash(waveY2, time, pressDepth, '#282320', 0.48);
  drawInkWash(waveY,  time, pressDepth, '#25201e', 0.68);

  // 5. Wave ink lines
  drawInkLine(waveY,  time, pressDepth, 1.8, 1.0);
  drawInkLine(waveY2, time, pressDepth, 1.1, 0.65);
  drawInkLine(waveY3, time, pressDepth, 0.7, 0.35);

  // 6. Ink splatters (woodblock print texture)
  drawSplatters(pressDepth);

  // 7. Vignette — subtle warm edge darkening
  const vig = ctx.createRadialGradient(W/2, H/2, W*0.2, W/2, H/2, W*0.72);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, `rgba(18,16,12,${0.06 + pressDepth * 0.06})`);
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}

// ── Boot ───────────────────────────────────────────────
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
