<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>鯉の呼吸 — Koi Breath</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #f5f0e6;
    font-family: 'Noto Serif JP', 'Yu Mincho', serif;
    cursor: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }
  #hint {
    position: fixed;
    bottom: 12%;
    left: 0; right: 0;
    text-align: center;
    color: #5a5448;
    font-size: clamp(12px, 2.2vw, 18px);
    letter-spacing: 0.15em;
    opacity: 0.6;
    pointer-events: none;
    transition: opacity 3s ease;
    z-index: 10;
  }
  #hint.hidden { opacity: 0; }
  #bloom-count {
    position: fixed;
    top: 24px;
    right: 28px;
    color: #4a4238;
    font-size: clamp(11px, 1.5vw, 14px);
    letter-spacing: 0.1em;
    opacity: 0.35;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="pond"></canvas>
<div id="hint">Press and hold gently to breathe ink into the water</div>
<div id="bloom-count"></div>

<script>
(() => {
  "use strict";

  // ─── Canvas Setup ────────────────────────────────────
  const canvas = document.getElementById("pond");
  const ctx = canvas.getContext("2d");
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ─── Constants ───────────────────────────────────────
  const PAPER_R = 245, PAPER_G = 238, PAPER_B = 226;
  const INK_BASE_R = 18, INK_BASE_G = 16, INK_BASE_B = 22;
  const INK_BLUE_R = 22, INK_BLUE_G = 28, INK_BLUE_B = 55;
  const INK_RED_R = 65, INK_RED_G = 35, INK_RED_B = 32;

  // Bloom timing thresholds
  const BLOOM_THRESHOLD = 350; // ms of steady hold before bloom starts
  const BLOOM_MAX = 6000;      // ms before bloom reaches max size
  const TAP_MAX_DURATION = 250; // max press duration to count as tap

  // ─── State ───────────────────────────────────────────
  let blooms = [];
  let koi = [];
  let ripples = [];
  let mistParticles = [];
  let activeBloom = null; // currently growing bloom
  let pressStartTime = 0;
  let pressPos = { x: 0, y: 0 };
  let isPressing = false;
  let bloomCount = 0;
  let hintHidden = false;
  let totalHoldTime = 0;
  let lastPressStart = 0;
  let rapidTapCount = 0;
  let lastTapTime = 0;

  // ─── Utility ─────────────────────────────────────────
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

  // ─── Ink Bloom ───────────────────────────────────────
  class Bloom {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.age = 0;
      this.maxAge = rand(8000, 15000);
      this.type = this.pickType();
      this.maxRadius = this.type === "red" ? rand(80, 180) : rand(100, 250);
      this.currentRadius = 0;
      this.opacity = 0;
      this.fading = false;
      this.done = false;
      this.inkColor = this.pickColor();
      this.seeds = this.generateSeeds();
      this.wobblePhase = rand(0, Math.PI * 2);
    }

    pickType() {
      const r = Math.random();
      if (r < 0.5) return "ink";
      if (r < 0.78) return "blue";
      return "red";
    }

    pickColor() {
      if (this.type === "red") return { r: INK_RED_R, g: INK_RED_G, b: INK_RED_B };
      if (this.type === "blue") return { r: INK_BLUE_R, g: INK_BLUE_G, b: INK_BLUE_B };
      return { r: INK_BASE_R, g: INK_BASE_G, b: INK_BASE_B };
    }

    generateSeeds() {
      const count = Math.floor(rand(5, 15));
      const seeds = [];
      for (let i = 0; i < count; i++) {
        seeds.push({
          angle: rand(0, Math.PI * 2),
          speed: rand(0.0003, 0.0015),
          offset: rand(5, 40),
          scale: rand(0.3, 0.9),
          wobble: rand(0, Math.PI * 2)
        });
      }
      return seeds;
    }

    update(dt) {
      this.age += dt;
      const lifeRatio = this.age / this.maxAge;

      if (lifeRatio < 0.15) {
        // Growing phase
        const t = easeInOutCubic(lifeRatio / 0.15);
        this.currentRadius = this.maxRadius * t;
        this.opacity = lifeRatio / 0.15 * 0.6;
      } else if (lifeRatio < 0.4) {
        // Peak
        this.currentRadius = this.maxRadius;
        this.opacity = 0.6 - (lifeRatio - 0.15) / 0.25 * 0.1;
      } else if (lifeRatio < 0.85) {
        // Slow fade
        this.fading = true;
        const fadeT = (lifeRatio - 0.4) / 0.45;
        this.currentRadius = this.maxRadius * (1 + fadeT * 0.3);
        this.opacity = 0.5 * (1 - fadeT * fadeT);
      } else {
        // Final fade to nothing
        const endT = (lifeRatio - 0.85) / 0.15;
        this.opacity = 0.15 * (1 - endT);
        this.currentRadius = this.maxRadius * (1.3 + endT * 0.4);
        if (endT >= 1) this.done = true;
      }

      this.wobblePhase += dt * 0.0008;
    }

    draw(ctx) {
      if (this.opacity <= 0.005) return;

      const c = this.inkColor;
      ctx.save();
      ctx.globalAlpha = this.opacity;

      // Main body
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.currentRadius);
      grad.addColorStop(0, `rgba(${c.r + 8},${c.g + 6},${c.b + 12},1)`);
      grad.addColorStop(0.3, `rgba(${c.r + 4},${c.g + 3},${c.b + 6},0.8)`);
      grad.addColorStop(0.7, `rgba(${c.r},${c.g},${c.b},0.4)`);
      grad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);

      ctx.fillStyle = grad;

      // Organic blob shape
      ctx.beginPath();
      const segments = 64;
      for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        const wobble = Math.sin(angle * 5 + this.wobblePhase) * 0.06 +
                       Math.sin(angle * 3 - this.wobblePhase * 1.3) * 0.04;
        const r = this.currentRadius * (1 + wobble);
        const px = this.x + Math.cos(angle) * r;
        const py = this.y + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      // Ink tendrils (seeds)
      for (const seed of this.seeds) {
        const angle = seed.angle + seed.wobble + Math.sin(this.wobblePhase + seed.wobble) * 0.3;
        const dist = seed.offset * (this.currentRadius / this.maxRadius);
        const tx = this.x + Math.cos(angle) * dist;
        const ty = this.y + Math.sin(angle) * dist;
        const tr = this.currentRadius * 0.15 * seed.scale;

        const seedGrad = ctx.createRadialGradient(tx, ty, 0, tx, ty, tr);
        seedGrad.addColorStop(0, `rgba(${c.r + 5},${c.g + 4},${c.b + 8},0.5)`);
        seedGrad.addColorStop(1, `rgba(${c.r},${c.g},${c.b},0)`);
        ctx.fillStyle = seedGrad;
        ctx.beginPath();
        ctx.arc(tx, ty, tr, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ink vein lines
      ctx.strokeStyle = `rgba(${c.r + 12},${c.g + 10},${c.b + 18},0.15)`;
      ctx.lineWidth = 0.8;
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 + this.wobblePhase * 0.5;
        ctx.beginPath();
        const startX = this.x + Math.cos(angle) * this.currentRadius * 0.2;
        const startY = this.y + Math.sin(angle) * this.currentRadius * 0.2;
        const cp1x = this.x + Math.cos(angle + 0.3) * this.currentRadius * 0.5;
        const cp1y = this.y + Math.sin(angle + 0.3) * this.currentRadius * 0.5;
        const endX = this.x + Math.cos(angle - 0.2) * this.currentRadius * (0.7 + Math.sin(this.wobblePhase) * 0.15);
        const endY = this.y + Math.sin(angle - 0.2) * this.currentRadius * (0.7 + Math.cos(this.wobblePhase) * 0.15);
        ctx.moveTo(startX, startY);
        ctx.bezierCurveTo(cp1x, cp1y, endX, endY, endX * 1.05, endY * 1.05);
        ctx.stroke();
      }

      ctx.restore();
    }
  }

  // ─── Koi Fish ────────────────────────────────────────
  class Koi {
    constructor() {
      this.reset();
    }

    reset() {
      const side = Math.floor(Math.random() * 4);
      const margin = 60;
      switch (side) {
        case 0: this.x = rand(-margin, W + margin); this.y = rand(H * 0.2, H * 0.8); break;
        case 1: this.x = rand(-margin, W + margin); this.y = rand(H * 0.2, H * 0.8); break;
        case 2: this.x = rand(W * 0.2, W * 0.8); this.y = rand(-margin, H * 0.2); break;
        case 3: this.x = rand(W * 0.2, W * 0.8); this.y = rand(H * 0.8, H + margin); break;
      }
      const angle = rand(0, Math.PI * 2);
      const speed = rand(0.3, 1.2);
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.size = rand(15, 35);
      this.tailPhase = rand(0, Math.PI * 2);
      this.tailSpeed = rand(0.03, 0.06);
      this.turnRate = rand(-0.003, 0.003);
      this.turnTimer = rand(60, 240);
      this.opacity = rand(0.3, 0.7);
      this.color = this.pickColor();
      this.wanderRadius = rand(100, 300);
      this.wanderCenter = { x: this.x, y: this.y };
    }

    pickColor() {
      const r = Math.random();
      if (r < 0.35) return "white";
      if (r < 0.55) return "orange";
      if (r < 0.75) return "red";
      if (r < 0.9) return "gold";
      return "black";
    }

    getColorStr() {
      switch (this.color) {
        case "white": return { body: `rgba(240,235,225,${this.opacity})`, spot: `rgba(180,50,40,0.4)`, fin: `rgba(220,210,195,${this.opacity * 0.6})` };
        case "orange": return { body: `rgba(210,120,60,${this.opacity})`, spot: `rgba(40,35,30,0.3)`, fin: `rgba(190,100,50,${this.opacity * 0.5})` };
        case "red": return { body: `rgba(160,50,40,${this.opacity})`, spot: `rgba(240,235,225,0.3)`, fin: `rgba(140,40,35,${this.opacity * 0.5})` };
        case "gold": return { body: `rgba(200,170,80,${this.opacity})`, spot: `rgba(180,40,35,0.35)`, fin: `rgba(180,150,70,${this.opacity * 0.5})` };
        case "black": return { body: `rgba(40,35,30,${this.opacity})`, spot: `rgba(200,60,50,0.3)`, fin: `rgba(35,30,25,${this.opacity * 0.5})` };
      }
    }

    update(dt, blooms) {
      this.tailPhase += dt * this.tailSpeed;
      this.turnTimer -= dt;

      // Avoid blooms (ink repels koi gently)
      let avgInkPressure = 0;
      for (const bloom of blooms) {
        const dx = this.x - bloom.x;
        const dy = this.y - bloom.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bloom.currentRadius + 40 && bloom.opacity > 0.1) {
          avgInkPressure += (1 - dist / (bloom.currentRadius + 40)) * bloom.opacity;
        }
      }
      avgInkPressure = Math.min(avgInkPressure, 1);

      if (this.turnTimer <= 0) {
        this.turnRate += rand(-0.008, 0.008);
        this.turnRate = clamp(this.turnRate, -0.015, 0.015);
        this.turnTimer = rand(80, 300);
      }

      // Ink pressure slows koi
      const speedMult = 1 - avgInkPressure * 0.6;

      // Gentle wandering
      const toCenterX = this.wanderCenter.x - this.x;
      const toCenterY = this.wanderCenter.y - this.y;
      const distToCenter = Math.sqrt(toCenterX * toCenterX + toCenterY * toCenterY);
      if (distToCenter > this.wanderRadius) {
        this.turnRate += rand(-0.01, 0.01);
        this.wanderCenter.x = this.x + rand(-200, 200);
        this.wanderCenter.y = this.y + rand(-200, 200);
      }

      // Repel from ink
      if (avgInkPressure > 0.05) {
        for (const bloom of blooms) {
          const dx = this.x - bloom.x;
          const dy = this.y - bloom.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bloom.currentRadius + 60 && dist > 0) {
            this.turnRate += ((dy / dist) * 0.005) * avgInkPressure;
            this.turnRate += ((-dx / dist) * 0.003) * avgInkPressure;
          }
        }
      }

      this.vx += Math.cos(Math.atan2(this.vy, this.vx) + this.turnRate) * 0.01;
      this.vy += Math.sin(Math.atan2(this.vy, this.vx) + this.turnRate) * 0.01;

      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      const targetSpeed = 0.6 * speedMult;
      if (speed > 0.01) {
        this.vx = (this.vx / speed) * lerp(speed, targetSpeed, 0.02);
        this.vy = (this.vy / speed) * lerp(speed, targetSpeed, 0.02);
      }

      this.x += this.vx;
      this.y += this.vy;

      // Wrap around edges
      const margin = 80;
      if (this.x < -margin) this.x = W + margin;
      if (this.x > W + margin) this.x = -margin;
      if (this.y < -margin) this.y = H + margin;
      if (this.y > H + margin) this.y = -margin;
    }

    draw(ctx) {
      const angle = Math.atan2(this.vy, this.vx);
      const s = this.size;
      const colors = this.getColorStr();
      const tailWag = Math.sin(this.tailPhase) * 0.4;

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(angle);

      // Tail
      ctx.save();
      ctx.translate(-s * 0.7, 0);
      ctx.rotate(tailWag);
      ctx.fillStyle = colors.fin;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-s * 0.4, -s * 0.25, -s * 0.7, -s * 0.35);
      ctx.quadraticCurveTo(-s * 0.3, 0, -s * 0.7, s * 0.35);
      ctx.quadraticCurveTo(-s * 0.4, s * 0.25, 0, 0);
      ctx.fill();
      ctx.restore();

      // Body
      ctx.fillStyle = colors.body;
      ctx.beginPath();
      ctx.ellipse(0, 0, s, s * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();

      // Spots
      if (colors.spot) {
        ctx.fillStyle = colors.spot;
        ctx.beginPath();
        ctx.ellipse(-s * 0.15, -s * 0.1, s * 0.35, s * 0.22, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(s * 0.2, s * 0.15, s * 0.18, s * 0.12, -0.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Fin
      ctx.fillStyle = colors.fin;
      ctx.beginPath();
      ctx.moveTo(s * 0.1, -s * 0.15);
      ctx.quadraticCurveTo(-s * 0.1, -s * 0.5, -s * 0.4, -s * 0.35);
      ctx.quadraticCurveTo(-s * 0.2, -s * 0.15, s * 0.1, -s * 0.1);
      ctx.fill();

      // Eye
      ctx.fillStyle = "rgba(30,25,20,0.7)";
      ctx.beginPath();
      ctx.arc(s * 0.55, -s * 0.05, s * 0.06, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
  }

  // ─── Ripple ──────────────────────────────────────────
  class Ripple {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.radius = 0;
      this.maxRadius = rand(30, 80);
      this.opacity = rand(0.15, 0.35);
      this.done = false;
    }

    update(dt) {
      this.radius += dt * 0.04;
      const t = this.radius / this.maxRadius;
      this.opacity = (1 - t) * (1 - t) * 0.3;
      if (t >= 1) this.done = true;
    }

    draw(ctx) {
      if (this.opacity <= 0.005) return;
      ctx.save();
      ctx.strokeStyle = `rgba(180,175,165,${this.opacity})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(this.x, this.y, this.radius, this.radius * 0.4, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ─── Mist ────────────────────────────────────────────
  class MistParticle {
    constructor() {
      this.reset();
    }

    reset() {
      this.x = rand(-100, W + 100);
      this.y = rand(-50, H * 0.35);
      this.vx = rand(0.05, 0.3);
      this.vy = rand(-0.02, 0.02);
      this.size = rand(60, 200);
      this.opacity = rand(0.02, 0.06);
      this.phase = rand(0, Math.PI * 2);
    }

    update(dt) {
      this.x += this.vx * dt * 0.05;
      this.y += this.vy * dt * 0.05;
      this.phase += dt * 0.001;
      if (this.x > W + this.size) this.reset();
    }

    draw(ctx) {
      const o = this.opacity * (0.7 + Math.sin(this.phase) * 0.3);
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
      grad.addColorStop(0, `rgba(230,225,215,${o})`);
      grad.addColorStop(1, `rgba(230,225,215,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ─── Initialize ──────────────────────────────────────
  for (let i = 0; i < 8; i++) koi.push(new Koi());
  for (let i = 0; i < 6; i++) mistParticles.push(new MistParticle());

  // ─── Press Detection ─────────────────────────────────
  function onPointerDown(x, y) {
    isPressing = true;
    pressStartTime = performance.now();
    pressPos = { x, y };
    lastPressStart = performance.now();

    if (!hintHidden) {
      hintHidden = true;
      document.getElementById("hint").classList.add("hidden");
    }

    // Check for rapid tapping
    const now = performance.now();
    if (now - lastTapTime < 400 && rapidTapCount > 2) {
      // Too frantic — ignore this press
      isPressing = false;
      return;
    }
    rapidTapCount++;
    lastTapTime = now;
    setTimeout(() => { rapidTapCount = 0; }, 2000);
  }

  function onPointerMove(x, y) {
    if (!isPressing) return;
    const dx = x - pressPos.x;
    const dy = y - pressPos.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 20) {
      // Too much movement — stop blooming
      isPressing = false;
      return;
    }
    // Update press pos slightly for continuous bloom
    pressPos = { x, y };
  }

  function onPointerUp() {
    if (!isPressing) return;
    const holdDuration = performance.now() - pressStartTime;
    isPressing = false;

    if (holdDuration >= BLOOM_THRESHOLD && holdDuration <= BLOOM_MAX) {
      // Create a new bloom
      const bloom = new Bloom(pressPos.x, pressPos.y);
      // Start it partially grown based on hold duration
      bloom.age = holdDuration * 0.3;
      blooms.push(bloom);
      bloomCount++;

      // Create ripple at press point
      ripples.push(new Ripple(pressPos.x, pressPos.y));

      // Update count display
      document.getElementById("bloom-count").textContent =
        `${bloomCount} 花`;
    }
    // If hold was too short (< threshold), nothing happens — that's the point
  }

  // ─── Input Handling ──────────────────────────────────
  canvas.addEventListener("mousedown", (e) => onPointerDown(e.clientX, e.clientY));
  canvas.addEventListener("mousemove", (e) => onPointerMove(e.clientX, e.clientY));
  canvas.addEventListener("mouseup", onPointerUp);
  canvas.addEventListener("mouseleave", onPointerUp);

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    const t = e.touches[0];
    onPointerDown(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    const t = e.touches[0];
    onPointerMove(t.clientX, t.clientY);
  }, { passive: false });
  canvas.addEventListener("touchend", (e) => {
    e.preventDefault();
    onPointerUp();
  }, { passive: false });
  canvas.addEventListener("touchcancel", onPointerUp);

  // ─── Continuous Bloom During Press ───────────────────
  let lastContinuousBloom = 0;

  function updateContinuousBloom(now) {
    if (!isPressing) return;
    const holdDuration = now - pressStartTime;

    // If holding too long, stop
    if (holdDuration > BLOOM_MAX) {
      isPressing = false;
      return;
    }

    // Slowly create blooms while holding (patient press)
    if (holdDuration >= BLOOM_THRESHOLD && now - lastContinuousBloom > 1200) {
      const bloom = new Bloom(pressPos.x, pressPos.y);
      bloom.age = (holdDuration - BLOOM_THRESHOLD) * 0.2;
      blooms.push(bloom);
      bloomCount++;
      lastContinuousBloom = now;
      ripples.push(new Ripple(pressPos.x, pressPos.y));
      document.getElementById("bloom-count").textContent = `${bloomCount} 花`;
    }
  }

  // ─── Background Water Texture ────────────────────────
  function drawBackground() {
    // Paper base
    ctx.fillStyle = `rgb(${PAPER_R},${PAPER_G},${PAPER_B})`;
    ctx.fillRect(0, 0, W, H);

    // Subtle paper texture (noise)
    ctx.save();
    ctx.globalAlpha = 0.03;
    for (let i = 0; i < 200; i++) {
      const x = (i * 137.5) % W;
      const y = (i * 89.3) % H;
      const s = rand(1, 3);
      ctx.fillStyle = i % 2 === 0 ? "#000" : "#8B7D6B";
      ctx.fillRect(x, y, s, s);
    }
    ctx.restore();

    // Water tint gradient
    const waterGrad = ctx.createLinearGradient(0, 0, 0, H);
    waterGrad.addColorStop(0, "rgba(210,205,195,0.15)");
    waterGrad.addColorStop(0.5, "rgba(180,185,195,0.08)");
    waterGrad.addColorStop(1, "rgba(160,170,190,0.12)");
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, 0, W, H);

    // Subtle depth lines (water surface tension)
    ctx.save();
    ctx.strokeStyle = "rgba(170,168,160,0.06)";
    ctx.lineWidth = 0.5;
    for (let i = 0; i < 12; i++) {
      const y = H * 0.15 + i * (H * 0.07);
      ctx.beginPath();
      for (let x = 0; x <= W; x += 20) {
        const wave = Math.sin(x * 0.008 + i * 1.2 + performance.now() * 0.0003) * 3;
        if (x === 0) ctx.moveTo(x, y + wave);
        else ctx.lineTo(x, y + wave);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // ─── Cursor ──────────────────────────────────────────
  function drawCursor(x, y) {
    if (!isPressing) return;
    const holdDuration = performance.now() - pressStartTime;
    const growT = clamp(holdDuration / BLOOM_THRESHOLD, 0, 1);
    const radius = 8 + growT * 20;
    const opacity = 0.15 + growT * 0.15;

    ctx.save();
    ctx.strokeStyle = `rgba(60,55,48,${opacity})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.stroke();

    // Inner dot
    ctx.fillStyle = `rgba(60,55,48,${opacity * 0.5})`;
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ─── Ink Vignette (overall bloom beauty) ─────────────
  function drawInkVignette() {
    // As total bloom count increases, add a subtle ink wash around edges
    if (bloomCount === 0) return;
    const intensity = Math.min(bloomCount / 15, 1) * 0.15;
    const grad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    grad.addColorStop(0, "rgba(20,18,25,0)");
    grad.addColorStop(1, `rgba(20,18,25,${intensity})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // ─── Animation Loop ──────────────────────────────────
  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min(now - lastTime, 50); // cap at 50ms
    lastTime = now;

    // Update
    updateContinuousBloom(now);

    for (const bloom of blooms) bloom.update(dt);
    blooms = blooms.filter(b => !b.done);

    for (const k of koi) k.update(dt, blooms);
    for (const r of ripples) r.update(dt);
    ripples = ripples.filter(r => !r.done);
    for (const m of mistParticles) m.update(dt);

    // Draw
    drawBackground();
    drawInkVignette();

    // Draw blooms (behind koi, since ink is on water surface)
    for (const bloom of blooms) bloom.draw(ctx);

    // Draw ripples
    for (const ripple of ripples) ripple.draw(ctx);

    // Draw koi (beneath the ink)
    for (const k of koi) k.draw(ctx);

    // Draw mist (foreground)
    for (const m of mistParticles) m.draw(ctx);

    // Draw cursor
    if (isPressing) drawCursor(pressPos.x, pressPos.y);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

})();
</script>
