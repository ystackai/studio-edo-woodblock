<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edo Inkblade: The Road Opens</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#15110d;color:#f3ead8;font-family:Georgia,"Times New Roman",serif}#wrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#403022 0,#201712 48%,#0d0b0a 100%)}canvas{width:min(100vw,1180px);height:min(100vh,760px);max-height:100vh;background:#21170f;box-shadow:0 20px 80px #000b}.hud{position:fixed;left:18px;top:14px;right:18px;display:flex;justify-content:space-between;gap:14px;pointer-events:none;font:16px/1.35 system-ui,sans-serif;color:#fff6e4;text-shadow:0 2px 8px #000}.panel{background:rgba(18,12,8,.65);border:1px solid rgba(255,238,196,.24);padding:10px 12px;border-radius:6px;backdrop-filter:blur(5px)}#center{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;font-family:system-ui,sans-serif}#center div{max-width:620px;padding:22px 26px;background:rgba(10,7,5,.78);border:1px solid rgba(255,239,201,.28);border-radius:8px;box-shadow:0 20px 80px #000c}#center h1{margin:0 0 10px;font-size:32px;letter-spacing:0}#center p{margin:8px 0;color:#eadbc4}#center.hidden{display:none}kbd{background:#eadbc4;color:#18110c;border-radius:4px;padding:1px 5px;font-weight:700}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1180" height="760"></canvas></div>
<div class="hud"><div class="panel" id="status"></div><div class="panel">Move <kbd>WASD</kbd>/<kbd>Arrows</kbd> · Slash <kbd>Space</kbd></div></div>
<div id="center"><div><h1>Edo Inkblade</h1><p>Defeat the road guard. When the gate opens, walk north through the moonlit road.</p><p>Click or press any movement key to begin.</p></div></div>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),center=document.getElementById('center'),keys=new Set(),W=canvas.width,H=canvas.height;let started=false,won=false,lost=false,last=performance.now(),shake=0;const player={x:W/2,y:H-112,hp:100,facing:-1,slash:0,cool:0,inv:0},guard={x:W/2,y:283,hp:3,maxHp:3,hit:0,cool:0,alive:true,phase:0},gate={open:false,openness:0},petals=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2,v:.15+Math.random()*.45,a:Math.random()*6.28}));function reset(){Object.assign(player,{x:W/2,y:H-112,hp:100,facing:-1,slash:0,cool:0,inv:0});Object.assign(guard,{x:W/2,y:283,hp:3,alive:true,hit:0,cool:0,phase:0});Object.assign(gate,{open:false,openness:0});won=false;lost=false;started=true;center.classList.add('hidden')}addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','W','A','S','D'].includes(e.key))e.preventDefault();if(!started||won||lost){reset();return}keys.add(e.key.toLowerCase());if(e.code==='Space')slash()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));canvas.addEventListener('pointerdown',()=>{if(!started||won||lost)reset();else slash()});function slash(){if(player.cool<=0){player.slash=.18;player.cool=.42;const dx=guard.x-player.x,dy=guard.y-player.y,d=Math.hypot(dx,dy);if(guard.alive&&d<82&&dy<40){guard.hp--;guard.hit=.22;shake=8;if(guard.hp<=0){guard.alive=false;gate.open=true}}}}function update(dt){if(!started||won||lost)return;player.cool=Math.max(0,player.cool-dt);player.slash=Math.max(0,player.slash-dt);player.inv=Math.max(0,player.inv-dt);guard.hit=Math.max(0,guard.hit-dt);shake=Math.max(0,shake-25*dt);let vx=0,vy=0;if(keys.has('a')||keys.has('arrowleft'))vx--;if(keys.has('d')||keys.has('arrowright'))vx++;if(keys.has('w')||keys.has('arrowup'))vy--;if(keys.has('s')||keys.has('arrowdown'))vy++;const len=Math.hypot(vx,vy)||1;vx/=len;vy/=len;if(vy)player.facing=Math.sign(vy);player.x=Math.max(72,Math.min(W-72,player.x+vx*230*dt));player.y=Math.max(120,Math.min(H-72,player.y+vy*230*dt));if(!gate.open&&player.y<228&&Math.abs(player.x-W/2)<210)player.y=228;gate.openness+=((gate.open?1:0)-gate.openness)*Math.min(1,dt*3.5);if(guard.alive){guard.phase+=dt;const dx=player.x-guard.x,dy=player.y-guard.y,d=Math.hypot(dx,dy),alert=d<310;if(alert){guard.x+=dx/(d||1)*118*dt;guard.y+=dy/(d||1)*118*dt}else guard.x=W/2+Math.sin(guard.phase*1.4)*95;guard.cool=Math.max(0,guard.cool-dt);if(d<48&&guard.cool<=0){guard.cool=1.1;if(player.inv<=0){player.hp-=18;player.inv=.55;shake=10;if(player.hp<=0){lost=true;showEnd('The road remains closed','Press any key to try again.')}}}}if(gate.open&&player.y<92&&Math.abs(player.x-W/2)<230){won=true;showEnd('The road opens','You crossed the pass. The next build should deepen this into a real journey.')}}function showEnd(title,msg){center.innerHTML=`<div><h1>${title}</h1><p>${msg}</p><p>Press any key to restart.</p></div>`;center.classList.remove('hidden')}function draw(){ctx.save();const ox=(Math.random()-.5)*shake,oy=(Math.random()-.5)*shake;ctx.translate(ox,oy);drawWorld();drawRoad();drawGate();drawActors();drawInk();ctx.restore();statusEl.textContent=`${gate.open?'Gate open: enter the road':'Defeat the guard to open the road'} | HP ${Math.max(0,Math.round(player.hp))} | Guard ${Math.max(0,guard.hp)}/${guard.maxHp}`}function drawWorld(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d1a24');g.addColorStop(.5,'#3a2417');g.addColorStop(1,'#18100c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f5df9a';ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(W-120,98,52,0,7);ctx.fill();ctx.globalAlpha=1;for(const p of petals){p.y+=p.v;p.x+=Math.sin(p.y*.01+p.a)*.25;if(p.y>H+10){p.y=-10;p.x=Math.random()*W}ctx.fillStyle='rgba(238,185,157,.55)';ctx.beginPath();ctx.ellipse(p.x,p.y,p.s*2,p.s,Math.sin(p.a),0,7);ctx.fill()}ctx.fillStyle='rgba(0,0,0,.24)';for(let i=0;i<8;i++){ctx.beginPath();ctx.ellipse(90+i*145,H-42,80,18,0,0,7);ctx.fill()}}function drawRoad(){ctx.fillStyle='#8d6d48';ctx.beginPath();ctx.moveTo(W/2-56,H);ctx.lineTo(W/2+56,H);ctx.lineTo(W/2+230,0);ctx.lineTo(W/2-230,0);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,239,200,.28)';ctx.lineWidth=4;ctx.setLineDash([20,18]);ctx.beginPath();ctx.moveTo(W/2,H);ctx.lineTo(W/2,0);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(0,0,0,.22)';if(!gate.open)ctx.fillRect(W/2-230,105,460,130)}function drawGate(){const open=gate.openness;ctx.save();ctx.translate(W/2,154);ctx.fillStyle='#27140c';ctx.fillRect(-270,-44,540,28);ctx.fillRect(-254,-66,38,154);ctx.fillRect(216,-66,38,154);ctx.fillStyle='#7d321c';ctx.fillRect(-255,-38,510,18);ctx.fillStyle='#a44926';const leftW=190*(1-open),rightW=190*(1-open);ctx.fillRect(-202,-14,leftW,96);ctx.fillRect(202-rightW,-14,rightW,96);ctx.strokeStyle='#22110b';ctx.lineWidth=4;ctx.strokeRect(-202,-14,leftW,96);ctx.strokeRect(202-rightW,-14,rightW,96);ctx.fillStyle=gate.open?'#d8c487':'#f0dd9b';ctx.font='700 22px system-ui';ctx.textAlign='center';ctx.fillText(gate.open?'ROAD OPEN':'ROAD CLOSED',0,-52);ctx.restore()}function drawActors(){if(guard.alive)drawFigure(guard.x,guard.y,'#1b1714','#c7472b',guard.hit,'GUARD');else{ctx.fillStyle='rgba(20,10,7,.45)';ctx.beginPath();ctx.ellipse(guard.x,guard.y+22,42,13,0,0,7);ctx.fill()}drawFigure(player.x,player.y,player.inv>0?'#fff3d7':'#0f1014','#2a8d87',player.slash,'YOU');if(player.slash>0){ctx.strokeStyle='rgba(255,246,208,.9)';ctx.lineWidth=9;ctx.beginPath();ctx.arc(player.x,player.y-8,62,-Math.PI*.92,-Math.PI*.08);ctx.stroke()}}function drawFigure(x,y,body,accent,flash,label){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,25,36,11,0,0,7);ctx.fill();ctx.fillStyle=flash>0?'#fff2d0':body;ctx.beginPath();ctx.arc(0,-25,13,0,7);ctx.fill();ctx.fillRect(-15,-14,30,45);ctx.fillStyle=accent;ctx.fillRect(-22,-8,44,8);ctx.strokeStyle='#ede2cf';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(16,-1);ctx.lineTo(45,-34);ctx.stroke();ctx.fillStyle='#f5ead6';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillText(label,0,50);ctx.restore()}function drawInk(){ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;for(let i=0;i<16;i++){ctx.beginPath();ctx.moveTo(40+i*76,0);ctx.quadraticCurveTo(20+i*76,H*.45,55+i*76,H);ctx.stroke()}}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script>
</body>
</html>
