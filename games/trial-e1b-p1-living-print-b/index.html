<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Living Print</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #d4c5a9;
  touch-action: none;
    -webkit-tap-highlight-color: transparent;
}
canvas {
  display: block;
  width: 100%; height: 100%;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
     'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

    // --- Palette: ukiyo-e ink on warm paper ---
  var PAPER = { r: 212, g: 197, b: 169 };
  var INK = { r: 26, g: 28, b: 50 };
  var INK_LIGHT = { r: 60, g: 62, b: 85 };
  var MIST_FAR = { r: 228, g: 222, b: 212 };
  var MIST_NEAR = { r: 240, g: 236, b: 228 };

  var W, H, dpr;
  var paperImg = null;
  var pressDepth = 0;
  var pressX = 0, pressY = 0;
  var isPressing = false;
  var globalTime = 0;
  var lastTimestamp = 0;

    // --- Single wave-form horizon ---
  var wave = {
    baseY: 0, amplitude: 0, frequency: 0, phase: 0,
    secondaryFreq: 0, secondaryAmp: 0,
    pressBoost: 0
    };

    // --- Mist particles (primary expressive material) ---
  var mistParticles = [];

    // --- Ripple rings from press ---
  var pressRipples = [];

    // --- Ink splatters (print texture) ---
  var splatters = [];

    // --- Mist "blobs" that react to press ---
  var mistRipples = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    wave.baseY = H * 0.52;
    wave.amplitude = H * 0.07;
    wave.frequency = 0.0035;
    wave.secondaryFreq = 0.008;
    wave.secondaryAmp = H * 0.018;

    generatePaperGrain();
    }

  function generatePaperGrain() {
    var imgData = ctx.createImageData(W * dpr, H * dpr);
    var data = imgData.data;
    for (var i = 0; i < data.length; i += 4) {
      var noise = (Math.random() - 0.5) * 14;
      var warmth = (Math.random() - 0.5) * 6;
      data[i] = Math.min(255, Math.max(0, PAPER.r + noise + warmth));
      data[i + 1] = Math.min(255, Math.max(0, PAPER.g + noise + warmth * 0.4));
      data[i + 2] = Math.min(255, Math.max(0, PAPER.b + noise * 0.7));
      data[i + 3] = 255;
      }
    paperImg = ctx.createImageData(W * dpr, H * dpr);
    for (var j = 0; j < data.length; j++) paperImg.data[j] = data[j];

    splatters = [];
    var count = Math.floor(W * H / 18000);
    for (var k = 0; k < count; k++) {
      splatters.push({
        x: Math.random() * W,
        y: wave.baseY + (Math.random() - 0.35) * H * 0.35,
        r: 0.8 + Math.random() * 2.5,
        a: 0.015 + Math.random() * 0.05
        });
      }
    }

  function initMist() {
    mistParticles = [];
    for (var i = 0; i < 45; i++) {
      mistParticles.push({
        x: Math.random() * (W + 600) - 300,
        y: H * 0.06 + Math.random() * H * 0.7,
        radius: 70 + Math.random() * 200,
        speed: 0.08 + Math.random() * 0.4,
        alpha: 0.015 + Math.random() * 0.05,
        phase: Math.random() * Math.PI * 2,
        driftY: (Math.random() - 0.5) * 0.04,
        breath: Math.random() * Math.PI * 2,
        layer: Math.random() < 0.4 ? 0 : 1,
        color: Math.random() < 0.5 ? MIST_FAR : MIST_NEAR
        });
      }

    mistRipples = [];
    }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
    }

  function easeOutExpo(t) {
    return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    }

  function getWaveY(x, time, pressEffect) {
    var primary = Math.sin(x * wave.frequency + wave.phase + time * 0.12) * wave.amplitude;
    var secondary = Math.sin(x * wave.secondaryFreq + wave.phase * 0.4 + time * 0.09) * wave.secondaryAmp;
    var tertiary = Math.sin(x * 0.0015 + time * 0.04) * wave.amplitude * 0.15;
    var y = wave.baseY + primary + secondary + tertiary;

    if (isPressing && pressEffect > 0) {
      var dx = x - pressX;
      var dist = Math.abs(dx);
      var influence = Math.exp(-(dist * dist) / (W * 0.1));
      var dy = y - pressY;
      var pressCurve = Math.exp(-(dy * dy) / (H * 0.05));
      var press = influence * pressCurve * pressEffect;
      y += press * 45;
      y += press * Math.exp(-(dy * dy) / (H * 0.015)) * 20;
      }
    return y;
    }

  function drawMist(time) {
    for (var i = 0; i < mistParticles.length; i++) {
      var p = mistParticles[i];
      var speedMult = p.layer === 0 ? 0.55 : 1.0;
      p.x += p.speed * speedMult;
      p.y += Math.sin(p.breath + time * 0.18) * p.driftY * speedMult;

      // Mist ripples — local distortion from press
      for (var r = 0; r < mistRipples.length; r++) {
        var mr = mistRipples[r];
        var dx = p.x - mr.x;
        var dy = p.y - mr.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var rippleDist = Math.abs(dist - mr.radius);
        if (rippleDist < 80) {
          var push = Math.exp(-(rippleDist * rippleDist) / (80 * 80)) * mr.strength;
          p.x += (dx / dist) * push * 0.5;
          p.y += (dy / dist) * push * 0.3;
          }
        }

      if (p.x - p.radius > W) {
        p.x = -p.radius;
        p.y = p.layer === 0
           ? H * 0.06 + Math.random() * H * 0.5
           : H * 0.15 + Math.random() * H * 0.55;
        }

      var breathAlpha = p.alpha * (0.5 + 0.5 * Math.sin(time * 0.25 + p.phase));
      var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
      var c = p.color;
      grad.addColorStop(0, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + breathAlpha + ')');
      grad.addColorStop(0.5, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + (breathAlpha * 0.4) + ')');
      grad.addColorStop(1, 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',0)');

      ctx.fillStyle = grad;
      ctx.fillRect(p.x - p.radius, p.y - p.radius, p.radius * 2, p.radius * 2);
      }
    }

  function drawSplatters() {
    for (var i = 0; i < splatters.length; i++) {
      var s = splatters[i];
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + INK.r + ',' + INK.g + ',' + INK.b + ',' + s.a + ')';
      ctx.fill();
      }
    }

  function drawPressRipples() {
    for (var i = pressRipples.length - 1; i >= 0; i--) {
      var r = pressRipples[i];
      r.radius += 2.5;
      r.alpha -= 0.007;
      r.lineWidth -= 0.03;
      if (r.alpha <= 0 || r.lineWidth <= 0) {
        pressRipples.splice(i, 1);
        continue;
        }
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(' + INK.r + ',' + INK.g + ',' + INK.b + ',' + r.alpha + ')';
      ctx.lineWidth = Math.max(0.3, r.lineWidth);
      ctx.stroke();
      }
    }

  function drawPressEffect(time) {
    if (!isPressing) return;

    pressDepth = Math.min(pressDepth + 0.02, 1);
    wave.pressBoost = easeOutCubic(pressDepth);

    var easedDepth = easeOutCubic(pressDepth);

      // Ink pooling at press point
    var poolRadius = 100 + easedDepth * 180;
    var grad = ctx.createRadialGradient(pressX, pressY, 0, pressX, pressY, poolRadius);
    grad.addColorStop(0, 'rgba(' + INK.r + ',' + INK.g + ',' + INK.b + ',' + (easedDepth * 0.18) + ')');
    grad.addColorStop(0.5, 'rgba(' + INK_LIGHT.r + ',' + INK_LIGHT.g + ',' + INK_LIGHT.b + ',' + (easedDepth * 0.06) + ')');
    grad.addColorStop(1, 'rgba(' + INK.r + ',' + INK.g + ',' + INK.b + ',0)');
    ctx.fillStyle = grad;
    ctx.fillRect(pressX - poolRadius, pressY - poolRadius, poolRadius * 2, poolRadius * 2);

      // Mist disturbance — creates ripples in the mist
    if (pressDepth > 0.1 && pressDepth < 0.15) {
      mistRipples.push({
        x: pressX, y: pressY,
        radius: 5, alpha: 0.3, strength: 15
        });
      }

      // Ripple ring
    if (pressDepth < 0.06 && pressRipples.length < 10) {
      pressRipples.push({
        x: pressX, y: pressY, radius: 12, alpha: 0.3, lineWidth: 2.5
        });
      }
    }

  function updatePress() {
    if (!isPressing && pressDepth > 0) {
      pressDepth *= 0.93;
      wave.pressBoost *= 0.93;
      if (pressDepth < 0.001) {
        pressDepth = 0;
        wave.pressBoost = 0;
        }
      }

      // Update mist ripples
    for (var i = mistRipples.length - 1; i >= 0; i--) {
      var mr = mistRipples[i];
      mr.radius += 3;
      mr.strength *= 0.97;
      mr.alpha -= 0.008;
      if (mr.alpha <= 0 || mr.radius > W) {
        mistRipples.splice(i, 1);
        }
      }
    }

  function render(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    var dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
    lastTimestamp = timestamp;
    globalTime += dt;

      // Paper base
    if (paperImg) ctx.putImageData(paperImg, 0, 0);

      // Vignette
    var vignette = ctx.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(18,16,10,0.09)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

      // Mist — primary expressive material
    drawMist(globalTime);

      // Ink splatters
    drawSplatters();

      // Wave horizon — deepened inward by press
    var waveGrad = ctx.createLinearGradient(0, wave.baseY - wave.amplitude * 2.5, 0, wave.baseY + wave.amplitude * 3.5);

    var deepR = INK.r + Math.floor(wave.pressBoost * 15);
    var deepG = INK.g + Math.floor(wave.pressBoost * 12);
    var deepB = INK.b + Math.floor(wave.pressBoost * 20);

    waveGrad.addColorStop(0, 'rgba(' + deepR + ',' + deepG + ',' + deepB + ',' + (0.9 + wave.pressBoost * 0.1) + ')');
    waveGrad.addColorStop(0.3, 'rgba(' + INK_LIGHT.r + ',' + INK_LIGHT.g + ',' + INK_LIGHT.b + ',' + (0.75 + wave.pressBoost * 0.1) + ')');
    waveGrad.addColorStop(0.6, 'rgba(' + INK.r + ',' + INK.g + ',' + INK.b + ',' + (0.35 - wave.pressBoost * 0.05) + ')');
    waveGrad.addColorStop(1, 'rgba(' + PAPER.r + ',' + PAPER.g + ',' + PAPER.b + ',0)');

    ctx.beginPath();
    ctx.moveTo(0, H);
    for (var x = 0; x <= W; x += 1) {
      ctx.lineTo(x, getWaveY(x, globalTime, wave.pressBoost));
      }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fillStyle = waveGrad;
    ctx.fill();

      // Wave crest — the printed edge
    ctx.beginPath();
    for (var x2 = 0; x2 <= W; x2 += 1) {
      var y2 = getWaveY(x2, globalTime, wave.pressBoost);
      if (x2 === 0) ctx.moveTo(x2, y2);
      else ctx.lineTo(x2, y2);
      }
    ctx.strokeStyle = 'rgba(' + INK.r + ',' + INK.g + ',' + INK.b + ',' + (0.55 + wave.pressBoost * 0.2) + ')';
    ctx.lineWidth = 1.2 + wave.pressBoost * 0.5;
    ctx.stroke();

      // Press effects on top
    drawPressEffect(globalTime);
    drawPressRipples();

    updatePress();

    requestAnimationFrame(render);
    }

    // --- Input ---
  function getPointerPos(e) {
    var touch = e.touches ? e.touches[0] : e;
    return { x: touch.clientX, y: touch.clientY };
    }

  function onPointerDown(e) {
    e.preventDefault();
    isPressing = true;
    var pos = getPointerPos(e);
    pressX = pos.x;
    pressY = pos.y;
    pressDepth = 0;
    }

  function onPointerMove(e) {
    if (!isPressing) return;
    e.preventDefault();
    var pos = getPointerPos(e);
    pressX = pressX + (pos.x - pressX) * 0.35;
    pressY = pressY + (pos.y - pressY) * 0.35;
    }

  function onPointerUp() { isPressing = false; }

  canvas.addEventListener('mousedown', onPointerDown);
  canvas.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);
  canvas.addEventListener('touchstart', onPointerDown, { passive: false });
  canvas.addEventListener('touchmove', onPointerMove, { passive: false });
  window.addEventListener('touchend', onPointerUp);
  canvas.addEventListener('touchcancel', onPointerUp);

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space') {
      e.preventDefault();
      isPressing = true;
      pressX = W / 2;
      pressY = H / 2;
      pressDepth = 0;
      }
    });
  window.addEventListener('keyup', function(e) {
    if (e.code === 'Space') isPressing = false;
    });

    // --- Init ---
  resize();
  initMist();
  window.addEventListener('resize', function() { resize(); initMist(); });
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
