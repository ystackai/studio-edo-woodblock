<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rain Lantern 雨灯</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0e1a}
canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10;transition:opacity 1.2s ease;pointer-events:none}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay .hint{color:rgba(200,180,160,0.7);font-family:'Noto Serif',serif;font-size:clamp(0.9rem,2.5vw,1.3rem);letter-spacing:0.15em;text-align:center;line-height:1.8}
#overlay .hint .jp{font-size:clamp(1.8rem,5vw,3rem);display:block;margin-bottom:0.5em;color:rgba(220,180,140,0.5)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
   <span class="jp">雨灯</span>
   <div class="hint">Touch to begin<br>Hold to shield the flame</div>
</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W,H,lanternX,lanternY,lanternR;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  lanternX=W/2;lanternY=H*0.42;
  lanternR=Math.min(W,H)*0.12;
  if(lanternR>90)lanternR=90;if(lanternR<40)lanternR=40;
  initGrain();
}
window.addEventListener('resize',resize);
resize();
var grainCanvas,grainCtx;
function initGrain(){
  grainCanvas=document.createElement('canvas');
  grainCanvas.width=256;grainCanvas.height=256;
  grainCtx=grainCanvas.getContext('2d');
  var img=grainCtx.createImageData(256,256);
  for(var i=0;i<img.data.length;i+=4){
    var v=Math.random()*25;
    img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=18;
  }
  grainCtx.putImageData(img,0,0);
}
initGrain();
var RAIN_COUNT=200,raindrops=[];
for(var i=0;i<RAIN_COUNT;i++){
  raindrops.push({
    x:Math.random()*1.4*W-0.2*W,y:Math.random()*H,
    len:8+Math.random()*18,speed:4+Math.random()*6,
    opacity:0.08+Math.random()*0.2,wind:2.5+Math.random()*1.5
  });
}
function updateRain(dt){
  for(var i=0;i<raindrops.length;i++){
    var r=raindrops[i];
    r.x+=r.wind*dt*60;r.y+=r.speed*dt*60;
    if(r.y>H+20){r.y=-r.len-Math.random()*50;r.x=Math.random()*1.4*W-0.2*W;}
  }
}
function drawRain(){
  ctx.save();
  for(var i=0;i<raindrops.length;i++){
    var r=raindrops[i];
    ctx.globalAlpha=r.opacity;ctx.strokeStyle='#a8b4c0';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(r.x,r.y);
    ctx.lineTo(r.x+r.wind*0.5,r.y+r.len);ctx.stroke();
  }
  ctx.restore();
}
function drawSky(){
  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0f1119');grad.addColorStop(0.3,'#1a1e2e');
  grad.addColorStop(0.6,'#2a2535');grad.addColorStop(1,'#1e1828');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
}
function drawMountains(){
  ctx.save();ctx.fillStyle='#14161e';ctx.beginPath();ctx.moveTo(0,H);
  var segments=12,segW=W/segments;
  for(var i=0;i<=segments;i++){
    var x=i*segW,baseH=H*0.55;
    var peak=Math.sin(i*0.7+1)*H*0.12+Math.sin(i*1.3+3)*H*0.06+Math.sin(i*0.3)*H*0.04;
    ctx.lineTo(x,baseH-peak);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.fillStyle='#111318';ctx.beginPath();ctx.moveTo(0,H);
  for(var i=0;i<=segments;i++){
    var x=i*segW,baseH=H*0.65;
    var peak=Math.sin(i*0.9+2)*H*0.08+Math.sin(i*1.7+1)*H*0.05;
    ctx.lineTo(x,baseH-peak);
  }
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.restore();
}
var bambooStalks=[];
function initBamboo(){
  bambooStalks=[];
  for(var i=0;i<5;i++){
    bambooStalks.push({
      x:W*(0.78+Math.random()*0.18),baseY:H,
      topY:H*(0.15+Math.random()*0.2),
      segments:4+Math.floor(Math.random()*4),leaves:Math.floor(Math.random()*4),
      sway:Math.random()*0.3
    });
  }
}
initBamboo();
window.addEventListener('resize',initBamboo);
function drawBamboo(time){
  ctx.save();ctx.strokeStyle='#0e1015';ctx.lineWidth=3;ctx.lineCap='round';
  for(var bI=0;bI<bambooStalks.length;bI++){
    var b=bambooStalks[bI];
    var sway=Math.sin(time*0.3+b.sway*10)*b.sway*8;
    var segH=(b.baseY-b.topY)/b.segments;
    ctx.beginPath();var px=b.x+sway*0.3,py=b.baseY;ctx.moveTo(px,py);
    for(var s=0;s<b.segments;s++){
      px+=(b.x+sway-px)*0.15+sway*0.05;py-=segH;ctx.lineTo(px,py);
      ctx.moveTo(px-3,py);ctx.lineTo(px+3,py);ctx.moveTo(px-3,py);ctx.lineTo(px+3,py);
    }
    ctx.lineTo(px+sway*0.5,b.topY);ctx.stroke();
    for(var l=0;l<b.leaves;l++){
      var leafY=b.topY+(b.segments-l)*segH*0.4,leafX=px+sway*0.3;
      var dir=l%2===0?1:-1;
      ctx.strokeStyle='#0b0d12';ctx.lineWidth=1.5;ctx.beginPath();
      ctx.moveTo(leafX,leafY);
      ctx.quadraticCurveTo(leafX+dir*15,leafY-5,leafX+dir*25+Math.sin(time*0.5+l)*3,leafY+2);
      ctx.stroke();
    }
  }
  ctx.restore();
}
var flameFlicker=0,shieldIntensity=0,flameSteadiness=0;
var shieldHandX=0,shieldHandY=0,shieldHandAlpha=0;
var sparks=[];
var sparkTimer=0;
var shieldTargetX=0,shieldTargetY=0,isShielding=false;
function drawLantern(time){
  var r=lanternR,cx=lanternX,cy=lanternY;
  ctx.save();ctx.strokeStyle='#3a3530';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,cy-r-5);ctx.stroke();
  ctx.fillStyle='#2a2520';
  ctx.fillRect(cx-r*0.3,cy-r-8,r*0.6,8);
  ctx.fillRect(cx-r*0.25,cy+r,r*0.5,6);
  ctx.restore();
  var glowR=r*2.8;
  var glow=ctx.createRadialGradient(cx,cy,r*0.5,cx,cy,glowR);
  var baseGlow=0.15+flameSteadiness*0.12;
  glow.addColorStop(0,'rgba(230,140,60,'+baseGlow+')');
  glow.addColorStop(0.4,'rgba(200,100,40,'+(baseGlow*0.5)+')');
  glow.addColorStop(1,'rgba(180,80,30,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,glowR,0,Math.PI*2);ctx.fill();
  var bodyGrad=ctx.createLinearGradient(cx-r,cy-r*0.7,cx+r,cy+r*0.7);
  bodyGrad.addColorStop(0,'#b83220');bodyGrad.addColorStop(0.3,'#d44530');
  bodyGrad.addColorStop(0.5,'#e85538');bodyGrad.addColorStop(0.7,'#c83a28');
  bodyGrad.addColorStop(1,'#a02818');
  ctx.fillStyle=bodyGrad;ctx.beginPath();
  ctx.ellipse(cx,cy,r,r*1.15,0,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.clip();ctx.globalAlpha=0.15;
  ctx.drawImage(grainCanvas,cx-r*1.2,cy-r*1.3,r*2.4,r*2.6);
  ctx.globalAlpha=1;ctx.restore();
  ctx.save();ctx.globalAlpha=0.3;
  for(var i=0;i<8;i++){
    var angle=(i/8)*Math.PI*2+time*0.1;
    var dr=r*(0.3+Math.sin(i*1.7)*0.35);
    var dx=cx+Math.cos(angle)*dr,dy=cy+Math.sin(angle)*dr*1.1;
    var dropR=1+Math.sin(i*2.3+time*0.5)*0.5;
    ctx.fillStyle='rgba(180,200,220,0.4)';
    ctx.beginPath();ctx.ellipse(dx,dy,dropR,dropR*1.8,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  ctx.save();ctx.strokeStyle='rgba(80,30,20,0.4)';ctx.lineWidth=1;
  for(var i=-3;i<=3;i++){
    var ry=cy+i*r*0.28;
    var rx=r*Math.sqrt(Math.max(0,1-(i*0.28)*(i*0.28)));
    ctx.beginPath();ctx.moveTo(cx-rx,ry);
    ctx.quadraticCurveTo(cx,ry+2,cx+rx,ry);ctx.stroke();
  }
  ctx.restore();
  flameFlicker+=0.05;
  var flickerAmt=(1-flameSteadiness)*0.4+Math.sin(flameFlicker)*0.15;
  var flameAlpha=0.6+flickerAmt*0.4;
  var innerGlow=ctx.createRadialGradient(cx,cy+r*0.1,0,cx,cy+r*0.1,r*0.7);
  innerGlow.addColorStop(0,'rgba(255,220,120,'+(flameAlpha*0.7)+')');
  innerGlow.addColorStop(0.3,'rgba(255,180,60,'+(flameAlpha*0.3)+')');
  innerGlow.addColorStop(1,'rgba(255,140,30,0)');
  ctx.fillStyle=innerGlow;ctx.beginPath();ctx.arc(cx,cy+r*0.1,r*0.7,0,Math.PI*2);ctx.fill();
  var flameH=r*(0.35+flickerAmt*0.15),flameW=r*(0.12+flickerAmt*0.05);
  var fx=cx+Math.sin(flameFlicker*1.5)*flickerAmt*3,fy=cy+r*0.05;
  ctx.save();ctx.globalAlpha=flameAlpha*0.9;
  var flameGrad=ctx.createLinearGradient(fx,fy+flameH*0.3,fx,fy-flameH);
  flameGrad.addColorStop(0,'#ffdd66');flameGrad.addColorStop(0.4,'#ffaa33');
  flameGrad.addColorStop(1,'rgba(255,100,20,0)');
  ctx.fillStyle=flameGrad;ctx.beginPath();
  ctx.moveTo(fx-flameW,fy+flameH*0.3);
  ctx.quadraticCurveTo(fx-flameW*0.5,fy-flameH*0.3,fx,fy-flameH);
  ctx.quadraticCurveTo(fx+flameW*0.5,fy-flameH*0.3,fx+flameW,fy+flameH*0.3);
  ctx.quadraticCurveTo(fx,fy+flameH*0.15,fx-flameW,fy+flameH*0.3);
  ctx.fill();ctx.restore();
  ctx.save();ctx.globalAlpha=0.04;
  // Floating sparks when flame is steady
  sparkTimer+=0.016;
  if(flameSteadiness>0.5&&sparks.length<15){
    if(Math.random()<flameSteadiness*0.15){
      sparks.push({x:cx+Math.random()*r*0.6-r*0.3,y:cy+r*0.1,vy:-0.3-Math.random()*0.5,vx:(Math.random()-0.5)*0.2,life:1,alpha:flameSteadiness*0.5*(0.5+Math.random()*0.5),size:1+Math.random()*1.5});
     }
   }
  for(var sI=sparks.length-1;sI>=0;sI--){
    var sp=sparks[sI];
    sp.x+=sp.vx;sp.y+=sp.vy;sp.life-=0.008;sp.alpha=Math.max(0,sp.life*flameSteadiness*0.6);
    if(sp.life<=0){sparks.splice(sI,1);continue;}
    ctx.save();ctx.globalAlpha=sp.alpha;ctx.fillStyle='rgba(255,200,100)';
    ctx.beginPath();ctx.arc(sp.x,sp.y,sp.size,0,Math.PI*2);ctx.fill();ctx.restore();
   }
  ctx.drawImage(grainCanvas,0,0,W,H);ctx.restore();
}
function drawHand(time){
  if(shieldHandAlpha<0.01)return;
  ctx.save();ctx.globalAlpha=shieldHandAlpha*0.7;
  var hx=shieldHandX,hy=shieldHandY,scale=lanternR*0.9;
  ctx.fillStyle='#0e0e1a';ctx.beginPath();
  ctx.ellipse(hx,hy+scale*0.15,scale*0.35,scale*0.3,0,0,Math.PI*2);ctx.fill();
  var dirs=[-0.8,-0.4,0,0.4,0.8];
  for(var fI=0;fI<5;fI++){
    var a=dirs[fI]+Math.PI/2,flen=scale*(0.35-Math.abs(fI-2)*0.05);
    ctx.beginPath();ctx.ellipse(
      hx+Math.cos(a-Math.PI/2)*scale*0.15,
      hy-scale*0.1+Math.sin(a-Math.PI/2)*scale*0.1-flen*0.5,
      scale*0.06,flen*0.5,a,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
function drawGround(){
  var gY=H*0.82;
  var grad=ctx.createLinearGradient(0,gY,0,H);
  grad.addColorStop(0,'#0e1018');grad.addColorStop(1,'#0a0c12');
  ctx.fillStyle=grad;ctx.fillRect(0,gY,W,H-gY);
  ctx.save();ctx.globalAlpha=0.12+flameSteadiness*0.08;
  var refGrad=ctx.createRadialGradient(lanternX,gY+20,0,lanternX,gY+20,lanternR*2);
  refGrad.addColorStop(0,'rgba(230,140,60,0.3)');
  refGrad.addColorStop(1,'rgba(200,100,40,0)');
  ctx.fillStyle=refGrad;ctx.beginPath();
  ctx.ellipse(lanternX,gY+20,lanternR*2,lanternR*0.4,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
var audioCtx=null,rainNode=null,rainGain=null,rainFilter=null,audioStarted=false;
var rumbleNode=null,rumbleGain=null;
function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    var bufSize=audioCtx.sampleRate*3;
    var buffer=audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
    var data=buffer.getChannelData(0);
    for(var i=0;i<bufSize;i++){data[i]=(Math.random()*2-1);}
    rainNode=audioCtx.createBufferSource();
    rainNode.buffer=buffer;rainNode.loop=true;
    rainGain=audioCtx.createGain();rainGain.gain.value=0;
    rainFilter=audioCtx.createBiquadFilter();
    rainFilter.type='bandpass';rainFilter.frequency.value=2500;rainFilter.Q.value=0.4;
    rainNode.connect(rainFilter);rainFilter.connect(rainGain);rainGain.connect(audioCtx.destination);
    rainNode.start();
    var rumbleBuf=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate);
    var rumbleData=rumbleBuf.getChannelData(0);
    for(var i=0;i<rumbleBuf.length;i++){rumbleData[i]=(Math.random()*2-1)*0.5;}
    rumbleNode=audioCtx.createBufferSource();
    rumbleNode.buffer=rumbleBuf;rumbleNode.loop=true;
    rumbleGain=audioCtx.createGain();rumbleGain.gain.value=0;
    var rumbleFilter=audioCtx.createBiquadFilter();
    rumbleFilter.type='lowpass';rumbleFilter.frequency.value=400;
    rumbleNode.connect(rumbleFilter);rumbleFilter.connect(rumbleGain);
    rumbleGain.connect(audioCtx.destination);
    rumbleNode.start();
    audioStarted=true;
   }catch(e){}
}
var overlay=document.getElementById('overlay');
function onStart(x,y){
  if(!audioStarted)initAudio();
  isShielding=true;shieldTargetX=lanternX;shieldTargetY=lanternY-lanternR*0.6;
  shieldHandX=shieldTargetX;shieldHandY=shieldTargetY;
  overlay.classList.add('hidden');
}
function onEnd(){isShielding=false;}
canvas.addEventListener('pointerdown',function(e){e.preventDefault();onStart(e.clientX,e.clientY);});
canvas.addEventListener('pointerup',function(e){e.preventDefault();onEnd();});
canvas.addEventListener('pointerleave',function(e){e.preventDefault();onEnd();});
canvas.addEventListener('pointercancel',function(e){e.preventDefault();onEnd();});
canvas.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];onStart(t.clientX,t.clientY);},{passive:false});
canvas.addEventListener('touchend',function(e){e.preventDefault();onEnd();},{passive:false});
canvas.addEventListener('touchcancel',function(e){e.preventDefault();onEnd();},{passive:false});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();
    if(!audioStarted)initAudio();
    isShielding=true;shieldTargetX=lanternX;shieldTargetY=lanternY-lanternR*0.6;
    shieldHandX=shieldTargetX;shieldHandY=shieldTargetY;
    overlay.classList.add('hidden');
  }
});
window.addEventListener('keyup',function(e){if(e.code==='Space'){e.preventDefault();onEnd();}});
var lastTime=0;
function loop(time){
  var dt=lastTime?Math.min((time-lastTime)/1000,0.05):0.016;lastTime=time;
  var shieldTarget=isShielding?1:0;
  shieldIntensity+=(shieldTarget-shieldIntensity)*(isShielding?0.08:0.05);
  if(isShielding){flameSteadiness=Math.min(1,flameSteadiness+dt*0.35);}
  else{flameSteadiness=Math.max(0,flameSteadiness-dt*0.12);}
  if(rainGain&&audioCtx){
    var targetVol=shieldIntensity*0.18;
    rainGain.gain.value+=(targetVol-rainGain.gain.value)*0.06;
    rumbleGain.gain.value+=(targetVol*0.15-rumbleGain.gain.value)*0.04;
   }
  shieldHandX+=(shieldTargetX-shieldHandX)*(isShielding?0.06:0.08);
  shieldHandY+=(shieldTargetY-shieldHandY)*(isShielding?0.06:0.08);
  shieldHandAlpha=shieldIntensity;
  updateRain(dt);
  ctx.clearRect(0,0,W,H);
  drawSky();drawMountains();drawBamboo(time/1000);drawGround();drawRain();drawLantern(time/1000);drawHand(time/1000);
  var vig=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.9);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
