<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>River Lantern — drift downstream at dusk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0c1520;
  font-family:system-ui,-apple-system,sans-serif}
#wrap{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;
  background:linear-gradient(#0c1520,#1a1035 60%)}
canvas{display:block;touch-action:none;border-radius:4px;
  box-shadow:0 4px 40px rgba(0,0,0,.5);background:#1e5a6e}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  font-size:12px;color:rgba(255,230,190,.45);pointer-events:none;user-select:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" width="800" height="500"></canvas>
  <div id="hint">click / tap to steer &bull; arrow keys or W/S to move</div>
</div>
<script src="game-loop.js"></script>
<script src="input.js"></script>
<script src="game.js"></script>
</body>
</html>
